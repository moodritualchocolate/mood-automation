<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#e9dfc8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>MOOD · רגע</title>
<style>
:root{
  --paper:#efe6d4; --sheet:#f4eede; --ink:#38312a; --ink-soft:#655c4b; --faint:#9a8f78;
  --olive:#6d7a4c; --olive-d:#586440; --terra:#b06a45; --dusk:#8a7f93; --line:#ddd0b6; --gold:#c9a25e;
  --serif:'Frank Ruhl Libre','David Libre','Times New Roman',serif;
  --sans:'Heebo','Assistant','Arial Hebrew',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0c0a07;color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden;position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100vw;height:100dvh;max-width:calc(100dvh*9/16);background:var(--paper);overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.7);perspective:950px;perspective-origin:50% 42%}
.screen{position:absolute;inset:0;z-index:2;opacity:0;visibility:hidden;transition:opacity .95s cubic-bezier(.4,0,.2,1)}
.screen.on{opacity:1;visibility:visible}
.screen.out{opacity:0;transition:opacity .95s cubic-bezier(.4,0,.2,1)}

/* ---- living diorama ---- */
.diorama{position:absolute;inset:0;overflow:hidden;background:var(--paper);background-size:cover;background-position:center 20%}
.layer{position:absolute;inset:-16%;background-size:cover;background-position:center 20%;will-change:transform;backface-visibility:hidden;transition:transform .2s cubic-bezier(.2,.7,.2,1),filter 5.5s ease}
.layer.fg{background-size:contain;background-repeat:no-repeat;background-position:center 20%}
.layer.shadow{filter:blur(18px) brightness(0);opacity:.34;background-size:contain;background-repeat:no-repeat;background-position:center 20%}
.vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 70px 70px -55px rgba(50,38,15,.4), inset 0 -40px 70px -35px rgba(50,38,15,.3)}
.dim{position:absolute;inset:0;background:rgba(233,223,200,0);transition:background 1.1s;pointer-events:none}
.dim.on{background:rgba(233,223,200,.74)}
/* future-echo wash — desaturates & cools the scene into a faded "later" */
.wash{position:absolute;inset:0;z-index:3;pointer-events:none;background:#8f8f98;mix-blend-mode:saturation;opacity:0;transition:opacity 2.6s ease}
.wash.on{opacity:.62}
/* standalone limit badge (mission / light mission) */
.lim{display:inline-block;font-size:12px;letter-spacing:.05em;color:var(--olive-d);background:rgba(109,122,76,.12);
  border:1px solid rgba(109,122,76,.34);padding:4px 13px;border-radius:14px;font-weight:600}
/* ---- the camera (Spielberg push-in / rack / tilt) ---- */
.cam{position:absolute;inset:0;will-change:transform;transform-origin:50% 40%;transform-style:preserve-3d}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;transition:transform .22s cubic-bezier(.2,.7,.2,1)}
/* ---- god-light (motivated warm beam that breathes & swells) ---- */
.godlight{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 2.8s ease;
  background:radial-gradient(58% 42% at 50% 30%,rgba(255,241,203,.5),transparent 62%),
             linear-gradient(202deg,rgba(255,242,208,.32),transparent 42%);
  mix-blend-mode:soft-light}
.godlight.on{opacity:1;animation:lightbreath 7.5s ease-in-out infinite}
@keyframes lightbreath{0%,100%{opacity:.72}50%{opacity:1}}
/* ---- cinematic letterbox bars ---- */
.bars{position:absolute;left:0;right:0;height:0;background:#0b0906;z-index:5;pointer-events:none;
  transition:height 1.5s cubic-bezier(.72,0,.28,1)}
.bars.t{top:0}.bars.b{bottom:0}
.diorama.cine .bars{height:8.5%}

.top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 22px 0;z-index:8}
.bk{background:rgba(244,238,222,.6);backdrop-filter:blur(6px);border:none;color:var(--ink-soft);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bk svg{width:20px;height:20px}
.rgv{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;background:rgba(244,238,222,.6);backdrop-filter:blur(6px);padding:8px 14px;border-radius:20px}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-radius:30px 30px 0 0;
  box-shadow:0 -22px 55px -22px rgba(50,38,18,.45), 0 -1px 0 rgba(201,162,94,.25);
  padding:26px clamp(22px,7vw,34px) max(26px,calc(env(safe-area-inset-bottom) + 22px));
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px;transform:translateY(30px);opacity:0;transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .5s}
.sheet.up{transform:none;opacity:1}
.sheet::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:3px;background:var(--line)}
.mid{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:0 34px;text-align:center}

.kick{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive-d);font-weight:600;opacity:0}
.line{font-family:var(--serif);font-weight:500;line-height:1.4;color:var(--ink);white-space:pre-line;text-wrap:balance;opacity:0}
.line.accent{color:var(--terra)}
.line.s{font-family:var(--sans);font-weight:400;color:var(--ink-soft);line-height:1.6;font-size:clamp(14px,4vw,16px)}
.line.m{font-size:clamp(19px,5.6vw,23px)} .line.l{font-size:clamp(22px,6.4vw,27px)}
.line.xl{font-size:clamp(26px,8vw,34px);line-height:1.3;color:#f3ead6;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.show{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.line.accent.show{animation:riseA 1.25s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes riseA{0%{opacity:0;transform:translateY(16px) scale(.97)}60%{opacity:1}100%{opacity:1;transform:none}}
.acts{display:flex;flex-direction:column;gap:11px;width:100%;max-width:380px;margin-top:8px;opacity:0}
.acts.show{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.btn{position:relative;overflow:hidden;min-height:60px;border:1px solid rgba(201,162,94,.32);border-radius:34px;cursor:pointer;
  font-family:var(--sans);font-weight:600;font-size:clamp(15px,4.6vw,17px);letter-spacing:.01em;color:#fbf7ee;padding:8px 18px;line-height:1.3;
  box-shadow:0 14px 28px -12px rgba(60,45,20,.7), inset 0 2px 0 rgba(255,255,255,.22), inset 0 -3px 8px rgba(0,0,0,.14);
  transition:transform .16s cubic-bezier(.2,.7,.2,1), box-shadow .22s, opacity .3s, filter .3s}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 6px 14px -10px rgba(60,45,20,.6), inset 0 2px 6px rgba(0,0,0,.2)}
.btn.olive{background:linear-gradient(165deg,#8c9a64,#5c6842 72%,#4b5535)}
.btn.dusk{background:linear-gradient(165deg,#a49aae,#6f6580 78%,#5d5470)}
.btn::after{content:"";position:absolute;top:0;left:-45%;width:34%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:sheen 5.5s ease-in-out infinite}
@keyframes sheen{0%,58%{left:-45%}82%{left:125%}100%{left:125%}}
.btn.picked{transform:scale(1.035);box-shadow:0 18px 34px -12px rgba(88,100,64,.75), 0 0 0 2px rgba(201,162,94,.5)}
.btn.dim{opacity:.38;filter:saturate(.6)}
.btn.soft{background:rgba(255,255,255,.66);color:var(--ink);border:1.5px solid var(--line);font-weight:500;
  box-shadow:0 7px 18px -9px rgba(60,45,20,.4), inset 0 1px 0 rgba(255,255,255,.6)}
.btn.soft::after{display:none}
.btn.soft:active{transform:translateY(1px) scale(.985)}
.btn.soft.picked{background:linear-gradient(165deg,#8c9a64,#5c6842);color:#fbf7ee;border-color:transparent;transform:scale(1.02)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid rgba(120,100,60,.22);box-shadow:none;font-weight:500;min-height:48px}
.btn.ghost::after{display:none}
.mtag{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:22px;background:rgba(109,122,76,.15);border:1px solid rgba(109,122,76,.45);color:var(--olive-d);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.tap{position:absolute;left:0;right:0;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));text-align:center;font-size:12px;color:rgba(60,45,20,.55);letter-spacing:.1em;z-index:7;animation:blink 2.8s ease-in-out infinite;pointer-events:none}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:.7}}

.open{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:0 34px;background:radial-gradient(130% 80% at 50% 32%,#f7f0dd,var(--paper) 58%,#e6dcc6)}
.halo{width:104px;height:104px;border-radius:50%;margin-bottom:4px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(176,106,69,.3),transparent 66%);animation:breath 5s ease-in-out infinite}
.halo::after{content:"";width:13px;height:13px;border-radius:50%;background:var(--terra);box-shadow:0 0 24px var(--terra)}
@keyframes breath{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.13);opacity:1}}
.breathe{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:9;background:radial-gradient(circle at 50% 45%,rgba(239,230,212,.46),rgba(233,223,200,.95) 66%);opacity:0;visibility:hidden;transition:opacity 1.1s}
.breathe.on{opacity:1;visibility:visible}
.breathe .ring{width:136px;height:136px;border-radius:50%;border:1.5px solid var(--olive);display:flex;align-items:center;justify-content:center;color:var(--olive-d);font-family:var(--serif);font-size:17px;animation:breath 4.6s ease-in-out infinite;box-shadow:0 0 40px -10px rgba(109,122,76,.5)}
.breathe .sub{font-size:14px;color:var(--ink-soft);max-width:26ch;line-height:1.6}
.note{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 40px;text-align:center;background:radial-gradient(120% 80% at 50% 40%,#f7f0dd,#e7ddC4);background:radial-gradient(120% 80% at 50% 40%,#f7f0dd,#e7ddc4)}
.note .leaf{color:var(--olive);opacity:.75}.note .leaf svg{width:30px;height:30px}
.note .rule{width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.bloom{position:absolute;inset:0;pointer-events:none;z-index:7}
/* ---- the reckoning: dark cold-open that grabs you ---- */
.reckon{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(125% 95% at 50% 44%,#181209,#0b0906 72%);padding:0 40px;text-align:center;overflow:hidden;cursor:pointer}
.reckon .rimg{position:absolute;inset:0;background-size:cover;background-position:center 20%;z-index:1;opacity:0;
  filter:brightness(.3) saturate(.68) contrast(1.06);transform:scale(1.12);
  transition:opacity 2.2s ease,filter 3s ease,transform 10s ease;will-change:transform,opacity}
.reckon .rimg.on{opacity:.5;transform:scale(1.22)}
.reckon .rimg.warm{filter:brightness(.78) saturate(1.02) contrast(1);opacity:.82}
.reckon .rdark{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(125% 92% at 50% 44%,rgba(11,9,6,.32),rgba(11,9,6,.9) 80%)}
.reckon .ember{position:absolute;top:44%;left:50%;width:7px;height:7px;border-radius:50%;background:#eab86a;
  box-shadow:0 0 46px 16px rgba(234,184,106,.55),0 0 120px 40px rgba(234,184,106,.18);
  transform:translate(-50%,-50%) scale(0);opacity:0;transition:transform 3.4s ease,opacity 3.4s ease}
.reckon .ember.on{transform:translate(-50%,-50%) scale(1);opacity:.95;animation:emberpulse 4.5s ease-in-out infinite}
@keyframes emberpulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.reckon .glow{position:absolute;inset:0;opacity:0;transition:opacity 3s ease;pointer-events:none;
  background:radial-gradient(70% 55% at 50% 44%,rgba(234,184,106,.22),transparent 60%)}
.reckon .glow.on{opacity:1}
.rline{font-family:var(--serif);font-weight:500;color:#e9e0cf;font-size:clamp(25px,7.4vw,36px);line-height:1.42;white-space:pre-line;
  opacity:0;transform:translateY(12px);transition:opacity 1.5s ease,transform 1.5s ease;max-width:15ch;position:relative;z-index:2;text-wrap:balance}
.rline.on{opacity:1;transform:none}
.rline.big{font-family:var(--sans);font-size:clamp(64px,26vw,140px);font-weight:700;color:#f1dcac;line-height:1;letter-spacing:-.02em}
.rline.accent{color:#eab86a}
.rline.soft{font-size:clamp(19px,5.4vw,24px);color:#b9ac93;font-weight:400}
.rcta{position:absolute;bottom:11%;z-index:3;opacity:0;transition:opacity 1.4s ease;width:100%;max-width:330px;padding:0 40px}
.rcta.on{opacity:1}
.rskip{position:absolute;top:max(16px,env(safe-area-inset-top));left:22px;z-index:4;color:rgba(233,224,207,.4);font-size:12px;letter-spacing:.1em;background:none;border:none;cursor:pointer;font-family:var(--sans)}
.mute{position:absolute;top:max(14px,env(safe-area-inset-top));left:22px;z-index:9;width:34px;height:34px;border-radius:50%;
  border:none;cursor:pointer;background:rgba(244,238,222,.5);backdrop-filter:blur(6px);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s}
.mute.on{opacity:.8}.mute svg{width:17px;height:17px}
/* ---- the mission board (home: where you start & return) ---- */
.board{position:absolute;inset:0;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(150% 62% at 50% 0%,#f8f1de,var(--paper) 52%,#e6dcc6);
  padding:calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 40px)}
.board-h{text-align:center;margin:0 auto 24px;max-width:440px}
.board-h .line{opacity:1}
.board-note{text-align:center;color:var(--faint);font-size:12px;letter-spacing:.06em;margin-top:26px}
.progress{display:flex;align-items:center;justify-content:center;gap:7px;margin:16px auto 0}
.progress .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.progress .dot.f{background:var(--olive)}
.cards{display:flex;flex-direction:column;gap:13px;max-width:440px;margin:0 auto}
.card{position:relative;display:flex;align-items:center;gap:15px;text-align:right;width:100%;
  background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:17px 19px;cursor:pointer;font-family:inherit;
  box-shadow:0 12px 26px -18px rgba(60,45,20,.55);transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
.card:active{transform:scale(.985);box-shadow:0 6px 16px -12px rgba(60,45,20,.5)}
.card .ic{width:48px;height:48px;flex-shrink:0;border-radius:15px;display:flex;align-items:center;justify-content:center;background:rgba(109,122,76,.13)}
.card .ic svg{width:24px;height:24px;color:var(--olive-d)}
.card .ic.thumb{width:66px;height:66px;border-radius:16px;background-size:cover;background-position:center 16%;
  box-shadow:inset 0 0 0 1px rgba(120,95,50,.18), 0 6px 14px -8px rgba(60,45,20,.5)}
.card.cine{padding:15px 17px}
.card.cine .tt{font-size:20px}
.card .tx{flex:1;min-width:0}
.card .tt{display:block;font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:500;line-height:1.25}
.card .sb{display:block;font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.4}
.card .lim{display:inline-block;margin-top:9px;font-size:11px;letter-spacing:.06em;color:var(--olive-d);
  background:rgba(109,122,76,.12);border:1px solid rgba(109,122,76,.32);padding:3px 11px;border-radius:13px;font-weight:600}
.card .chk{position:absolute;top:15px;left:17px;width:20px;height:20px;color:var(--olive);opacity:0;transition:opacity .3s}
.card .chk svg{width:20px;height:20px}
.card.done{opacity:.66}.card.done .chk{opacity:1}.card.done .ic{background:rgba(109,122,76,.28)}
.card.rise{animation:cardin .6s cubic-bezier(.16,1,.3,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.lmbk{position:absolute;top:max(14px,env(safe-area-inset-top));right:22px;z-index:8}
.sec-h{max-width:440px;margin:0 auto 11px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive-d);font-weight:700;text-align:right;padding:0 4px}
/* live 24h commitment card */
.card.commit{border-color:rgba(109,122,76,.4);background:linear-gradient(180deg,#f6f1e2,var(--sheet))}
.card .clock{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--olive-d);font-variant-numeric:tabular-nums}
.card .clock.over{color:var(--terra)}
.card .ret{position:absolute;top:50%;left:16px;transform:translateY(-50%) scaleX(-1);color:var(--olive);opacity:.7}
.card .ret svg{width:22px;height:22px}
.booklink{display:flex;align-items:center;justify-content:center;gap:9px;margin:22px auto 0;max-width:440px;width:100%;
  background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:18px;padding:13px;cursor:pointer;
  font-family:var(--serif);font-size:15px;color:var(--ink-soft)}
.booklink svg{width:18px;height:18px;color:var(--olive)}
/* the personal book */
.book{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:26px 20px calc(env(safe-area-inset-bottom) + 26px);
  background:radial-gradient(150% 90% at 50% 20%,#e7dcc2,#cdbf9d)}
.page{position:relative;width:100%;max-width:440px;min-height:60vh;display:flex;flex-direction:column;
  background:linear-gradient(160deg,#fbf6e9,#f2ead4);border-radius:6px 16px 16px 6px;
  box-shadow:0 26px 60px -24px rgba(50,38,15,.6), inset 5px 0 12px -6px rgba(120,95,50,.28), inset 0 1px 0 rgba(255,255,255,.6);
  padding:28px 30px 26px}
.page::before{content:"";position:absolute;top:6%;bottom:6%;right:16px;width:1px;background:linear-gradient(transparent,rgba(176,106,69,.25),transparent)}
.page-head{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--faint);margin-bottom:22px;text-transform:uppercase}
.ink{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
.ink-line{font-family:var(--serif);font-size:clamp(21px,6vw,26px);line-height:1.5;color:#4a3a26}
.ink-line.head{font-weight:700;font-size:clamp(24px,7vw,30px);color:#3a2c1a}
.ink-line.quote{font-style:italic;color:var(--terra);font-size:clamp(19px,5.4vw,23px)}
.ink-word{opacity:0;filter:blur(3px);transition:opacity .5s ease,filter .6s ease}
.ink-word.on{opacity:1;filter:blur(0)}
/* reflection input */
.reflect{width:100%;max-width:360px;background:rgba(255,255,255,.75);border:1.5px solid var(--line);border-radius:18px;
  padding:14px 16px;font-family:var(--serif);font-size:18px;color:var(--ink);resize:none;outline:none;line-height:1.5;
  box-shadow:inset 0 2px 6px rgba(60,45,20,.08)}
.reflect:focus{border-color:var(--olive)}
.reflect::placeholder{color:var(--faint);font-family:var(--sans);font-size:14px}
/* book shelf */
.shelf{display:flex;flex-direction:column;gap:12px;max-width:440px;margin:0 auto}
.shelf-item{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:15px 17px;text-align:right;
  box-shadow:0 8px 20px -14px rgba(60,45,20,.4)}
.shelf-d{font-size:11px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.shelf-t{font-family:var(--serif);font-size:18px;color:var(--ink);margin-top:4px}
.shelf-c{font-size:13px;color:var(--ink-soft);margin-top:3px}
.shelf-w{font-family:var(--serif);font-style:italic;color:var(--terra);font-size:15px;margin-top:6px;line-height:1.4}
/* ---- the hero / main screen · Apple-technological ---- */
.hero{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;padding:0 38px;
  background:radial-gradient(125% 95% at 50% 16%,#241a11,#0c0906 68%)}
.aurora{position:absolute;inset:-25%;pointer-events:none;opacity:.95;will-change:transform;

let M=MOMENT;let branch=null,hist=[],activeMission=null;
const KEY="mood_moments_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{steps:0}}catch(e){return{steps:0}}};
const save=s=>localStorage.setItem(KEY,JSON.stringify(s));
// ---- board state: which missions were done today (daily rhythm, no penalty across days) ----
const BKEY="mood_board_v1";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
function boardState(){try{const s=JSON.parse(localStorage.getItem(BKEY));if(s&&s.date===today())return s;}catch(e){}return{date:today(),done:[]};}
function saveBoard(s){s.date=today();try{localStorage.setItem(BKEY,JSON.stringify(s));}catch(e){}}
function markDone(id){const s=boardState();if(id&&!s.done.includes(id))s.done.push(id);saveBoard(s);
  const t=load();t.steps=(t.steps||0)+1;save(t);}
// ---- live 24h commitments (the real-life game actions on the board) ----
const CKEY="mood_commit_v1", DAY=24*3600*1000;
const commits=()=>{try{return JSON.parse(localStorage.getItem(CKEY))||[]}catch(e){return[]}};
const saveCommits=a=>{try{localStorage.setItem(CKEY,JSON.stringify(a))}catch(e){}};
const openCommits=()=>commits().filter(c=>!c.closed);
function addCommit(m){const a=commits();
  if(a.find(c=>!c.closed&&c.missionId===m.id))return;           // no duplicate open commitment
  if(openCommits().length>=5)return;                            // max 5 active (constitution)
  a.push({id:"c"+Date.now(),missionId:m.id,title:m.name,action:m.behavior,icon:m.icon,tint:m.tint,createdAt:Date.now(),closed:false,branch:null,words:""});
  saveCommits(a);}
function closeCommit(id,branch,words){const a=commits();const c=a.find(x=>x.id===id);
  if(c){c.closed=true;c.branch=branch;c.words=words||"";c.closedAt=Date.now();saveCommits(a);}}
function fmtRemain(ms){ if(ms<=0)return "החלון עבר — עדיין אפשר";
  const h=Math.floor(ms/3600000), mn=Math.floor((ms%3600000)/60000);
  return h>0?`נותרו ${h}ש׳ ${mn}ד׳`:`נותרו ${mn}ד׳`; }
// ---- the personal book (living memory) ----
const BOOKKEY="mood_book_v1";
const bookEntries=()=>{try{return JSON.parse(localStorage.getItem(BOOKKEY))||[]}catch(e){return[]}};
function addBookEntry(e){const a=bookEntries();a.push(e);try{localStorage.setItem(BOOKKEY,JSON.stringify(a))}catch(e2){}}
// ---- second chance: recall the player's own words from a past "not yet" ----
function lastNotYet(missionId){const b=bookEntries().filter(e=>e.missionId===missionId&&e.branch==="n"&&e.words);return b.length?b[b.length-1].words:null;}
let activeCommit=null, boardTimer=null;
function clearBoardTimer(){if(boardTimer){clearInterval(boardTimer);boardTimer=null;}}
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

// ---- 3D diorama controller — the whole scene tilts in space + deep layer parallax ----
let cur={cam:null,tilt:null,bg:null,sh:null,fg:null}, tx=0,ty=0, ix=0,iy=0; // target & input
let phase=0;
function apply(){
  const nx=ix, ny=iy;
  const breath=1+Math.sin(phase*1.25)*0.016;   // 4th dimension: a living depth pulse over time
  // the whole diorama tilts & floats in 3D space (perspective lives on the transform)
  if(cur.tilt) cur.tilt.style.transform=`perspective(900px) rotateY(${nx*7}deg) rotateX(${ny*-6}deg) scale(${breath})`;
  // deep layer separation via real Z: bg recedes far, foreground rides well forward
  if(cur.bg) cur.bg.style.transform=`translate3d(${nx*-16}px,${ny*-12}px,-80px) scale(1.28)`;
  if(cur.sh) cur.sh.style.transform=`translate3d(${nx*38+12}px,${ny*33+20}px,-14px) scale(1.03)`;
  if(cur.fg) cur.fg.style.transform=`translate3d(${nx*40}px,${ny*33}px,75px)`;
}
// ALWAYS-ON 3D orbit — the scene floats & turns in space on its own, no input needed
function loop(){
  phase+=0.009;
  const orbX=Math.sin(phase)*0.95, orbY=Math.cos(phase*0.82)*0.72;   // continuous elliptical orbit
  ix += ((tx+orbX)-ix)*0.055; iy += ((ty+orbY)-iy)*0.055;
  apply(); requestAnimationFrame(loop);
}
if(!reduce) loop(); else apply();
function setInput(x,y){tx=Math.max(-1.6,Math.min(1.6,x));ty=Math.max(-1.6,Math.min(1.6,y));}
function gyro(e){ if(e.gamma==null)return; setInput(e.gamma/18,(e.beta-45)/18); }   // tilt drives it (stronger)
if(!reduce) window.addEventListener("pointermove",e=>setInput((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2),{passive:true});
function enableGyro(){ // iOS needs a gesture-triggered permission — add the listener ONLY after it's granted
  try{
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      DeviceOrientationEvent.requestPermission().then(s=>{ if(s==="granted") window.addEventListener("deviceorientation",gyro,{passive:true}); }).catch(()=>{});
    } else if(typeof DeviceOrientationEvent!=="undefined"){
      window.addEventListener("deviceorientation",gyro,{passive:true});
    }
  }catch(e){}
}

// ---- the score: a soft, breathing pad (base ~0.05, swells to ~0.11 on emotional peaks) ----
let AC=null,master=null,muted=false;const BASE=0.05,PEAK=0.115;
function startScore(){ if(AC||reduce)return; try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=560;lp.Q.value=.4;lp.connect(master);
  // a warm low chord (A2 · E3 · A3) + a slow shimmer, all detuned for movement
  [[110,.30,"sine",0],[164.81,.22,"sine",-4],[220,.14,"triangle",5],[329.63,.05,"sine",8]]
    .forEach(([f,g,ty,det])=>{const o=AC.createOscillator();o.type=ty;o.frequency.value=f;o.detune.value=det;
      const gn=AC.createGain();gn.gain.value=g;o.connect(gn);gn.connect(lp);o.start();
      // gentle LFO on the filter for a living, breathing bed
    });
  const lfo=AC.createOscillator();lfo.frequency.value=0.06;const lg=AC.createGain();lg.gain.value=120;
  lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  master.gain.linearRampToValueAtTime(BASE, AC.currentTime+3.5);
  showMute();
}catch(e){console.log("score off",e);} }
function swell(up,intensity=1){ if(!AC||!master||muted)return; const t=AC.currentTime;
  master.gain.cancelScheduledValues(t);
  const target=up?BASE+(PEAK-BASE)*intensity:BASE;
  master.gain.linearRampToValueAtTime(target, t+(up?2.6:2.2)); }
function duck(level,dur){ if(!AC||!master||muted)return; const t=AC.currentTime;
  master.gain.cancelScheduledValues(t); master.gain.linearRampToValueAtTime(Math.max(0,level), t+(dur||1.2)); }
function toggleMute(){ if(!AC)return; muted=!muted; const t=AC.currentTime;
  master.gain.cancelScheduledValues(t); master.gain.linearRampToValueAtTime(muted?0:BASE,t+.4);
  const b=document.getElementById("mute"); if(b)b.innerHTML=muted?svg("i-muted"):svg("i-sound"); }
function showMute(){ if(document.getElementById("mute"))return;
  const b=document.createElement("button");b.id="mute";b.className="mute";b.innerHTML=svg("i-sound");
  b.onclick=toggleMute;stage.appendChild(b);requestAnimationFrame(()=>b.classList.add("on")); }

function frame(sceneKey,{dim=false,mid=false,tap=false,shot=sceneKey}={}){
  const stem=M.stems[sceneKey];
  const bg=`${M.dir}/depth/${stem}_bg.jpg${AV}`, fg=`${M.dir}/depth/${stem}_fg.png${AV}`, flat=`${M.dir}/screens/${stem}.jpg${AV}`;

// the camera: sets the opening framing, then eases to the closing framing over the beat
function camera(el,shot){
  const S=SHOTS[shot]||SHOTS._default;
  const camEl=el.querySelector(".cam"), dio=el.querySelector(".diorama"),
        gl=el.querySelector(".godlight"), bgL=el.querySelector(".layer.bg");
  const set=(v,useTr)=>{camEl.style.transition=useTr?`transform ${S.d}s cubic-bezier(.33,0,.2,1)`:"none";
    camEl.style.transform=`scale(${v.s}) translateY(${v.y}px)`; if(bgL)bgL.style.filter=`blur(${v.b}px)`;};
  if(reduce){set(S.to,false); if(S.light)gl.classList.add("on"); if(S.bars)dio.classList.add("cine"); return;}
  set(S.from,false); void camEl.offsetWidth;         // start framing + reflow so the move animates
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    set(S.to,true);
    if(S.bars) dio.classList.add("cine");
    if(S.release){ dio.classList.remove("cine"); }
    if(S.light){ gl.classList.add("on"); swell(true,S.light); } else swell(false);
  }));
}
function plain(html){const el=document.createElement("div");el.className="screen";el.innerHTML=html;
  const old=stage.querySelector(".screen.on");stage.appendChild(el);
  requestAnimationFrame(()=>{el.classList.add("on");if(old){old.classList.remove("on");old.classList.add("out");setTimeout(()=>old.remove(),640);}});
  cur={bg:null,sh:null,fg:null};return el;}
function box(el){return el.querySelector(".sheet")||el.querySelector(".mid")}
function addLine(p,t,cls="m",ac=false){const d=document.createElement("div");d.className=`line ${cls} ${ac?'accent':''}`;d.textContent=t;p.appendChild(d);requestAnimationFrame(()=>d.classList.add("show"));return d;}
function addKick(p,h){const d=document.createElement("div");d.className="kick";d.innerHTML=h;p.appendChild(d);requestAnimationFrame(()=>d.classList.add("show"));return d;}
function actions(p,h){const w=document.createElement("div");w.className="acts";w.innerHTML=h;p.appendChild(w);requestAnimationFrame(()=>w.classList.add("show"));return w;}
function choose(btn,p,fn){buzz(20);btn.classList.add("picked");p.querySelectorAll(".btn").forEach(x=>{if(x!==btn)x.classList.add("dim")});setTimeout(fn,360);}

// one sentence at a time — each line LANDS (min dwell) and a deliberate PAUSE precedes the emotional arrow
function sequence(el,p,beats,cls,{onDone}={}){
  let i=0, shownAt=0, busy=false, done=false;
  const clear=()=>p.querySelectorAll(".line").forEach(o=>{o.style.transition="opacity .4s ease,transform .4s ease";o.style.opacity="0";o.style.transform="translateY(-7px)";setTimeout(()=>o.remove(),420);});
  const show=()=>{
    const b=beats[i++];
    const gap = i===1 ? 200 : (b.accent ? 760 : 480);   // pause before the emotional arrow
    busy=true; clear();
    setTimeout(()=>{ addLine(p,b.t,cls,b.accent); shownAt=Date.now(); busy=false;
      if(i>=beats.length){ el.querySelector(".tap")?.remove(); el.removeEventListener("click",h); done=true; setTimeout(onDone,1500); }
    }, gap);
  };
  const h=ev=>{ if(done||busy) return; if(ev.target.closest(".btn")) return;
    if(Date.now()-shownAt < 950) return;   // min dwell — let it land before it can be skipped
    show(); };
  el.addEventListener("click",h);
  show();
}

function Reckoning(){

    {t:"מישהו חיכה\nשתרים את הראש.", hold:3000, img:"01_recognition"},
    {t:"אמא התקשרה.\nאמרת ׳אחר כך׳.", hold:3200, snd:"silence", img:"03_opportunity"},
    {t:"הרגעים האלה\nלא מחכים.", hold:2800},
    {t:"הם פשוט עוברים.", hold:3000, ember:true},
    {t:"אבל הרגע הבא —", hold:2200, snd:"swell", img:"06a_chose_differently"},
    {t:"עוד לא עבר.", cls:"accent", hold:2800, glow:true, warm:true}
  ];
  const el=document.createElement("div");el.className="reckon";
  el.innerHTML=`<div class="rimg" id="rimg"></div><div class="rdark"></div>
    <div class="glow"></div><div class="ember"></div>

    <div class="rline" id="rl"></div>
    <div class="rcta"><button class="btn olive" id="rgo">אני רוצה להיות שם</button></div>`;
  stage.appendChild(el);
  const rl=el.querySelector("#rl"), ember=el.querySelector(".ember"), glow=el.querySelector(".glow"),
        cta=el.querySelector(".rcta"), rimg=el.querySelector("#rimg");
  let i=0,timer=null,ended=false;
  const finish=()=>{if(ended)return;ended=true;clearTimeout(timer);swell&&swell(false);
    el.style.transition="opacity 1s";el.style.opacity="0";setTimeout(()=>{el.remove();Board();},1000);};
  el.querySelector(".rskip").onclick=e=>{e.stopPropagation();finish();};
  el.querySelector("#rgo").onclick=e=>{e.stopPropagation();buzz();finish();};
  const cue=s=>{if(s==="soft")duck(.03,1);else if(s==="silence")duck(0,.9);else if(s==="swell"){if(typeof PEAK!=="undefined")duck(PEAK,3);}};
  const step=()=>{
    if(i>=beats.length){cta.classList.add("on");return;}
    const b=beats[i++];
    rl.classList.remove("on");
    setTimeout(()=>{
      rl.className="rline"+(b.cls?" "+b.cls:"");rl.textContent=b.t;
      requestAnimationFrame(()=>rl.classList.add("on"));
      if(b.img!==undefined){ if(b.img===""){rimg.classList.remove("on","warm");}
        else{rimg.style.backgroundImage=`url('${M.dir}/screens/${b.img}.jpg${AV}')`;rimg.classList.add("on");if(b.warm)rimg.classList.add("warm");} }
      if(b.snd)cue(b.snd); if(b.ember)ember.classList.add("on"); if(b.glow)glow.classList.add("on");
      timer=setTimeout(step, b.hold);
    }, i>1?650:200);
  };
  // tap advances early (skip the remaining hold of the current line)
  el.addEventListener("click",()=>{if(ended||cta.classList.contains("on"))return;clearTimeout(timer);step();});
  if(reduce){finish();return;}
  step();
}

    p.querySelector("#ny").onclick=e=>choose(e.currentTarget,p,()=>{branch="n";go(Reflection)});},750);}
// Reflection — the player tells the truth in their own words (free text)
function Reflection(){const isC=branch==="c";const prompt=isC?"מה השתנה\nכשבאמת היית שם?":"מה השאיר אותך\nבמקום?";
  const el=plain(`<div class="open" style="background:radial-gradient(135% 80% at 50% 30%,#f7f0dd,var(--paper) 60%,#e6dcc6)">
    <div class="line l show" style="max-width:18ch;white-space:pre-line">${prompt}</div>
    <textarea class="reflect show" id="rt" rows="3" placeholder="כמה מילים משלך… (לא חובה)" style="animation-delay:.4s"></textarea>
    <div class="acts show" style="animation-delay:.8s;max-width:340px">
      <button class="btn olive" id="save">לכתוב בספר</button>
      <button class="btn ghost" id="skip">לדלג</button></div></div>`);
  el.querySelector("#rt").focus?.();
  el.querySelector("#save").onclick=()=>{buzz();finishReturn(el.querySelector("#rt").value.trim());};
  el.querySelector("#skip").onclick=()=>{buzz();finishReturn("")};}
function finishReturn(words){reflectWords=words;
  if(activeCommit)closeCommit(activeCommit.id,branch,words);
  if(activeMission)markDone(activeMission.id);
  go(Witness);}
// Witness — two equal endings
function Witness(){const isC=branch==="c";const el=frame(isC?"witness_c":"witness_n",{tap:true});const p=box(el);
  sequence(el,p,(isC?M.witness_c:M.witness_n).map(t=>({t})),"l",{onDone:()=>{if(isC)bloom(el);
    p.querySelectorAll(".line").forEach(o=>o.remove());
    addLine(p,isC?M.reward_c:M.reward_n,"l",isC);
    actions(p,`<button class="btn ${isC?'olive':'dusk'}" id="n">לכתוב בספר</button>`);p.querySelector("#n").onclick=()=>{buzz();go(LivingBook)};}});}
// Living Memory — the moment is written, in ink, into the personal book
function hebDate(){try{return new Date().toLocaleDateString('he-IL')}catch(e){return""}}
function LivingBook(){const isC=branch==="c";
  const entry={momentId:activeMission?activeMission.id:"conversation",title:M.mission.name,virtue:M.middah.name,
    choice:isC?M.branch_c:M.branch_n,branch:branch||"c",words:reflectWords||"",date:hebDate()};
  addBookEntry(entry);
  const el=plain(`<div class="book"><div class="page">
     <div class="page-head"><span>${entry.date}</span><span>מידה · ${entry.virtue}</span></div>
     <div class="ink" id="ink"></div>
     <div class="acts" id="ba" style="opacity:0;max-width:320px"><button class="btn olive" id="b">חזרה ללוח</button></div>
  </div></div>`);
  const lines=[entry.title,"בחרתי: "+entry.choice].concat(entry.words?["״"+entry.words+"״"]:[]);
  writeInk(el.querySelector("#ink"),lines,()=>{const ba=el.querySelector("#ba");ba.style.transition="opacity .9s";ba.style.opacity="1";});
  el.querySelector("#b").onclick=()=>{buzz();reflectWords="";Board()};}
// ink appears word by word, as if written onto the page
function writeInk(container,lines,done){let li=0;
  const nextLine=()=>{ if(li>=lines.length){if(done)setTimeout(done,500);return;}
    const t=lines[li], q=t.startsWith("״");
    const el=document.createElement("div");el.className="ink-line"+(li===0?" head":"")+(q?" quote":"");container.appendChild(el);
    const words=t.split(" ");let wi=0;
    const nextWord=()=>{ if(wi>=words.length){li++;setTimeout(nextLine,460);return;}
      const s=document.createElement("span");s.className="ink-word";s.textContent=words[wi]+(wi<words.length-1?" ":"");
      el.appendChild(s);requestAnimationFrame(()=>s.classList.add("on"));wi++;setTimeout(nextWord,q?150:210);};
    nextWord();};
  nextLine();}
// Second Chance — recall the player's own words from a past "not yet"
function SecondChance(){const el=frame("recognition",{tap:true});const p=box(el);
  addLine(p,"בפעם הקודמת אמרת:","s");
  setTimeout(()=>addLine(p,"״"+recallWords+"״","l",true),800);
  setTimeout(()=>{actions(p,`<button class="btn olive" id="n">מה תבחר הפעם?</button>`);
    p.querySelector("#n").onclick=()=>{buzz();go(Mirror)};},1800);}
// The book shelf — all real memories
function BookShelf(){const entries=bookEntries().slice().reverse();
  const items=entries.map(e=>`<div class="shelf-item"><div class="shelf-d">${e.date} · מידה · ${e.virtue}</div>
    <div class="shelf-t">${e.title}</div><div class="shelf-c">בחרת: ${e.choice}</div>
    ${e.words?`<div class="shelf-w">״${e.words}״</div>`:""}</div>`).join("");
  const el=plain(`<div class="board"><button class="bk lmbk" id="bk">${svg("i-back")}</button>
    <div class="board-h"><div class="line l">הספר שלי</div>
      <div class="line s" style="margin-top:6px">${entries.length} ${entries.length===1?"זיכרון אמיתי":"זיכרונות אמיתיים"}</div></div>
    <div class="shelf">${items||'<div class="line s" style="text-align:center">עוד אין זיכרונות. הרגע הראשון מחכה.</div>'}</div></div>`);
  el.querySelector("#bk").onclick=()=>{buzz();Board()};}
function bloom(el){const c=document.createElement("canvas");c.className="bloom";el.appendChild(c);
  const ctx=c.getContext("2d"),w=c.width=el.clientWidth,h=c.height=el.clientHeight;
  let ps=Array.from({length:50},()=>({x:w/2+(Math.random()-.5)*w*.5,y:h*.4+(Math.random()-.5)*90,vx:(Math.random()-.5)*1.3,vy:-Math.random()*1.5-.3,a:1,r:Math.random()*2.4+1}));
  let t=0;(function lp(){ctx.clearRect(0,0,w,h);t++;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.a-=.009;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`rgba(150,160,90,${Math.max(0,p.a)})`;ctx.fill()});if(t<150)requestAnimationFrame(lp);else c.remove();})();}
// eager preload — flat bases + depth layers immediately, so frames never flash on transition
Object.values(M.stems).forEach(s=>{const i=new Image();i.src=`${M.dir}/screens/${s}.jpg${AV}`;});
setTimeout(()=>Object.values(M.stems).forEach(s=>{[`${M.dir}/depth/${s}_bg.jpg${AV}`,`${M.dir}/depth/${s}_fg.png${AV}`].forEach(u=>{const i=new Image();i.src=u;});}),250);
// boot — if anything throws, the static #fallback stays visible (never blank)
try{
  Open();
  const fb=document.getElementById("fallback"); if(fb) setTimeout(()=>{fb.style.transition="opacity .5s";fb.style.opacity="0";setTimeout(()=>fb.remove(),500);}, 120);
}catch(e){ console.log("boot error",e); }
</script>
