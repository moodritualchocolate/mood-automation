<style>
:root{
 --bg:#0c0a07; --panel:#171209; --gold:#c9a25e; --gold-2:#e6c489; --gold-dim:rgba(201,162,94,.35);
 --ink:#efe4d2; --muted:#a89a83; --faint:#6f6553; --line:rgba(201,162,94,.16);
 --serif:'Frank Ruhl Libre','Times New Roman',serif; --disp:'Cormorant Garamond',var(--serif);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--serif);color:var(--ink)}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:radial-gradient(130% 80% at 50% 0%,#1a140c 0%,var(--bg) 55%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 22px calc(96px + env(safe-area-inset-bottom));will-change:opacity,transform}
.screen.enter{animation:scin .62s cubic-bezier(.16,1,.3,1) both}
.screen.exit{animation:scout .4s ease forwards;pointer-events:none}
.screen.center{justify-content:center;align-items:center;text-align:center}
.pt{padding-top:calc(22px + env(safe-area-inset-top))}
@keyframes scin{from{opacity:0;transform:scale(1.03) translateY(8px)}to{opacity:1;transform:none}}
@keyframes scout{to{opacity:0;transform:scale(.985)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes revl{from{opacity:0;filter:blur(9px);transform:translateY(12px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shimmer{0%{transform:translateX(-130%)}60%,100%{transform:translateX(130%)}}
.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.revl{animation:revl 1.1s cubic-bezier(.16,1,.3,1) both}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{font-family:var(--disp);letter-spacing:.28em;font-size:19px;color:var(--gold-2);font-weight:500;padding-inline-start:.28em}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px}
h1{font-weight:400;font-size:30px;line-height:1.3;margin:0}
h2{font-weight:400;font-size:23px;line-height:1.35;margin:0}
.eyebrow{font-family:var(--disp);letter-spacing:.34em;font-size:12px;color:var(--gold);text-transform:uppercase;opacity:.85}
.lead{font-size:19px;line-height:1.6;color:var(--muted);font-weight:300}
.dim{color:var(--muted)} .sm{font-size:14px} .cap{font-size:12.5px;letter-spacing:.03em}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--serif);font-size:17px;
 padding:15px 30px;border-radius:40px;border:1px solid transparent;cursor:pointer;transition:transform .3s;color:#20160a;
 background:linear-gradient(180deg,var(--gold-2),var(--gold));box-shadow:0 6px 24px -8px rgba(201,162,94,.5)}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-130%);animation:shimmer 4.5s ease-in-out 1.2s infinite}
.btn.block{width:100%}
.pill{position:relative;overflow:hidden;display:block;width:100%;text-align:center;font-family:var(--serif);font-size:16.5px;color:var(--ink);
 background:var(--panel);border:1px solid var(--line);border-radius:36px;padding:15px;margin:9px 0;cursor:pointer;transition:.4s}
.pill.on{color:#20160a;border-color:transparent;background:linear-gradient(180deg,var(--gold-2),var(--gold))}
.pill:active{transform:scale(.99)}
.card{position:relative;border-radius:20px;overflow:hidden;background:#0a0806;border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.02)}
.card canvas{display:block;width:100%;height:100%}
.card .sheen{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 30%,rgba(255,220,160,.10),transparent 60%);pointer-events:none}
.cardname{font-size:20px;text-align:center;margin-top:14px}
.cardglyph{display:block;text-align:center;color:var(--gold);font-size:15px;margin-top:5px;opacity:.9}
.three{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin-top:10px}
.three .slot{flex:1;max-width:150px;cursor:pointer;animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.three .slot .card{aspect-ratio:.62}
.three .slot:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
.grid .card{aspect-ratio:.64}
.grid>div{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:8px 16px;background:rgba(255,255,255,.02)}
.chip.on{color:#20160a;background:var(--gold);border-color:transparent}
.choice{display:flex;align-items:center;gap:16px;width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:10px 0;cursor:pointer;transition:.3s}
.choice:active{transform:scale(.99)}
.choice .thumb{width:58px;height:74px;border-radius:12px;overflow:hidden;flex:none;border:1px solid var(--line)}
.choice .big{font-size:18px} .choice .g{color:var(--gold);font-size:20px;margin-inline-start:auto}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;justify-content:space-around;padding:12px 8px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 60%,transparent);z-index:50}
.nav button{background:none;border:none;color:var(--faint);font-family:var(--serif);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:.3s}
.nav button .ic{font-size:19px}.nav button.on{color:var(--gold-2)}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center}
.floaty{animation:floaty 7s ease-in-out infinite}
.divider{height:1px;background:var(--line);margin:22px auto;width:0;animation:grow 1s ease .4s forwards}
@keyframes grow{to{width:70%}}
.menu-row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);font-size:16px}
.menu-row .g{margin-inline-start:auto;color:var(--faint)}
.tiny-input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;font-family:var(--serif);font-size:17px;text-align:center;outline:none}
.tiny-input:focus{border-color:var(--gold-dim)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const KEY='mood_game_v2';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz=(n)=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
let ANIMGEN=0; // bump to kill running canvas loops

const CARDS=[
 {id:'courage',name:'אומץ',glyph:'✦',motif:'figure',reflect:'אתה לא צריך להיות אמיץ. רק לעשות את הצעד הבא.',invite:'תגיד שלום לאדם אחד שאתה לא מכיר.',think:'מהו צעד קטן אחד שאתה יכול לעשות היום?'},
 {id:'connection',name:'חיבור',glyph:'♡',motif:'two',reflect:'החום שאתה מרגיש שווה יותר כשהוא נאמר בקול.',invite:'שלח למישהו הודעה קטנה: חשבתי עליך.',think:'למי לא אמרת מזמן שהוא חשוב לך?'},
 {id:'rest',name:'מנוחה',glyph:'☾',motif:'moon',reflect:'לעצור זה לא לוותר. זו בחירה.',invite:'שב שתי דקות בלי לעשות כלום, בכוונה.',think:'מתי בפעם האחרונה נתת לעצמך לנוח באמת?'},
 {id:'presence',name:'נוכחות',glyph:'○',motif:'candle',reflect:'רוב החיים קורים כשאנחנו במקום אחר. חזור לרגע.',invite:'שים לב לשלושה דברים סביבך עכשיו, לאט.',think:'איפה הראש שלך כשהגוף שלך כאן?'},
 {id:'boundaries',name:'גבולות',glyph:'‖',motif:'stairs',reflect:'כל "לא" שומר על "כן" שחשוב לך יותר.',invite:'אמור "תן לי לחשוב על זה" במקום כן אוטומטי.',think:'על מה אתה שומר כשאתה אומר לא?'},
 {id:'curiosity',name:'סקרנות',glyph:'✧',motif:'path',reflect:'סקרנות היא איך נשארים חיים.',invite:'שאל שאלה אחת אמיתית על משהו שחלפת לידו.',think:'מה עורר בך פליאה לאחרונה?'},
 {id:'growth',name:'צמיחה',glyph:'❧',motif:'plant',reflect:'אתה בדרך הנכונה. המשך כך.',invite:'עשה דבר קטן אחד שדחית שוב ושוב.',think:'מה גדל בך בשקט בזמן האחרון?'},
 {id:'serenity',name:'שלווה',glyph:'≈',motif:'sail',reflect:'יש שקט שאפשר לבחור בו.',invite:'קח חמש נשימות איטיות, בעיניים עצומות.',think:'מה יעזור לך להרפות רגע?'},
 {id:'hope',name:'תקווה',glyph:'☀',motif:'sunfig',reflect:'מחר עוד לא יודע מה יגלה עליך.',invite:'רשום דבר אחד שאתה מצפה לו.',think:'לאן אתה בדרך?'},
 {id:'clarity',name:'בהירות',glyph:'◐',motif:'moonstair',reflect:'יש לך את כל מה שאתה צריך ברור בפנים.',invite:'כתוב משפט אחד על מה שחשוב לך היום.',think:'מה אתה כבר יודע ולא מודה בו?'},
 {id:'creativity',name:'יצירה',glyph:'✺',motif:'spark',reflect:'לעשות דבר אחד קטן מנצח לצרוך דבר מושלם.',invite:'צור דבר קטן אחד — שרבוט, משפט, תמונה — ושמור.',think:'מה היית עושה אם זה לא היה חייב להיות טוב?'},
 {id:'release',name:'שחרור',glyph:'~',motif:'path',reflect:'מה שאתה משחרר מפנה מקום למשהו חדש.',invite:'ותר על דבר אחד קטן שאתה נאחז בו.',think:'מה כבד לך לשאת סתם?'},
];
const byId=id=>CARDS.find(c=>c.id===id);
const QS=[
 {q:'מה הכי מעסיק אותך בימים האלה?',opts:['עבודה','אנשים קרובים','לחץ ודאגות','חוסר ודאות']},
 {q:'ואיך זה מרגיש בגוף?',opts:['עייפות','מתח','חוסר שקט','כובד שקט']},
 {q:'מה אתה הכי צריך עכשיו?',opts:['אנרגיה','בהירות','שקט','ביטחון']},
];
const BODY={'עייפות':'תשישות','מתח':'מתח','חוסר שקט':'אי-שקט','כובד שקט':'כובד'};
const NEED={'אנרגיה':'ניצוץ','בהירות':'קו אחד ברור','שקט':'רגע של שקט','ביטחון':'קרקע'};

/* ---------- portal art ---------- */
function paintPortal(ctx,W,H,card,seed,layer){
 const R=mulberry32((seed*2654435761)>>>0);
 const x=ctx;
 let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c0a07');bg.addColorStop(1,'#050403');x.fillStyle=bg;x.fillRect(0,0,W,H);
 for(let i=0;i<80;i++){x.fillStyle=`rgba(${40+R()*30|0},${32+R()*20|0},22,${.12+R()*.2})`;const s=R()*2+.4;x.fillRect(R()*W,R()*H,s,s);}
 const cx=W*0.5,cy=H*0.47,rx=W*0.36,ry=H*0.40,N=60,pts=[];
 for(let i=0;i<N;i++){const a=i/N*Math.PI*2;const top=(Math.sin(a)<0)?0.86:1.06;const jit=1+(R()-0.5)*0.09;pts.push([cx+Math.cos(a)*rx*jit,cy+Math.sin(a)*ry*top*jit]);}
 const trace=()=>{x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<=N;i++){const p=pts[i%N],q=pts[(i+1)%N];x.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}x.closePath();};
 x.save();trace();x.clip();
 let sky=x.createLinearGradient(0,cy-ry,0,cy+ry);sky.addColorStop(0,'#20233c');sky.addColorStop(.4,'#4a3348');sky.addColorStop(.62,'#8a4f33');sky.addColorStop(.8,'#e7a457');sky.addColorStop(1,'#f3c877');x.fillStyle=sky;x.fillRect(0,0,W,H);
 const hy=cy+ry*0.34;
 const gl=x.createRadialGradient(cx,hy,4,cx,hy,rx*1.3);gl.addColorStop(0,'rgba(255,236,190,.95)');gl.addColorStop(.25,'rgba(255,200,120,.6)');gl.addColorStop(1,'rgba(255,180,90,0)');x.fillStyle=gl;x.fillRect(0,0,W,H);
 for(let i=0;i<14;i++){const clx=R()*W,cly=cy-ry*0.3+R()*ry*1.1,cr=18+R()*46;const cg=x.createRadialGradient(clx,cly,2,clx,cly,cr);const warm=cly>hy-10;cg.addColorStop(0,warm?'rgba(255,214,150,.5)':'rgba(120,110,140,.4)');cg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=cg;x.beginPath();x.arc(clx,cly,cr,0,7);x.fill();}
 paintMotif(x,card.motif,cx,cy,rx,ry,hy,R);
 x.restore();
 x.save();trace();x.lineWidth=2.4;x.strokeStyle='rgba(255,214,150,.45)';x.shadowColor='rgba(255,190,110,.6)';x.shadowBlur=16;x.stroke();x.restore();
 const vig=x.createRadialGradient(cx,cy,H*0.2,cx,cy,H*0.72);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(6,4,2,.85)');x.fillStyle=vig;x.fillRect(0,0,W,H);
 return {cx,cy,rx,ry,hy,trace};
}
function paintMotif(x,m,cx,cy,rx,ry,hy,R){
 x.save();const sil='rgba(14,9,6,.92)';
 const figure=(fx,s)=>{x.fillStyle=sil;s=s||1;const by=hy+ry*0.02;x.beginPath();x.ellipse(fx,by-40*s,7*s,8*s,0,0,7);x.fill();x.beginPath();x.moveTo(fx-9*s,by);x.quadraticCurveTo(fx-7*s,by-32*s,fx,by-33*s);x.quadraticCurveTo(fx+7*s,by-32*s,fx+9*s,by);x.closePath();x.fill();x.fillRect(fx-6*s,by,4*s,26*s);x.fillRect(fx+2*s,by,4*s,26*s);x.globalAlpha=.25;x.fillRect(fx-8*s,by+26*s,16*s,12*s);x.globalAlpha=1;};
 if(m==='figure'||m==='sunfig')figure(cx,1.15);
 else if(m==='two'){figure(cx-16,1.0);figure(cx+14,1.05);}
 else if(m==='moon'||m==='moonstair'){const my=cy-ry*0.35;const mg=x.createRadialGradient(cx,my,2,cx,my,26);mg.addColorStop(0,'rgba(255,244,214,1)');mg.addColorStop(.6,'rgba(255,224,170,.9)');mg.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=mg;x.beginPath();x.arc(cx,my,26,0,7);x.fill();x.fillStyle='rgba(255,248,224,.95)';x.beginPath();x.arc(cx,my,12,0,7);x.fill();if(m==='moonstair'){x.fillStyle=sil;for(let i=0;i<5;i++)x.fillRect(cx-24+i*10,hy+8+i*7,22,4);}}
 else if(m==='candle'){const my=hy-6;const cg=x.createRadialGradient(cx,my,1,cx,my,30);cg.addColorStop(0,'rgba(255,240,200,1)');cg.addColorStop(1,'rgba(255,190,110,0)');x.fillStyle=cg;x.beginPath();x.arc(cx,my,30,0,7);x.fill();x.fillStyle='#fff3d6';x.beginPath();x.ellipse(cx,my,3,6,0,0,7);x.fill();}
 else if(m==='stairs'){x.fillStyle=sil;for(let i=0;i<6;i++)x.fillRect(cx-30+i*11,hy+16-i*9,26,5);}
 else if(m==='path'){x.strokeStyle='rgba(255,220,160,.5)';x.lineWidth=8;x.beginPath();x.moveTo(cx,hy+ry*0.45);x.quadraticCurveTo(cx+18,hy,cx,hy-ry*0.2);x.stroke();x.lineWidth=3;x.strokeStyle='rgba(255,240,200,.6)';x.stroke();}
 else if(m==='plant'){x.strokeStyle=sil;x.lineWidth=2.4;const by=hy+ry*0.12;for(let s=-1;s<=1;s++){x.beginPath();x.moveTo(cx+s*10,by);x.quadraticCurveTo(cx+s*20,by-34,cx+s*8,by-58);x.stroke();for(let k=1;k<4;k++){const ly=by-14*k;x.beginPath();x.ellipse(cx+s*10-s*4,ly,7,3,s*0.6,0,7);x.fillStyle=sil;x.fill();}}}
 else if(m==='sail'){x.fillStyle=sil;x.beginPath();x.moveTo(cx,hy-30);x.lineTo(cx+16,hy+6);x.lineTo(cx,hy+6);x.closePath();x.fill();x.fillRect(cx-1,hy-30,2,36);x.globalAlpha=.3;x.fillRect(cx-30,hy+8,60,3);x.globalAlpha=1;}
 else if(m==='spark'){for(let i=0;i<7;i++){const a=i/7*7;const px=cx+Math.cos(a)*22,py=cy-ry*0.2+Math.sin(a)*22;const sg=x.createRadialGradient(px,py,0,px,py,9);sg.addColorStop(0,'rgba(255,240,200,1)');sg.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=sg;x.beginPath();x.arc(px,py,9,0,7);x.fill();}}
 x.restore();
}
function renderCanvas(cv,card,seed,animated){
 const dpr=Math.min(2,window.devicePixelRatio||1);
 const W=cv.clientWidth||210,H=cv.clientHeight||300;
 cv.width=W*dpr;cv.height=H*dpr;
 const off=document.createElement('canvas');off.width=W*dpr;off.height=H*dpr;
 const octx=off.getContext('2d');octx.scale(dpr,dpr);
 const geo=paintPortal(octx,W,H,card,seed,'static');
 const ctx=cv.getContext('2d');
 // particle field seeded
 const R=mulberry32((seed*40503)>>>0);
 const parts=[];for(let i=0;i<24;i++)parts.push({x:R(),y:R(),s:R()*1.6+.4,sp:.02+R()*.05,ph:R()*7});
 if(!animated||RM){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(off,0,0,W,H);drawParts(ctx,parts,geo,0,W,H,1);return;}
 const gen=ANIMGEN;let t0=performance.now();
 (function loop(now){
   if(gen!==ANIMGEN||!cv.isConnected)return;
   const t=(now-t0)/1000;
   ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
   ctx.drawImage(off,0,0,W,H);
   // breathing horizon glow
   ctx.save();geo.trace();ctx.clip();
   const pulse=.5+.5*Math.sin(t*.9);const g=ctx.createRadialGradient(geo.cx,geo.hy,2,geo.cx,geo.hy,geo.rx*(0.9+pulse*0.35));
   g.addColorStop(0,`rgba(255,236,190,${.10+pulse*.16})`);g.addColorStop(1,'rgba(255,190,110,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
   drawParts(ctx,parts,geo,t,W,H,1);
   requestAnimationFrame(loop);
 })(t0);
}
function drawParts(ctx,parts,geo,t,W,H){
 ctx.save();geo.trace();ctx.clip();
 for(const p of parts){const py=(p.y - (t*p.sp))%1; const yy=(py<0?py+1:py); const px=p.x*W; const yv=geo.cy-geo.ry + yy*geo.ry*2*0.95;
   const tw=.4+.6*Math.abs(Math.sin(t*1.6+p.ph));ctx.fillStyle=`rgba(255,226,170,${tw*.9})`;ctx.beginPath();ctx.arc(px,yv,p.s,0,7);ctx.fill();}
 ctx.restore();
}
function cardEl(card,seed,opt){opt=opt||{};
 const n=el('<div class="card"><canvas></canvas><div class="sheen"></div></div>');
 requestAnimationFrame(()=>{try{renderCanvas(n.querySelector('canvas'),card,seed||1,opt.animated)}catch(e){}});
 return n;
}

/* ---------- state + transitions ---------- */
let state=load()||{name:'',setup:false,day:1,ans:[null,null,null],kept:[],offer:null,chosen:null,tab:'home',phase:'greet'};
function todaySeed(){return state.day*97+7}
function screen(html,cls){
 ANIMGEN++; // kill running canvas loops
 const old=[...app.querySelectorAll('.screen')];const oldnav=app.querySelector('.nav');
 old.forEach(o=>{o.classList.remove('enter');o.classList.add('exit');setTimeout(()=>o.remove(),400)});
 if(oldnav)oldnav.remove();
 const s=el(`<div class="screen enter ${cls||''}">${html}</div>`);app.appendChild(s);return s;
}
function nav(){
 const items=[['home','בית','⌂'],['cards','קלפים','▦'],['journey','מסע','◠'],['profile','פרופיל','◔']];
 const n=el(`<div class="nav">${items.map(([id,l,ic])=>`<button data-tab="${id}" class="${state.tab===id?'on':''}"><span class="ic">${ic}</span>${l}</button>`).join('')}</div>`);
 n.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{buzz(6);state.tab=b.dataset.tab;save();route()});
 app.appendChild(n);
}
function go(p){state.phase=p;save();route()}
function route(){
 if(!state.setup)return renderSetup();
 if(state.tab==='home')return renderHome();
 if(state.tab==='cards')return renderLibrary();
 if(state.tab==='journey')return renderJourney();
 if(state.tab==='profile')return renderProfile();
}
/* card fly transition */
function flyReveal(fromEl,card,seed,done){
 buzz(14);
 if(RM){done();return}
 const r=fromEl.getBoundingClientRect();
 const clone=cardEl(card,seed,{animated:true});
 clone.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;z-index:999;border-radius:20px;transition:all .66s cubic-bezier(.16,1,.3,1);box-shadow:0 30px 70px -20px rgba(0,0,0,.9)`;
 const dim=el('<div></div>');dim.style.cssText='position:fixed;inset:0;background:#0c0a07;opacity:0;transition:opacity .5s;z-index:998';
 document.body.appendChild(dim);document.body.appendChild(clone);
 const tw=Math.min(250,innerWidth*.66),th=tw/0.72,tl=(Math.min(520,innerWidth)-tw)/2+Math.max(0,(innerWidth-520)/2),tt=Math.max(70,innerHeight*.11);
 requestAnimationFrame(()=>{dim.style.opacity='1';clone.style.left=tl+'px';clone.style.top=tt+'px';clone.style.width=tw+'px';clone.style.height=th+'px';});
 setTimeout(()=>{done();setTimeout(()=>{clone.style.opacity='0';clone.style.transition='opacity .4s';dim.style.opacity='0';setTimeout(()=>{clone.remove();dim.remove()},420)},80)},680);
}

 const p=state.phase;

   <div class="rise" style="animation-delay:.35s;margin-top:24px;width:100%;max-width:320px">

     <button class="btn block" id="start" style="margin-top:14px">התחל</button></div></div>`,'center');

 }
 if(p&&p[0]==='q'){
  const i=+p.slice(1);const Q=QS[i];const cur=state.ans[i];
  const s=screen(`<div class="pt topbar"><span class="cap dim">שלב ${i+1} מתוך 3</span><span class="brand">mood</span><span style="width:40px"></span></div>

   b.onclick=()=>{buzz(8);state.ans[i]=op;o.querySelectorAll('.pill').forEach(z=>z.classList.remove('on'));b.classList.add('on');setTimeout(()=>{i<2?go('q'+(i+1)):go('reading')},260)};o.appendChild(b)});
  return;
 }
 if(p==='reading'){
  const body=BODY[state.ans[1]]||'משהו';const need=NEED[state.ans[2]]||'קשב';
  const s=screen(`<div class="center-col">
   <div class="eyebrow rise">המצב הרגשי שלך היום</div>
   <div class="floaty rise" style="height:250px;width:186px;margin:20px 0" id="rh"></div>
   <h1 class="revl" style="animation-delay:.1s">${body} שמחפש<br>${need}</h1>
   <p class="lead revl" style="animation-delay:.5s;max-width:320px">אתה נושא הרבה על הכתפיים. המשחק כאן כדי לתת לזה רגע.</p>
   <button class="btn revl" style="animation-delay:.9s;margin-top:24px" id="c">בוא נראה מה היום ביקש</button></div>`,'center');
  const c=cardEl(byId('rest'),12,{animated:true});c.style.height='250px';s.querySelector('#rh').appendChild(c);
  s.querySelector('#c').onclick=()=>{buzz(12);state.setup=true;state.phase='deal';state.tab='home';save();route()};
  return;
 }
}
function dealDay(){const R=mulberry32(todaySeed());const pick=[];const used=new Set();while(pick.length<3){const c=CARDS[Math.floor(R()*CARDS.length)];if(!used.has(c.id)){used.add(c.id);pick.push(c.id)}}state.offer=pick;save();}

/* ---------- home / daily ---------- */
function renderHome(){
 const p=state.phase;
 if(p==='deal'||p==='greet'){
  if(!state.offer)dealDay();
  const hi=state.name?`בוקר טוב, ${state.name}`:'בוקר טוב';
  const s=screen(`<div class="pt topbar"><span class="icon-btn">◔</span><span class="brand">mood</span><span class="icon-btn">◇</span></div>
   <div class="center-col" style="min-height:74vh">
     <h1 class="rise">${hi}</h1><p class="lead rise" style="animation-delay:.1s">יום ${state.day} במסע שלך</p>
     <div class="floaty rise" style="height:300px;width:216px;margin:24px 0" id="dh"></div>
     <button class="btn rise" style="animation-delay:.3s" id="open">בחר את הקלפים של היום</button></div>`);
  const c=cardEl(byId(state.offer[1]),todaySeed()+1,{animated:true});c.style.height='300px';s.querySelector('#dh').appendChild(c);
  s.querySelector('#open').onclick=()=>{buzz(8);go('choose')};nav();return;
 }
 if(p==='choose'){
  const s=screen(`<div class="pt topbar"><span style="width:40px"></span><span class="brand">mood</span><span style="width:40px"></span></div>
   <h2 style="text-align:center;margin:6px auto 4px">הקלפים שלך להיום</h2>
   <p class="lead sm" style="text-align:center;margin-bottom:8px">בחר קלף כדי להעמיק</p><div class="three" id="tr"></div>`);
  const tr=s.querySelector('#tr');
  state.offer.forEach((id,i)=>{const c=byId(id);const slot=el(`<div class="slot" style="animation-delay:${.08+i*.1}s"><div class="ch"></div><div class="cardname">${c.name}</div><span class="cardglyph">${c.glyph}</span></div>`);
   slot.querySelector('.ch').appendChild(cardEl(c,todaySeed()+i,{animated:i===1}));
   slot.onclick=()=>{state.chosen=id;flyReveal(slot.querySelector('.card'),c,todaySeed()+9,()=>go('reveal'))};tr.appendChild(slot);});
  nav();return;
 }
 if(p==='reveal'){
  const c=byId(state.chosen);
  const s=screen(`<div class="pt topbar"><span class="icon-btn" id="bk">‹</span><h2 style="font-size:20px">${c.name}</h2><span class="icon-btn">⋯</span></div>
   <div class="floaty" style="height:340px;width:250px;margin:6px auto 18px" id="rv"></div>
   <div style="max-width:380px;margin:0 auto;text-align:center">
     <p class="revl" style="font-size:22px;line-height:1.5;font-weight:300;animation-delay:.15s">${c.reflect}</p>
     <div class="divider"></div>
     <div class="eyebrow revl" style="animation-delay:.6s;margin-bottom:8px">הזמנה קטנה</div>
     <p class="lead revl" style="animation-delay:.75s">${c.invite}</p>
     <div class="cap dim revl" style="animation-delay:.95s;margin-top:12px">שאלת מחשבה — ${c.think}</div>
     <button class="btn block revl" style="animation-delay:1.15s;margin-top:26px" id="keep">מה לעשות עם הקלף?</button></div>`);
  const cc=cardEl(c,todaySeed()+9,{animated:true});cc.style.height='340px';s.querySelector('#rv').appendChild(cc);
  s.querySelector('#bk').onclick=()=>go('choose');s.querySelector('#keep').onclick=()=>{buzz(8);go('decide')};nav();return;
 }
 if(p==='decide'){
  const c=byId(state.chosen);
  const s=screen(`<div class="pt topbar"><span class="icon-btn" id="bk">‹</span><span class="brand">mood</span><span style="width:40px"></span></div>
   <h2 style="text-align:center;margin:10px auto 20px;max-width:320px">מה תרצה לעשות עם הקלף?</h2>
   <div style="max-width:400px;margin:0 auto;width:100%">
    <button class="choice rise" id="live" style="animation-delay:.05s"><div class="thumb" id="t1"></div><div><div class="big">לחיות איתו</div><div class="sm dim">אני רוצה לזכור את זה היום</div></div><span class="g">♡</span></button>
    <button class="choice rise" id="rel" style="animation-delay:.15s"><div class="thumb" id="t2"></div><div><div class="big">לשחרר אותו</div><div class="sm dim">אני מוכן להמשיך</div></div><span class="g">≈</span></button></div>`);
  let a=cardEl(c,todaySeed()+9);a.style.height='74px';s.querySelector('#t1').appendChild(a);
  let b=cardEl(byId('release'),todaySeed()+22);b.style.height='74px';s.querySelector('#t2').appendChild(b);
  s.querySelector('#bk').onclick=()=>go('reveal');
  s.querySelector('#live').onclick=()=>{buzz(18);state.kept.push(c.id+'#'+state.day);go('kept')};
  s.querySelector('#rel').onclick=()=>{buzz(10);go('released')};nav();return;
 }
 if(p==='kept'||p==='released'){
  const kept=p==='kept';const c=byId(state.chosen);
  const s=screen(`<div class="center-col">
    <div class="eyebrow rise">${kept?'נשמר במסע שלך':'שוחרר'}</div>
    <div class="floaty rise" style="height:280px;width:206px;margin:22px 0" id="kh"></div>
    <h1 class="revl" style="animation-delay:.1s">${kept?c.name:'רגע קל יותר'}</h1>
    <p class="lead revl" style="animation-delay:.4s;max-width:320px">${kept?c.invite:'מה ששחררת מפנה מקום. נתראה מחר.'}</p>
    <button class="btn revl" style="animation-delay:.8s;margin-top:24px" id="done">${state.day>=7?'ראה את המסע שלך':'סיים את היום'}</button></div>`,'center');
  const cc=cardEl(kept?c:byId('release'),todaySeed()+(kept?9:31),{animated:true});cc.style.height='280px';s.querySelector('#kh').appendChild(cc);
  s.querySelector('#done').onclick=()=>{buzz(8);if(state.day>=7){state.tab='journey';go('week')}else{state.day++;state.offer=null;state.chosen=null;go('deal')}};nav();return;
 }
 state.phase='deal';return renderHome();
}
function renderLibrary(){
 const s=screen(`<div class="pt topbar"><span style="width:40px"></span><span class="brand">mood</span><span class="icon-btn">⌕</span></div>
  <h2 style="text-align:center;margin-bottom:14px">ספריית הקלפים</h2><div class="chips" id="ch"></div><div class="grid" id="g"></div>`);
 const ch=s.querySelector('#ch');['הכל','אומץ','חיבור','מנוחה','נוכחות','גבולות','סקרנות'].forEach((c,i)=>ch.appendChild(el(`<div class="chip ${i===0?'on':''}">${c}</div>`)));
 const g=s.querySelector('#g');
 CARDS.forEach((c,i)=>{const w=el(`<div style="animation-delay:${i*.04}s"><div class="cw"></div><div class="cap" style="text-align:center;margin-top:7px">${c.name}</div></div>`);w.querySelector('.cw').appendChild(cardEl(c,i*13+1));g.appendChild(w);});
 nav();
}
function renderJourney(){
 const s=screen(`<div class="pt topbar"><span style="width:40px"></span><span class="brand">mood</span><span style="width:40px"></span></div>
  <div class="center-col" style="min-height:70vh"><div class="eyebrow rise">המסע שלך</div>
   <h1 class="rise" style="animation-delay:.05s">${Math.min(state.day,7)} מתוך 7 ימים</h1>
   <canvas id="con" style="width:284px;height:284px;margin:16px 0"></canvas>
   <p class="lead rise" style="animation-delay:.2s;max-width:320px">כל קלף ששמרת הופך לאור. יחד הם מציירים מי שאתה נעשה.</p>
   ${state.day>=7?'<button class="btn" id="rs" style="margin-top:18px">התחל מסע חדש</button>':''}</div>`);
 animateConstellation(s.querySelector('#con'));
 const rs=s.querySelector('#rs');if(rs)rs.onclick=()=>{if(confirm('להתחיל מסע חדש?')){localStorage.removeItem(KEY);location.reload()}};nav();
}
function animateConstellation(cv){
 const dpr=2;cv.width=284*dpr;cv.height=284*dpr;const x=cv.getContext('2d');const kept=state.kept.length;const cx=142,cy=142,r=100;
 const gen=ANIMGEN;const t0=performance.now();
 (function loop(now){
  if(gen!==ANIMGEN||!cv.isConnected)return;const t=(now-t0)/1000;
  x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,284,284);
  x.strokeStyle='rgba(201,162,94,.14)';x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();
  const prog=Math.min(kept, kept*Math.min(1,t/1.2)); // draw-in
  x.strokeStyle='rgba(255,214,150,.4)';x.lineWidth=1;x.beginPath();
  for(let i=0;i<Math.ceil(prog)&&i<7;i++){const a=-Math.PI/2+i/7*Math.PI*2;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
  for(let i=0;i<7;i++){const a=-Math.PI/2+i/7*Math.PI*2;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;const on=i<prog;
   if(on){const tw=.7+.3*Math.sin(t*2+i);const g=x.createRadialGradient(px,py,0,px,py,17*tw);g.addColorStop(0,`rgba(255,238,196,${tw})`);g.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,17,0,7);x.fill();x.fillStyle='#fff3d6';x.beginPath();x.arc(px,py,3.4,0,7);x.fill();}
   else{x.fillStyle='rgba(201,162,94,.25)';x.beginPath();x.arc(px,py,2,0,7);x.fill();}}
  if(t<3||kept<7||true)requestAnimationFrame(loop);
 })(t0);
}
function renderProfile(){
 const rows=['המסע שלי','הקלפים שלי','יומן מסע','סטטיסטיקות','הגדרות'];
 const s=screen(`<div class="pt topbar"><span style="width:40px"></span><span class="brand">mood</span><span style="width:40px"></span></div>
  <div class="rise" style="display:flex;align-items:center;gap:16px;margin:10px 0 6px">
    <div style="width:64px;height:64px;border-radius:50%;overflow:hidden;border:1px solid var(--line)" id="av"></div>
    <div><div style="font-size:22px">${state.name||'אורח/ת'}</div><div class="sm dim">מסע ${state.day} ימים</div></div></div>
  <div class="divider"></div>
  ${rows.map((r,i)=>`<div class="menu-row rise" style="animation-delay:${i*.05}s">${r}<span class="g">›</span></div>`).join('')}
  <div class="menu-row rise" id="reset" style="color:var(--gold)">התחל מסע חדש<span class="g">↺</span></div>`);
 const a=cardEl(byId('hope'),3);a.style.height='64px';s.querySelector('#av').appendChild(a);
 s.querySelector('#reset').onclick=()=>{if(confirm('להתחיל מסע חדש?')){localStorage.removeItem(KEY);location.reload()}};nav();
}
route();
