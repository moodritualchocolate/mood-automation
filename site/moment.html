<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="theme-color" content="#efe7d6"/>
<title>MOOD · רגע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe6d4; --ink:#3a332a; --ink-soft:#6c6250; --faint:#9a8f78;
  --olive:#6d7a4c; --olive-d:#586440; --dusk:#8a7f93; --dusk-d:#6f6580;
  --line:#d9ccb2;
  --serif:'Frank Ruhl Libre',serif; --sans:'Heebo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0e0c08;color:var(--ink);font-family:var(--sans);font-weight:300;
  overflow:hidden;position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*9/16);
  background:var(--paper);overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.6)}

.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease}
.screen.on{opacity:1;visibility:visible}
.scene{position:absolute;inset:0;background-size:cover;background-position:center top;
  background-color:var(--paper)}
.scene.enter{animation:kb 6s ease-out both}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1)}}
/* bottom scrim so text sits on the paper-fade zone */
.veil{position:absolute;left:0;right:0;bottom:0;height:52%;
  background:linear-gradient(180deg,rgba(239,230,212,0) 0%,rgba(239,230,212,.82) 38%,var(--paper) 66%)}

.top{position:absolute;top:0;left:0;right:0;height:8%;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;z-index:4}
.bk{background:none;border:none;color:var(--ink-soft);width:30px;height:30px;cursor:pointer;opacity:.6}
.bk svg{width:22px;height:22px}
.pips{display:flex;gap:5px}
.pip{width:6px;height:6px;border-radius:50%;background:rgba(90,72,40,.25)}
.pip.on{background:var(--olive)}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--olive-d);font-weight:400}

.panel{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 26px max(26px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;
  padding-bottom:max(30px,env(safe-area-inset-bottom))}
.kick{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive-d);font-weight:400}
.say{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.4;color:var(--ink);white-space:pre-line;text-wrap:balance}
.say.sm{font-size:20px}
.hint{font-size:14px;color:var(--ink-soft);line-height:1.55;max-width:32ch}
.btns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:360px;margin-top:4px}
.btn{min-height:56px;border:none;border-radius:30px;cursor:pointer;font-family:var(--sans);
  font-weight:500;font-size:16.5px;color:#fbf7ee;padding:8px 18px;line-height:1.3;
  box-shadow:0 8px 20px -10px rgba(70,55,30,.5);transition:transform .1s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.olive{background:var(--olive)} .btn.dusk{background:var(--dusk)}
.btn.line{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);box-shadow:none;font-weight:400}
.chips{display:flex;gap:10px;justify-content:center;width:100%;max-width:360px}
.chip{flex:1;min-height:52px;border:1.5px solid var(--line);border-radius:26px;background:rgba(255,255,255,.35);
  cursor:pointer;font-family:var(--sans);font-size:15.5px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.chip:active{transform:scale(.98)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.dot.g{background:var(--olive)} .dot.w{background:#cfc4ab;border:1px solid var(--faint)}
.fade{animation:fu .6s ease both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.32s}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* exit-to-life: UI recedes */
.breathe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;
  background:radial-gradient(circle at 50% 45%,rgba(239,230,212,.2),rgba(239,230,212,.86) 70%);opacity:0;visibility:hidden;transition:opacity 1s}
.breathe.on{opacity:1;visibility:visible}
.breathe .ring{width:120px;height:120px;border-radius:50%;border:1.5px solid var(--olive);
  animation:pulse 3.6s ease-in-out infinite;display:flex;align-items:center;justify-content:center;color:var(--olive-d);font-family:var(--serif);font-size:17px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.12s!important}}
</style>
</head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="i-back"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M14 6l-6 6 6 6"/></g>
</defs></svg>

<script>
//===================== MOMENT DATA (mirrors content/moments/*.json) =====================
// The engine holds NO copy and NO moment-specific conditionals — everything is data.
const MOMENT = {
  moment_id:"presence_phone_conversation_003",
  title:"אני עדיין מקשיב",
  dir:"assets/moments/presence_phone_conversation_003/screens",
  images:{recognition:"01_recognition.jpg",identification:"02_identification.jpg",opportunity:"03_opportunity.jpg",
    exit_to_life:"04_exit_to_life.jpg",return:"05_return.jpg",choice_connected:"06a_chose_differently.jpg",
    choice_not_yet:"06b_not_yet.jpg",witness_connected:"08a_witness_chose_differently.jpg",
    witness_not_yet:"08b_witness_not_yet.jpg",continuation:"10_continuation.jpg"},
  copy:{
    recognition:"״אני עדיין מקשיב…״\nאמרתי לעצמי כשהרמתי את הטלפון.",
    identification_prompt:"זה אני?", identification_options:["זה אני","לא ממש"],
    opportunity:"תן לשיחה להיגמר לפני שאתה פותח את המסך.",
    exit_to_life:"צא. השיחה הבאה לא תקרה כאן.",
    exit_hint:"עשה את זה עכשיו, בחיים. חזור כשתסיים — אין מהירות.",
    return_prompt:"כשהרגע חזר…",
    branch_connected_label:"נשארתי בשיחה", branch_not_yet_label:"עוד לא",
    outcome_connected_title:"בחרת אחרת", outcome_not_yet_title:"עוד לא — וזה בסדר",
    witness_connected:"השיחה קיבלה עוד כמה רגעים להיות באמת שיחה.",
    witness_not_yet:"היד עלתה לפני ששמת לב. עכשיו כבר יש רגע קטן שבו אפשר לעצור אותה.",
    continuation:"מחר יגיע עוד רגע. המסע ממשיך."
  }
};

//===================== GENERIC ENGINE (universal MOOD loop) =====================
const stage=document.getElementById("stage");
const svg=id=>`<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
const buzz=(ms=12)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const img=k=>`${MOMENT.dir}/${MOMENT.images[k]}`;
const C=MOMENT.copy;
let branch=null, hist=[];

// the fixed loop (flow, not copy) — Recognition→Identification→Opportunity→Exit→Return→Chose/NotYet→Witness→Continuation
const STEP={recognition:0,identification:1,opportunity:2,exit_to_life:3,return:4,outcome:5,witness:6,continuation:7};
const TOTAL=8;

function paint(imgKey,{pip,html,kbmove=true}={}){
  const el=document.createElement("div");el.className="screen";
  el.innerHTML=`
    <div class="scene ${kbmove?'enter':''}" style="background-image:url('${img(imgKey)}')"></div>
    <div class="veil"></div>
    <div class="top">
      <button class="bk" onclick="back()">${svg("i-back")}</button>
      <div class="pips">${Array.from({length:TOTAL}).map((_,i)=>`<div class="pip ${i<=pip?'on':''}"></div>`).join("")}</div>
      <div class="eyebrow">נוכחות</div>
    </div>
    <div class="panel">${html}</div>`;
  const old=stage.querySelector(".screen.on");
  stage.appendChild(el);
  requestAnimationFrame(()=>{el.classList.add("on");if(old){old.classList.remove("on");setTimeout(()=>old.remove(),520);}});
  return el;
}
function go(fn){hist.push(fn);fn();}
function back(){buzz();if(hist.length>1){hist.pop();hist[hist.length-1]();}else location.href="index.html";}

// ---- steps (generic; all text/images from data) ----
function Recognition(){
  const el=paint("recognition",{pip:STEP.recognition,html:`
    <div class="say fade">${C.recognition}</div>
    <div class="btns fade d2"><button class="btn olive" id="n">המשך</button></div>`});
  el.querySelector("#n").onclick=()=>{buzz();go(Identification)};
}
function Identification(){
  const el=paint("identification",{pip:STEP.identification,html:`
    <div class="kick fade">${C.identification_prompt}</div>
    <div class="chips fade d1" style="margin-top:6px">
      <button class="chip" data-b="me"><span class="dot g"></span>${C.identification_options[0]}</button>
      <button class="chip" data-b="notme"><span class="dot w"></span>${C.identification_options[1]}</button>
    </div>`});
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{buzz();go(Opportunity)});
}
function Opportunity(){
  const el=paint("opportunity",{pip:STEP.opportunity,html:`
    <div class="kick fade">ההזדמנות שלך</div>
    <div class="say sm fade d1">${C.opportunity}</div>
    <div class="btns fade d2"><button class="btn olive" id="n">אני מוכן</button></div>`});
  el.querySelector("#n").onclick=()=>{buzz();go(ExitToLife)};
}
function ExitToLife(){
  const el=paint("exit_to_life",{pip:STEP.exit_to_life,html:`
    <div class="say sm fade">${C.exit_to_life}</div>
    <div class="hint fade d1">${C.exit_hint}</div>
    <div class="btns fade d2">
      <button class="btn olive" id="did">עשיתי — חזרתי</button>
      <button class="btn line" id="later">אחזור מאוחר יותר</button>
    </div>`});
  // "Exit to life": the UI recedes into a quiet breath before Return.
  const br=document.createElement("div");br.className="breathe";
  br.innerHTML=`<div class="ring">קח את הרגע</div>`;el.appendChild(br);
  el.querySelector("#did").onclick=()=>{buzz(18);br.classList.add("on");setTimeout(()=>{go(Return)},1400)};
  el.querySelector("#later").onclick=()=>{buzz();location.href="index.html"};
}
function Return(){
  const el=paint("return",{pip:STEP.return,html:`
    <div class="say sm fade">${C.return_prompt}</div>
    <div class="btns fade d1">
      <button class="btn olive" id="c"><span class="dot g" style="margin-inline-end:8px"></span>${C.branch_connected_label}</button>
      <button class="btn dusk" id="ny"><span class="dot w" style="margin-inline-end:8px"></span>${C.branch_not_yet_label}</button>
    </div>`});
  el.querySelector("#c").onclick=()=>{buzz(16);branch="connected";go(Outcome)};
  el.querySelector("#ny").onclick=()=>{buzz(16);branch="not_yet";go(Outcome)};
}
function Outcome(){
  const isC=branch==="connected";
  const el=paint(isC?"choice_connected":"choice_not_yet",{pip:STEP.outcome,html:`
    <div class="say fade">${isC?C.outcome_connected_title:C.outcome_not_yet_title}</div>
    <div class="btns fade d2"><button class="btn ${isC?'olive':'dusk'}" id="n">המשך</button></div>`});
  el.querySelector("#n").onclick=()=>{buzz();go(Witness)};
}
function Witness(){
  const isC=branch==="connected";
  const el=paint(isC?"witness_connected":"witness_not_yet",{pip:STEP.witness,html:`
    <div class="kick fade">העדות</div>
    <div class="say sm fade d1">${isC?C.witness_connected:C.witness_not_yet}</div>
    <div class="btns fade d2"><button class="btn ${isC?'olive':'dusk'}" id="n">המשך</button></div>`});
  el.querySelector("#n").onclick=()=>{buzz();go(Continuation)};
}
function Continuation(){
  const el=paint("continuation",{pip:STEP.continuation,html:`
    <div class="say sm fade">${C.continuation}</div>
    <div class="btns fade d2">
      <button class="btn olive" id="again">רגע חדש</button>
      <button class="btn line" id="home">חזרה למשחק</button>
    </div>`});
  el.querySelector("#again").onclick=()=>{buzz();branch=null;hist=[];go(Recognition)};
  el.querySelector("#home").onclick=()=>{buzz();location.href="index.html"};
}

// preload images then start
Object.values(MOMENT.images).forEach(f=>{const i=new Image();i.src=`${MOMENT.dir}/${f}`;});
go(Recognition);
</script>
</body>
</html>
