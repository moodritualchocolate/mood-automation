<script>
const VERT=`attribute vec2 a;varying vec2 vUv;void main(){vUv=a*0.5+0.5;gl_Position=vec4(a,0.,1.);}`, FRAG=`
precision highp float;
uniform sampler2D uPhoto; uniform sampler2D uDepth; uniform vec2 uRes; uniform vec2 uLight; uniform float uTime;
varying vec2 vUv;
void main(){
  vec2 uv=vUv; float ca=uRes.x/uRes.y, pa=1.0;
  vec2 puv=uv-0.5;
  if(ca>pa) puv.x*=ca; else puv.y/=ca;             // contain the square
  puv=puv*0.78+vec2(0.5,0.40);                     // zoom + lift so the bar sits high, white below for copy
  vec2 base=puv;
  float dep=texture2D(uDepth,base).r;              // 1 near (the bar) · 0 far (white)
  puv+=uLight*(dep-0.30)*0.11;                     // 3D pop — near shifts more with tilt/finger
  vec3 c=texture2D(uPhoto,puv).rgb;
  float lum=dot(c,vec3(0.333));
  float choc=smoothstep(0.62,0.32,lum);            // the bar (dark), not the white
  // wet gloss that follows your finger, only on the chocolate
  vec2 gp=vec2(0.5+uLight.x*0.45,0.42+uLight.y*0.45);
  float g=smoothstep(0.30,0.0,length((uv-gp)*vec2(ca,1.0)));
  c+=vec3(0.5,0.4,0.26)*g*choc*0.7;
  gl_FragColor=vec4(c,1.0);
}
`;
