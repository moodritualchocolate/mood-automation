#mood-hero{--choc:#2a1a10;--acc:#C8703F;position:relative;overflow:hidden;width:100%;height:100svh;min-height:640px;
  direction:rtl;font-family:"MoodHeebo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;
  background:radial-gradient(120% 85% at 50% 30%,#F7F1E8 0%,#F1E7D8 55%,#E7D8C2 100%);}
#mood-hero *{box-sizing:border-box;}
#mood-hero .hero-glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(46% 40% at 50% 42%,rgba(255,250,240,.7),rgba(255,250,240,0) 70%);}
/* ---- floating product stage ---- */
#mood-hero .stage{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:min(86vw,430px);aspect-ratio:1/1.34;}
#mood-hero .el{position:absolute;will-change:transform;filter:drop-shadow(0 24px 34px rgba(60,36,16,.34));
  transform:translate(var(--mx,0),var(--my,0));}
#mood-hero .bar{left:50%;top:50%;width:47%;transform:translate(-50%,-50%);z-index:2;animation:floatBar 7s ease-in-out infinite;}
#mood-hero .d{width:29%;z-index:3;filter:drop-shadow(0 16px 22px rgba(60,36,16,.36));}
#mood-hero .d-bolt{left:2%; top:33%;  animation:floatA 6.2s ease-in-out infinite;}
#mood-hero .d-wave{left:24%;top:64%;z-index:4; animation:floatB 7.6s ease-in-out infinite .3s;}
#mood-hero .d-moon{right:1%;top:49%; animation:floatC 6.9s ease-in-out infinite .15s;}
@keyframes floatBar{0%,100%{transform:translate(calc(-50% + var(--mx,0)),calc(-50% + var(--my,0))) rotate(-.6deg)}50%{transform:translate(calc(-50% + var(--mx,0)),calc(-50% + var(--my,0) - 14px)) rotate(.5deg)}}
@keyframes floatA{0%,100%{transform:translate(var(--mx,0),var(--my,0)) rotate(-2deg)}50%{transform:translate(var(--mx,0),calc(var(--my,0) - 18px)) rotate(2deg)}}
@keyframes floatB{0%,100%{transform:translate(var(--mx,0),var(--my,0)) rotate(2deg)}50%{transform:translate(var(--mx,0),calc(var(--my,0) - 15px)) rotate(-2deg)}}
@keyframes floatC{0%,100%{transform:translate(var(--mx,0),var(--my,0)) rotate(1deg)}50%{transform:translate(var(--mx,0),calc(var(--my,0) - 20px)) rotate(-3deg)}}
/* ---- drifting cocoa crumbs ---- */
#mood-hero .crumb{position:absolute;width:9px;height:9px;border-radius:46% 54% 50% 50%/54% 46% 54% 46%;
  background:radial-gradient(circle at 35% 30%,#5a3720,#2c1a0e);opacity:.8;z-index:1;
  box-shadow:0 4px 8px rgba(60,36,16,.25);will-change:transform;}
#mood-hero .c1{left:6%;top:16%;animation:drift 9s ease-in-out infinite;}
#mood-hero .c2{left:88%;top:22%;width:7px;height:7px;animation:drift 11s ease-in-out infinite .8s;}
#mood-hero .c3{left:12%;top:82%;width:6px;height:6px;animation:drift 10s ease-in-out infinite 1.4s;}
#mood-hero .c4{left:80%;top:80%;animation:drift 12s ease-in-out infinite .5s;}
#mood-hero .c5{left:44%;top:6%;width:6px;height:6px;animation:drift 8.5s ease-in-out infinite 1.1s;}
#mood-hero .c6{left:64%;top:92%;width:7px;height:7px;animation:drift 10.5s ease-in-out infinite .2s;}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(6px,-14px) rotate(40deg)}}
/* ---- copy ---- */
#mood-hero .copy{position:absolute;left:0;right:0;bottom:clamp(24px,5vh,54px);text-align:center;padding:0 22px;z-index:5;}
#mood-hero .eyebrow{font-weight:800;letter-spacing:.30em;font-size:clamp(10px,2.5vw,12.5px);color:var(--acc);text-transform:uppercase;}
#mood-hero h1{margin:.5em 0 .7em;font-weight:900;line-height:1.02;letter-spacing:-.02em;
  font-size:clamp(30px,8.4vw,52px);color:var(--choc);}
#mood-hero h1 em{font-style:normal;color:var(--acc);}
#mood-hero .cta{display:inline-flex;align-items:center;gap:9px;padding:14px 30px;border-radius:100px;
  background:var(--choc);color:#F7F1E8;font-weight:800;font-size:clamp(15px,4vw,17px);text-decoration:none;
  box-shadow:0 14px 30px -10px rgba(42,26,16,.6);transition:transform .16s,box-shadow .3s;}
#mood-hero .cta:hover{transform:translateY(-2px);box-shadow:0 20px 40px -10px rgba(42,26,16,.65);}
#mood-hero .cta:active{transform:translateY(1px) scale(.99);}
#mood-hero .cta .ar{font-weight:900;font-size:1.05em;}
/* ---- wide screens: product on one side, copy on the other ---- */
@media(min-width:860px){
  #mood-hero .stage{left:68%;top:50%;width:min(40vw,440px);}
  #mood-hero .copy{left:7%;right:auto;bottom:auto;top:50%;transform:translateY(-50%);text-align:right;max-width:42%;}
  #mood-hero h1{font-size:clamp(40px,4.6vw,66px);}
}
/* keep a gentle float even when the OS requests reduced motion (brand hero) */
@media(prefers-reduced-motion:reduce){#mood-hero .el{animation-duration:11s!important;}#mood-hero .crumb{animation-duration:16s!important;}}
</style>

<script>
(function(){
  const hero=document.getElementById("mood-hero");
  const layers=[["bar",5],["d-bolt",16],["d-wave",13],["d-moon",15]].map(([c,d])=>({el:hero.querySelector("."+c),d}));
  let tx=0,ty=0,cx=0,cy=0;
  function onMove(e){const r=hero.getBoundingClientRect();const p=e.touches?e.touches[0]:e;
    tx=((p.clientX-r.left)/r.width-0.5);ty=((p.clientY-r.top)/r.height-0.5);}
  hero.addEventListener("pointermove",onMove,{passive:true});
  hero.addEventListener("touchmove",onMove,{passive:true});
  (function tick(){cx+=(tx-cx)*0.06;cy+=(ty-cy)*0.06;
    for(const L of layers){L.el.style.setProperty("--mx",(-cx*L.d).toFixed(2)+"px");L.el.style.setProperty("--my",(-cy*L.d).toFixed(2)+"px");}
    requestAnimationFrame(tick);})();
})();
</script>
</body></html>
