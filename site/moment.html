<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#e9dfc8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>MOOD · רגע</title>
<style>
:root{
  --paper:#efe6d4; --sheet:#f4eede; --ink:#38312a; --ink-soft:#655c4b; --faint:#9a8f78;
  --olive:#6d7a4c; --olive-d:#586440; --terra:#b06a45; --dusk:#8a7f93; --line:#ddd0b6; --gold:#c9a25e;
  --serif:'Frank Ruhl Libre','David Libre','Times New Roman',serif;
  --sans:'Heebo','Assistant','Arial Hebrew',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0c0a07;color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden;position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100vw;height:100dvh;max-width:calc(100dvh*9/16);background:var(--paper);overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.7);perspective:1200px}
.screen{position:absolute;inset:0;z-index:2;opacity:0;visibility:hidden;transition:opacity .6s ease}
.screen.on{opacity:1;visibility:visible}
.screen.out{opacity:0;transition:opacity .6s ease}

/* ---- living diorama ---- */
.diorama{position:absolute;inset:0;overflow:hidden;background:var(--paper);background-size:cover;background-position:center 20%}
.layer{position:absolute;inset:-10%;background-size:cover;background-position:center 20%;will-change:transform;backface-visibility:hidden;transition:transform .18s cubic-bezier(.2,.7,.2,1)}
.layer.fg{background-size:contain;background-repeat:no-repeat;background-position:center 20%}
.layer.shadow{filter:blur(14px) brightness(0);opacity:.3;background-size:contain;background-repeat:no-repeat;background-position:center 20%}
.vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 70px 70px -55px rgba(50,38,15,.4), inset 0 -40px 70px -35px rgba(50,38,15,.3)}
.dim{position:absolute;inset:0;background:rgba(233,223,200,0);transition:background 1.1s;pointer-events:none}
.dim.on{background:rgba(233,223,200,.74)}

.top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 22px 0;z-index:8}
.bk{background:rgba(244,238,222,.6);backdrop-filter:blur(6px);border:none;color:var(--ink-soft);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bk svg{width:20px;height:20px}
.rgv{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;background:rgba(244,238,222,.6);backdrop-filter:blur(6px);padding:8px 14px;border-radius:20px}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-radius:30px 30px 0 0;
  box-shadow:0 -22px 55px -22px rgba(50,38,18,.45), 0 -1px 0 rgba(201,162,94,.25);
  padding:26px clamp(22px,7vw,34px) max(26px,calc(env(safe-area-inset-bottom) + 22px));
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px;transform:translateY(30px);opacity:0;transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .5s}
.sheet.up{transform:none;opacity:1}
.sheet::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:3px;background:var(--line)}
.mid{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:0 34px;text-align:center}

.kick{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive-d);font-weight:600;opacity:0}
.line{font-family:var(--serif);font-weight:500;line-height:1.4;color:var(--ink);white-space:pre-line;text-wrap:balance;opacity:0}
.line.accent{color:var(--terra)}
.line.s{font-family:var(--sans);font-weight:400;color:var(--ink-soft);line-height:1.6;font-size:clamp(14px,4vw,16px)}
.line.m{font-size:clamp(19px,5.6vw,23px)} .line.l{font-size:clamp(22px,6.4vw,27px)}
.line.xl{font-size:clamp(26px,8vw,34px);line-height:1.3;color:#f3ead6;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.show{animation:rise .85s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.acts{display:flex;flex-direction:column;gap:11px;width:100%;max-width:380px;margin-top:8px;opacity:0}
.acts.show{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.btn{position:relative;overflow:hidden;min-height:60px;border:1px solid rgba(201,162,94,.32);border-radius:34px;cursor:pointer;
  font-family:var(--sans);font-weight:600;font-size:clamp(15px,4.6vw,17px);letter-spacing:.01em;color:#fbf7ee;padding:8px 18px;line-height:1.3;
  box-shadow:0 14px 28px -12px rgba(60,45,20,.7), inset 0 2px 0 rgba(255,255,255,.22), inset 0 -3px 8px rgba(0,0,0,.14);
  transition:transform .16s cubic-bezier(.2,.7,.2,1), box-shadow .22s, opacity .3s, filter .3s}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 6px 14px -10px rgba(60,45,20,.6), inset 0 2px 6px rgba(0,0,0,.2)}
.btn.olive{background:linear-gradient(165deg,#8c9a64,#5c6842 72%,#4b5535)}
.btn.dusk{background:linear-gradient(165deg,#a49aae,#6f6580 78%,#5d5470)}
.btn::after{content:"";position:absolute;top:0;left:-45%;width:34%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:sheen 5.5s ease-in-out infinite}
@keyframes sheen{0%,58%{left:-45%}82%{left:125%}100%{left:125%}}
.btn.picked{transform:scale(1.035);box-shadow:0 18px 34px -12px rgba(88,100,64,.75), 0 0 0 2px rgba(201,162,94,.5)}
.btn.dim{opacity:.38;filter:saturate(.6)}
.btn.soft{background:rgba(255,255,255,.66);color:var(--ink);border:1.5px solid var(--line);font-weight:500;
  box-shadow:0 7px 18px -9px rgba(60,45,20,.4), inset 0 1px 0 rgba(255,255,255,.6)}
.btn.soft::after{display:none}
.btn.soft:active{transform:translateY(1px) scale(.985)}
.btn.soft.picked{background:linear-gradient(165deg,#8c9a64,#5c6842);color:#fbf7ee;border-color:transparent;transform:scale(1.02)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid rgba(120,100,60,.22);box-shadow:none;font-weight:500;min-height:48px}
.btn.ghost::after{display:none}
.mtag{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:22px;background:rgba(109,122,76,.15);border:1px solid rgba(109,122,76,.45);color:var(--olive-d);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.tap{position:absolute;left:0;right:0;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));text-align:center;font-size:12px;color:rgba(60,45,20,.55);letter-spacing:.1em;z-index:7;animation:blink 2.8s ease-in-out infinite;pointer-events:none}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:.7}}

.open{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:0 34px;background:radial-gradient(130% 80% at 50% 32%,#f7f0dd,var(--paper) 58%,#e6dcc6)}
.halo{width:104px;height:104px;border-radius:50%;margin-bottom:4px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(176,106,69,.3),transparent 66%);animation:breath 5s ease-in-out infinite}
.halo::after{content:"";width:13px;height:13px;border-radius:50%;background:var(--terra);box-shadow:0 0 24px var(--terra)}
@keyframes breath{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.13);opacity:1}}
.breathe{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:9;background:radial-gradient(circle at 50% 45%,rgba(239,230,212,.46),rgba(233,223,200,.95) 66%);opacity:0;visibility:hidden;transition:opacity 1.1s}
.breathe.on{opacity:1;visibility:visible}
.breathe .ring{width:136px;height:136px;border-radius:50%;border:1.5px solid var(--olive);display:flex;align-items:center;justify-content:center;color:var(--olive-d);font-family:var(--serif);font-size:17px;animation:breath 4.6s ease-in-out infinite;box-shadow:0 0 40px -10px rgba(109,122,76,.5)}
.breathe .sub{font-size:14px;color:var(--ink-soft);max-width:26ch;line-height:1.6}
.note{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 40px;text-align:center;background:radial-gradient(120% 80% at 50% 40%,#f7f0dd,#e7ddC4);background:radial-gradient(120% 80% at 50% 40%,#f7f0dd,#e7ddc4)}
.note .leaf{color:var(--olive);opacity:.75}.note .leaf svg{width:30px;height:30px}
.note .rule{width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.bloom{position:absolute;inset:0;pointer-events:none;z-index:7}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.15s!important}.line,.kick,.acts,.sheet{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="fallback" style="position:absolute;inset:0;z-index:1;background:#efe6d4 url('assets/moments/presence_phone_conversation_003/screens/01_recognition.jpg') center 20%/cover;display:flex;align-items:flex-end;justify-content:center">
    <div style="background:#f4eede;border-radius:26px 26px 0 0;padding:24px 26px calc(env(safe-area-inset-bottom) + 26px);width:100%;text-align:center">
      <div style="font-family:'Frank Ruhl Libre',serif;font-size:22px;color:#38312a">רגע אחד מחכה לך.</div>
      <div style="font-size:13px;color:#9a8f78;margin-top:8px">אם המסך לא נטען — משוך למטה לרענון.</div>
    </div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="i-back"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M14 6l-6 6 6 6"/></g>
<g id="i-leaf"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M20 4C10 4 5 10 5 18c8 0 15-4 15-14zM8 18c3-5 6-8 10-10"/></g>
</defs></svg>
<script>
//======================= MOMENT DATA =======================
const MOMENT={
  rgv:"רגע 003", greetName:"",
  dir:"assets/moments/presence_phone_conversation_003",
  stems:{recognition:"01_recognition",identification:"02_identification",opportunity:"03_opportunity",exit:"04_exit_to_life",
    return:"05_return",connected:"06a_chose_differently",not_yet:"06b_not_yet",witness_c:"08a_witness_chose_differently",witness_n:"08b_witness_not_yet",continuation:"10_continuation"},
  recognition:[{t:"מישהו שאתה אוהב מדבר אליך."},{t:"והיד כבר על הטלפון.",accent:true}],
  identify_prompt:"זה אתה?", identify:["כן. גם לי","לא ממש"],
  reframe:[{t:"זה לא שאין לך זמן."},{t:"המסך פשוט מבקש עוד שנייה.",accent:true}],
  meaning:"השיחה הזאת\nלא תחזור בדיוק ככה.",
  mission:{tag:"המשימה שלך",lines:["הנח את הטלפון.","תן לשיחה להיגמר."],take:"אני בפנים",skip:"לא היום"},
  exit:{lines:["צא. זה קורה שם — לא כאן."],hint:"חזור כשזה יקרה.",breath:"קח את הרגע",back:"עשיתי"},
  return_prompt:"מה עשית?", branch_c:"נשארתי בשיחה", branch_n:"עוד לא",
  witness_c:["השיחה הפכה לשיחה.","והוא הרגיש את זה."],
  witness_n:["היד עלתה מהר מדי.","מחר תזהה את זה מוקדם יותר."],
  reward_c:"היית שם באמת.", reward_n:"למדת לזהות.",
  middah:{name:"נוכחות", def:"נוכחות היא היכולת להיות באמת\nבמקום שבו הגוף שלך כבר נמצא.",
    lead:"היא לא לתת למישהו את כל היום שלך —\nאלא רגע אחד שבו שום דבר אחר אינו חשוב יותר."},
  wisdom:{quote:"הֱוֵי מְקַבֵּל אֶת כָּל הָאָדָם\nבְּסֵבֶר פָּנִים יָפוֹת.", source:"פרקי אבות א׳, ט״ו"},
  continuation:["מחר — עוד רגע."]
};
//======================= ENGINE =======================
const stage=document.getElementById("stage");
const svg=id=>`<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
const buzz=(ms=12)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const M=MOMENT;let branch=null,hist=[];
const KEY="mood_moments_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{steps:0}}catch(e){return{steps:0}}};
const save=s=>localStorage.setItem(KEY,JSON.stringify(s));
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

// ---- parallax controller (targets current diorama layers) ----
let cur={bg:null,sh:null,fg:null}, tx=0,ty=0, ix=0,iy=0; // target & input
function apply(){
  const nx=ix, ny=iy;
  if(cur.bg) cur.bg.style.transform=`translate3d(${nx*-9}px,${ny*-7}px,0) scale(1.14)`;
  if(cur.sh) cur.sh.style.transform=`translate3d(${nx*24+7}px,${ny*20+12}px,0)`;
  if(cur.fg) cur.fg.style.transform=`translate3d(${nx*22}px,${ny*18}px,0)`;
}
// idle float + smoothing loop
let phase=0;
function loop(){
  phase+=0.012;
  const fx=Math.sin(phase)*0.28, fy=Math.cos(phase*0.8)*0.2;   // gentle life
  ix += ((tx+fx)-ix)*0.08; iy += ((ty+fy)-iy)*0.08;
  apply(); requestAnimationFrame(loop);
}
if(!reduce) loop();
function setInput(x,y){tx=Math.max(-1.4,Math.min(1.4,x));ty=Math.max(-1.4,Math.min(1.4,y));}
if(!reduce){
  window.addEventListener("pointermove",e=>setInput((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2),{passive:true});
  window.addEventListener("deviceorientation",e=>{if(e.gamma==null)return;setInput(e.gamma/26,(e.beta-45)/26);},{passive:true});
}
function enableGyro(){ // iOS needs a gesture-triggered permission
  try{ if(typeof DeviceOrientationEvent!=="undefined" && DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().catch(()=>{});} }catch(e){}
}

function frame(sceneKey,{dim=false,mid=false,tap=false}={}){
  const stem=M.stems[sceneKey];
  const bg=`${M.dir}/depth/${stem}_bg.jpg`, fg=`${M.dir}/depth/${stem}_fg.png`, flat=`${M.dir}/screens/${stem}.jpg`;
  const el=document.createElement("div");el.className="screen";
  el.innerHTML=`
    <div class="diorama" style="background-image:url('${flat}')">
      <div class="layer bg" style="background-image:url('${bg}')"></div>
      <div class="layer shadow" style="background-image:url('${fg}')"></div>
      <div class="layer fg" style="background-image:url('${fg}')"></div>
      <div class="vign"></div><div class="dim ${dim?'on':''}"></div>
    </div>
    <div class="top"><button class="bk" onclick="back()">${svg("i-back")}</button><div class="rgv">${M.rgv}</div><div style="width:38px"></div></div>
    ${mid?`<div class="mid"></div>`:`<div class="sheet"></div>`}
    ${tap?`<div class="tap">הקש להמשך</div>`:""}`;
  const old=stage.querySelector(".screen.on");stage.appendChild(el);
  // point parallax at this scene's layers
  cur={bg:el.querySelector(".layer.bg"),sh:el.querySelector(".layer.shadow"),fg:el.querySelector(".layer.fg")};
  requestAnimationFrame(()=>{el.classList.add("on");
    const sh=el.querySelector(".sheet");if(sh)setTimeout(()=>sh.classList.add("up"),140);
    if(old){old.classList.remove("on");old.classList.add("out");setTimeout(()=>old.remove(),640);}});
  return el;
}
function plain(html){const el=document.createElement("div");el.className="screen";el.innerHTML=html;
  const old=stage.querySelector(".screen.on");stage.appendChild(el);
  requestAnimationFrame(()=>{el.classList.add("on");if(old){old.classList.remove("on");old.classList.add("out");setTimeout(()=>old.remove(),640);}});
  cur={bg:null,sh:null,fg:null};return el;}
function box(el){return el.querySelector(".sheet")||el.querySelector(".mid")}
function addLine(p,t,cls="m",ac=false){const d=document.createElement("div");d.className=`line ${cls} ${ac?'accent':''}`;d.textContent=t;p.appendChild(d);requestAnimationFrame(()=>d.classList.add("show"));return d;}
function addKick(p,h){const d=document.createElement("div");d.className="kick";d.innerHTML=h;p.appendChild(d);requestAnimationFrame(()=>d.classList.add("show"));return d;}
function actions(p,h){const w=document.createElement("div");w.className="acts";w.innerHTML=h;p.appendChild(w);requestAnimationFrame(()=>w.classList.add("show"));return w;}
function choose(btn,p,fn){buzz(20);btn.classList.add("picked");p.querySelectorAll(".btn").forEach(x=>{if(x!==btn)x.classList.add("dim")});setTimeout(fn,360);}
function go(fn){hist.push(fn);fn();}
function back(){buzz();if(hist.length>1){hist.pop();hist[hist.length-1]();}else location.href="index.html";}
// one sentence at a time — clears the previous line before showing the next (never stacks)
function sequence(el,p,beats,cls,{onDone}={}){let i=0;
  const clear=()=>p.querySelectorAll(".line").forEach(o=>{o.style.transition="opacity .3s";o.style.opacity="0";setTimeout(()=>o.remove(),300);});
  const step=()=>{if(i<beats.length){const b=beats[i++];clear();
    setTimeout(()=>addLine(p,b.t,cls,b.accent), i>1?300:0);
    if(i<beats.length)arm();else{el.querySelector(".tap")?.remove();setTimeout(onDone,1000);}}};
  function arm(){const h=ev=>{if(ev.target.closest(".btn"))return;el.removeEventListener("click",h);step();};setTimeout(()=>el.addEventListener("click",h),750);}
  step();}

function Open(){
  const el=document.createElement("div");el.className="screen";
  const hr=new Date().getHours();const g=hr<12?"בוקר טוב":hr<18?"צהריים טובים":"ערב טוב";
  el.innerHTML=`<div class="open"><div class="halo"></div>
    <div class="line l show">${g}${M.greetName?", "+M.greetName:""}.</div>
    <div class="line s show" style="animation-delay:.5s;max-width:24ch">יש רגע אחד שמחכה לך היום.</div>
    <div class="acts show" style="animation-delay:1.1s;max-width:320px"><button class="btn olive" id="enter">להיכנס לרגע</button></div></div>`;
  stage.appendChild(el);requestAnimationFrame(()=>el.classList.add("on"));
  el.querySelector("#enter").onclick=()=>{buzz();enableGyro();go(MiddahIntro)};
}
function MiddahIntro(){
  const el=plain(`<div class="open">
    <div class="halo"></div>
    <div class="line s show" style="letter-spacing:.24em;text-transform:uppercase;color:var(--olive-d);font-weight:600;font-family:var(--sans)">מידה</div>
    <div class="line l show" style="animation-delay:.25s;font-size:clamp(30px,9vw,40px)">${M.middah.name}</div>
    <div class="line s show" style="animation-delay:.7s;max-width:28ch;white-space:pre-line">${M.middah.def}</div>
    <div class="acts show" style="animation-delay:1.2s;max-width:320px"><button class="btn olive" id="go">מתחילים</button></div></div>`);
  el.querySelector("#go").onclick=()=>{buzz();go(Recognition)};
}
function Wisdom(){
  const el=plain(`<div class="note">
    <div class="leaf show">${svg("i-leaf")}</div>
    <div class="rule show" style="animation-delay:.2s"></div>
    <div class="line show" style="animation-delay:.4s;font-size:clamp(23px,7vw,30px);line-height:1.55;white-space:pre-line">״${M.wisdom.quote}״</div>
    <div class="line s show" style="animation-delay:.9s;letter-spacing:.12em">${M.wisdom.source}</div>
    <div class="acts show" style="animation-delay:1.4s;max-width:320px"><button class="btn olive" id="n">המשך</button></div></div>`);
  el.querySelector("#n").onclick=()=>{buzz();go(Continuation)};
}
function Recognition(){const el=frame("recognition",{tap:true});sequence(el,box(el),M.recognition,"l",{onDone:()=>go(Identification)});}
function Identification(){const el=frame("identification");const p=box(el);addLine(p,M.identify_prompt,"l");
  setTimeout(()=>{actions(p,`<button class="btn soft" data-b="0">${M.identify[0]}</button><button class="btn soft" data-b="1">${M.identify[1]}</button>`);
    p.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>choose(b,p,()=>go(Reframe)));},750);}
function Reframe(){const el=frame("opportunity",{tap:true});sequence(el,box(el),M.reframe,"m",{onDone:()=>go(Meaning)});}
function Meaning(){const el=frame("opportunity",{dim:true,mid:true,tap:true});addLine(box(el),M.meaning,"xl");
  const h=()=>{el.removeEventListener("click",h);el.querySelector(".tap")?.remove();go(Mission);};setTimeout(()=>el.addEventListener("click",h),1500);}
function Mission(){const el=frame("opportunity",{tap:true});const p=box(el);addKick(p,`<span class="mtag">${M.mission.tag}</span>`);
  sequence(el,p,M.mission.lines.map(t=>({t})),"l",{onDone:()=>{
    actions(p,`<button class="btn olive" id="take">${M.mission.take}</button><button class="btn ghost" id="skip">${M.mission.skip}</button>`);
    p.querySelector("#take").onclick=()=>{buzz(18);go(ExitToLife)};p.querySelector("#skip").onclick=()=>{buzz();location.href="index.html"};}});}
function ExitToLife(){const el=frame("exit");const p=box(el);
  addLine(p,M.exit.lines[0],"m");
  setTimeout(()=>addLine(p,M.exit.hint,"s"),900);
  setTimeout(()=>{actions(p,`<button class="btn olive" id="did">${M.exit.back}</button>`);
    const br=document.createElement("div");br.className="breathe";br.innerHTML=`<div class="ring">${M.exit.breath}</div><div class="sub">קח את הזמן.<br>אנחנו כאן כשתחזור.</div>`;el.appendChild(br);
    p.querySelector("#did").onclick=()=>{buzz(18);br.classList.add("on");setTimeout(()=>go(Return),1700)};},1500);}
function Return(){const el=frame("return");const p=box(el);addLine(p,M.return_prompt,"l");
  setTimeout(()=>{actions(p,`<button class="btn olive" id="c">${M.branch_c}</button><button class="btn dusk" id="ny">${M.branch_n}</button>`);
    p.querySelector("#c").onclick=e=>choose(e.currentTarget,p,()=>{branch="c";go(Witness)});
    p.querySelector("#ny").onclick=e=>choose(e.currentTarget,p,()=>{branch="n";go(Witness)});},750);}
function Witness(){const isC=branch==="c";const el=frame(isC?"witness_c":"witness_n",{tap:true});const p=box(el);
  const s=load();s.steps=(s.steps||0)+1;save(s);
  sequence(el,p,(isC?M.witness_c:M.witness_n).map(t=>({t})),"m",{onDone:()=>{if(isC)bloom(el);
    p.querySelectorAll(".line").forEach(o=>o.remove());
    const r=document.createElement("div");r.className="line m";r.innerHTML=`${isC?M.reward_c:M.reward_n}<br><span class="line s" style="display:block;margin-top:8px;color:var(--olive-d);font-weight:600">${s.steps===1?'רגע אחד נאסף':s.steps+' רגעים נאספו'}</span>`;
    p.appendChild(r);requestAnimationFrame(()=>r.classList.add("show"));
    actions(p,`<button class="btn ${isC?'olive':'dusk'}" id="n">המשך</button>`);p.querySelector("#n").onclick=()=>{buzz();go(Wisdom)};}});}
function Continuation(){const el=frame("continuation");const p=box(el);addLine(p,M.continuation[0],"m");
  setTimeout(()=>{actions(p,`<button class="btn olive" id="again">רגע חדש</button><button class="btn ghost" id="home">חזרה למשחק</button>`);
    p.querySelector("#again").onclick=()=>{buzz();branch=null;hist=[];go(Recognition)};p.querySelector("#home").onclick=()=>{buzz();location.href="index.html"};},1600);}
function bloom(el){const c=document.createElement("canvas");c.className="bloom";el.appendChild(c);
  const ctx=c.getContext("2d"),w=c.width=el.clientWidth,h=c.height=el.clientHeight;
  let ps=Array.from({length:50},()=>({x:w/2+(Math.random()-.5)*w*.5,y:h*.4+(Math.random()-.5)*90,vx:(Math.random()-.5)*1.3,vy:-Math.random()*1.5-.3,a:1,r:Math.random()*2.4+1}));
  let t=0;(function lp(){ctx.clearRect(0,0,w,h);t++;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.a-=.009;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`rgba(150,160,90,${Math.max(0,p.a)})`;ctx.fill()});if(t<150)requestAnimationFrame(lp);else c.remove();})();}
// lazy preload (light) — flat bases first, depth after
Object.values(M.stems).forEach(s=>{const i=new Image();i.src=`${M.dir}/screens/${s}.jpg`;});
setTimeout(()=>Object.values(M.stems).forEach(s=>{[`${M.dir}/depth/${s}_bg.jpg`,`${M.dir}/depth/${s}_fg.png`].forEach(u=>{const i=new Image();i.src=u;});}),1200);
// boot — if anything throws, the static #fallback stays visible (never blank)
try{
  Open();
  const fb=document.getElementById("fallback"); if(fb) setTimeout(()=>{fb.style.transition="opacity .5s";fb.style.opacity="0";setTimeout(()=>fb.remove(),500);}, 120);
}catch(e){ console.log("boot error",e); }
</script>
</body>
</html>
