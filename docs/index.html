<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17110c"><meta name="robots" content="noindex"></head><body><title>MOOD · Becoming</title>
<style>
  :root{
    --ground:#17110c; --ground2:#20170e; --panel:rgba(244,214,168,0.07);
    --ink:#f3e7d6; --muted:rgba(243,231,214,0.62); --faint:rgba(243,231,214,0.34);
    --accent:#e6a865; --label:#f4d6a8; --border:rgba(244,214,168,0.24);
    --serif:'Frank Ruhl Libre','Amiri','Times New Roman',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(130% 100% at 50% 22%, #241708 0%, var(--ground) 62%);
    color:var(--ink); font-family:var(--serif); direction:rtl;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
  #app{min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:40px 26px; text-align:center;}
  .inner{max-width:440px; width:100%; animation:rise .7s cubic-bezier(.16,1,.3,1) both;}
  .eyebrow{font-size:12px; letter-spacing:.22em; color:var(--label); opacity:.8;
    margin-bottom:20px; font-variant-numeric:tabular-nums;}
  h1{font-size:clamp(22px,6vw,28px); font-weight:400; line-height:1.4; letter-spacing:-.01em; margin:0 0 8px; text-wrap:balance;}
  p.lead{font-size:20px; line-height:1.62; font-weight:400; color:var(--ink); margin:0 0 24px; text-wrap:balance;}
  p.line{font-size:20px; line-height:1.62; font-weight:400; color:var(--muted); margin:8px 0; text-wrap:balance;}
  p.strong{font-size:24px; line-height:1.5; color:#f7ecdc; margin:12px 0;}
  .sub{font-size:14px; color:var(--faint); margin-top:4px;}
  .stack{display:flex; flex-direction:column; gap:12px; margin-top:26px;}
  button.opt{font:inherit; font-size:17px; color:var(--ink); background:var(--panel);
    border:1px solid var(--border); border-radius:14px; padding:15px 18px; cursor:pointer;
    text-align:start; line-height:1.5; transition:background .35s ease, transform .35s cubic-bezier(.16,1,.3,1);}
  button.opt:hover{background:rgba(244,214,168,0.13);}
  button.opt:active{transform:scale(.985);}
  button.opt b{color:var(--label); font-weight:600;}
  button.primary{background:rgba(230,168,101,0.16); border-color:rgba(230,168,101,0.4); text-align:center;}
  .dots{display:flex; gap:7px; justify-content:center; margin-top:22px;}
  .dot{width:6px; height:6px; border-radius:99px; background:var(--faint);}
  .dot.on{background:var(--label);}
  .reset{margin-top:32px; background:none; border:none; color:var(--faint); font:inherit; font-size:13px; cursor:pointer;}
  .glow{position:fixed; inset:0; pointer-events:none; background:radial-gradient(40% 26% at 50% 30%, rgba(230,168,101,.14), transparent 70%);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:8px;}
  @keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .inner{animation:none} button.opt{transition:none} }
</style>
<div class="glow"></div>
<main id="app"></main>

al_few","when":{"belonging":">0.2","energy":"<0"},"lines":["יש לך מעט אנשים, אבל עמוקים.","אתה לא מפזר חום —","אתה שומר אותו למי שבאמת קרוב."]},{"key":"warm_open","when":{"energy":">0.2"},"lines":["חום זורם ממך בקלות כלפי אנשים.","אתה נוגע בהם עוד לפני שאמרת מילה —","ומילה אחת תעשה את זה שלם."]},{"key":"default","when":{},"lines":["יש בך חיבה שקטה כלפי האנשים סביבך.","לא תמיד אתה אומר אותה בקול —","אבל אתה מרגיש אותה, וזה כבר הרבה."]}],"challengeHeader":"אין נכון ואין לא-נכון. יש רק לנסות.","challenges":[{"level":"easy","label":"רך","text":"שלח למישהו הודעה קטנה: 'חשבתי עליך'.","sub":"שתי מילים מספיקות."},{"level":"medium","label":"אמצע","text":"תגיד למישהו בדיוק למה הוא חשוב לך.","sub":"דבר אחד אמיתי, בלי לייפות."},{"level":"brave","label":"אמיץ","text":"התקשר למישהו שהתרחקת ממנו, ותגיד שהתגעגעת.","sub":"לא משנה איך הוא יגיב. מה שחשוב זה שאמרת."}],"onTry":["אמרת. זה כל העניין — לא איך זה התקבל, אלא שהוצאת את זה החוצה.","משהו שהרגשת בשקט הפך למילים. מישהו שמע שהוא חשוב לך."],"onNot":["לא הפעם — וזה בסדר גמור. המילה נשארת שלך, למתי שתרצה.","עצם זה שחשבת את מי לספר — זה כבר קרבה קטנה."],"tomorrow":["מחר יחכה לך רגע אחר. אולי בכלל לא על מילים.","משהו קטן נפתח היום. נראה מחר לאן.","נתראה מחר. מישהו כבר יודע שחשבת עליו."]},"rest":{"title":"רשות לעצור","recognitions":[{"key":"always_on","when":{"initiation":">0.2","energy":"<0"},"lines":["נראה שאתה תמיד באמצע משהו.","המנוחה מרגישה כמו עוד משימה —","אבל היא בעצם בית."]},{"key":"carries_others","when":{"belonging":">0.2","risk":"<0"},"lines":["אתה נושא הרבה על עצמך בשביל אחרים.","לעצור לרגע זה לא לנטוש אותם —","זה מה שמאפשר לך להישאר."]},{"key":"guilty_stopper","when":{"risk":"<-0.2"},"lines":["קשה לך לעצור בלי להתנצל.","כאילו מנוחה צריכה אישור —","אבל היא כבר שלך."]},{"key":"quiet_full","when":{"energy":">0.2"},"lines":["יש בך מקום שיודע לשקוט.","שקט לא מפחיד אותך —","הוא ממלא אותך מחדש."]},{"key":"default","when":{},"lines":["יש בך קול קטן שמבקש לעצור.","לא תמיד אתה מקשיב לו —","אבל היום אולי תיתן לו רשות."]}],"challengeH כבד את זה. עצם ההצעה היא החסד."}],"onTry":["נתת. זה כל העניין — לא איך זה התקבל, אלא שהושטת יד.","עשית חסד קטן שקל לחלוף לידו — ואתה עצרת."],"onNot":["לא הפעם — וזה בסדר גמור. הרוך נשאר בך, לפעם אחרת.","לפעמים עצם זה ששמת לב מי צריך הוא כבר חסד קטן."],"tomorrow":["מחר יבוא רגע חדש — אולי דווקא לקבל, לא רק לתת.","הרוך שנתת היום לא נעלם. מחר עוד קצת.","נתראה מחר."]},"presence":{"title":"כאן, עכשיו","recognitions":[{"key":"racing","when":{"energy":">0.2","risk":">0.1"},"lines":["נראה שהמחשבות שלך רצות קדימה מהר.","לא חסר לך מה למלא בו את הראש —","חסר לך רגע לשבת בתוך אחד."]},{"key":"elsewhere","when":{"initiation":"<-0.2","energy":"<0"},"lines":["חלק ממך נמצא לרוב במקום אחר.","לא כי כאן לא מספיק —","פשוט קל להיסחף פנימה."]},{"key":"attuned","when":{"belonging":">0.2","energy":"<0"},"lines":["אתה קולט דברים קטנים שאחרים מפספסים.","אור על שולחן, שקט בין מילים —","יש בך קשב שקט."]},{"key":"savoring","when":{"energy":">0.2"},"lines":["יש בך יכולת ליהנות מרגע פשוט.","כוס קפה, שמש על הפנים —","אתה יודע להיות שם, כשאתה נותן לעצמך."]},{"key":"default","when":{},"lines":["רוב החיים קורים בזמן שאנחנו במקום אחר בראש.","אתה לא צריך לתפוס הכול —","רק רגע אחד, במלואו, מספיק."]}],"challengeHeader":"אין נכון ואין לא-נכון. יש רק לנסות.","challenges":[{"level":"easy","label":"רך","text":"שים לב לשלושה דברים סביבך עכשיו, לאט.","sub":"צבע, צליל, מגע — כל אחד לרגע."},{"level":"medium","label":"אמצע","text":"עשה דבר יומיומי אחד — לאכול, ללכת — בלי הטלפון, עם כל הקשב.","sub":"רק אתה והדבר עצמו, לכמה רגעים."},{"level":"brave","label":"אמיץ","text":"תן למישהו את הנוכחות המלאה שלך לאורך שיחה אחת שלמה.","sub":"בלי מסך, בלי חצי אוזן. רק להיות שם באמת."}],"onTry":["היית כאן לרגע. זה כל העניין — לא כמה זמן, אלא שחזרת.","עצרת בתוך יום שלם שרץ — רק לרגע, וזה נספר."],"onNot":["לא הפעם — וזה בסדר גמור. הרגע ימשיך לחכות לך.","גם עצם זה שחשבת לעצור הוא כבר חצי חזרה הביתה."],"tomorrow":["מחר יש עוד רגע אחד להיות בו באמת.","חזרת הביתה לרגע היום. מחר נתאמן עוד קצת.","נתראה מחר, כאן."]},"curiosity":{"title":"ללכת אחרי","recognitions":[{"key":"quiet_noticer","when":{"initiation":"<-0.2","energy":"<0"},"lines":["אתה שם לב לפרטים שאחרים חולפים לידם.","עוד לפני שאתה הולך אחריהם.","זו לא פסיביות — זו סקרנות שקטה."]},{"key":"follower_of_threads","when":{"initiation":">0.2","risk":">0.1"},"lines":["כשמשהו מסקרן אותך, אתה הולך אחריו.","לא כל אחד מרשה לעצמו את זה —","אבל אתה כן."]},{"key":"deep_diver","when":{"belonging":">0.2","energy":"<0"},"lines":["אתה לא רודף אחרי הרבה דברים.","אתה נכנס לעומק של דבר אחד.","זו לא צרות אופק — זו נאמנות לפליאה."]},{"key":"wide_open","when":{"energy":">0.2"},"lines":["יש בך משהו שנדלק מול הלא-נודע.","שאלה פתוחה לא מלחיצה אותך —","היא קצת מדליקה אותך."]},{"key":"default","when":{},"lines":["יש בך פליאה קטנה שלא כבתה.","לא תמיד אתה הולך אחריה —","אבל אתה כמעט תמיד מרגיש אותה."]}],"challengeHeader":"אין נכון ואין לא-נכון. יש רק ללכת אחרי.","challenges":[{"level":"easy","label":"רך","text":"שאל שאלה אחת אמיתית על משהו שחלפת לידו היום.","sub":"לא צריך תשובה. השאלה מספיקה."},{"level":"medium","label":"אמצע","text":"לך אחרי סקרנות קטנה במשך רבע שעה — רחוב, נושא, סיפור של מישהו.","sub":"בלי יעד. רק ללכת אחרי החוט."},{"level":"brave","label":"אמיץ","text":"שאל מישהו שאלה שאתה באמת סקרן לגביה, אבל בדרך כלל עוצר.","sub":"לא משנה מה יענו. מה שחשוב זה ששאלת."}],"onTry":["הלכת אחרי משהו קטן. זה כל העניין — לא מה מצאת, אלא שהלכת.","נתת לפליאה אחת מקום, במקום להשתיק אותה כרגיל."],"onNot":["לא הפעם — וזה בסדר גמור. הפליאה נשארת שלך.","לפעמים עצם זה ששמת לב שמשהו סקרן אותך הוא כבר תזוזה קטנה."],"tomorrow":["מחר מחכה עוד חוט קטן ללכת אחריו.","משהו סיקרן אותך היום. מחר יבוא עוד.","נתראה מחר, עם עוד שאלה."]}},"discovery":{"note":"Discovery is the first emotional conversation, not a quiz. MOOD speaks first and shows how it sees the world; the user answers by choosing the wordless image that feels more like them. Each choice writes soft signals.","opening":"בוא נכיר. בלי שאלות. רק תבחר מה מרגיש לך.","steps":[{"axis":"belonging","prompt":"מה מרגיש לך יותר?","left":{"id":"outside","scene":"window","label":"מבחוץ, מסתכל פנימה","signals":{"belonging":-0.4}},"right":{"id":"inside","scene":"room","label":"מבפנים, בתוך חדר חמים","signals":{"belonging":0.5}}},{"axis":"initiation","prompt":"ואיזה יד יותר את/ה?","left":{"id":"reach","scene":"reach","label":"היד שמושטת ראשונה","signals":{"initiation":0.6,"risk":0.2}},"right":{"id":"wait","scene":"wait","label":"היד שמחכה, פתוחה","signals":{"initiation":-0.5}}},{"axis":"energy","prompt":"ואיפה אתה נושם יותר טוב?","left":{"id":"crowd","scene":"street","label":"רחוב שוקק אנשים","signals":{"energy":0.6}},"right":{"id":"quiet","scene":"bench","label":"אדם אחד על ספסל","signals":{"energy":-0.6}}},{"axis":"risk","prompt":"ואיזו דלת דומה לך?","left":{"id":"half","scene":"door-half","label":"דלת שפתוחה בחצי","signals":{"risk":-0.4}},"right":{"id":"wide","scene":"door-wide","label":"דלת פתוחה לרווחה","signals":{"risk":0.6}}}],"closing":"רגע אחד…"},"becomingStatements":{"note":"Triangulation: the portrait grows by combining dimensions engaged over days, not by repeating one. First matching rule wins; 'default' must exist. Never a score, never a verdict — a tentative, warm noticing.","rules":[{"when_dimensions":["courage","kindness"],"line":"אתה הופך למישהו שמעז להתקרב — ובעדינות."},{"when_dimensions":["courage","connection"],"line":"אתה לומד לא רק לנסות, אלא גם להגיד את מה שחשוב."},{"when_dimensions":["rest","boundaries"],"line":"אתה מתחיל לדעת מתי לעצור — ומתי להגיד 'לא'."},{"when_dimensions":["curiosity","creativity"],"line":"יש בך משהו שמפסיק לצרוך ומתחיל ליצור."},{"when_dimensions":["presence","connection"],"line":"אתה נעשה נוכח יותר — עם עצמך, ועם אנשים."},{"when_dimensions":["courage"],"line":"אתה מתחיל להיות מישהו שעושה את הצעד הראשון."},{"when_dimensions":["kindness"],"line":"יש בך חום שיוצא החוצה, לא רק נשאר בפנים."},{"when_dimensions":["rest"],"line":"אתה לומד שמנוחה זה לא ויתור — זה בחירה."},{"when_dimensions":["boundaries"],"line":"אתה מתחיל לשמור על ה'כן' שלך בעזרת 'לא'."},{"when_dimensions":["presence"],"line":"אתה נוכח יותר ברגעים הקטנים שהיית מפספס."},{"when_dimensions":["curiosity"],"line":"אתה הולך יותר אחרי הסקרנות הקטנה שלך."},{"when_dimensions":["creativity"],"line":"אתה מתחיל לעשות דברים, לא רק לחשוב עליהם."},{"when_dimensions":["connection"],"line":"אתה אומר יותר ממה שהיית אומר פעם."},{"when_dimensions":[],"line":"משהו קטן בך מתחיל לזוז. עוד מוקדם לדעת בדיוק לאן — וזה בסדר."}],"early_state":"עוד לא אספנו מספיק כדי לשקף — וזה בסדר גמור. נמשיך מחר."},"becomingPortrait":{"note":"The portrait assembly logic — how accumulated Moments become 'who you're becoming'. Wraps the triangulation lines in becoming_statements.json with presentation copy. Never a score, never final. A tentative, warm, evolving reflection. This is the product's spine.","intro":"אספנו כמה רגעים קטנים שלך. ככה אתה מתחיל להיראות מבפנים.","growth_framing":{"note":"Chosen by how many DISTINCT dimensions the user has engaged (triangulation), not by count of days.","rules":[{"when_distinct_dimensions":1,"line":"עוד מוקדם — יש רגע אחד, לא תמונה. אבל גם רגע אחד אומר משהו."},{"when_distinct_dimensions":2,"line":"מתחילים להצטייר שני קווים בך. עוד לא דיוקן — אבל כבר לא מקרי."},{"when_distinct_dimensions":3,"line":"זה כבר לא רגעים בודדים. שלושה כיוונים שונים מצביעים על אותו אדם — אתה."},{"when_distinct_dimensions":"4+","line":"מתוך דברים שונים לגמרי מצטייר אתה. זה מי שאתה נעשה, לאט, באמת."}]},"assembly_rule":"Show growth_framing (by distinct dimensions) + the matching line from becoming_statements.json (by which dimensions were engaged). If too little data, show early_state from becoming_statements.json.","the_question":{"note":"Asked at a milestone (e.g. day 6). The single most important measurement — portrait truth.","prompt":"זה מי שאתה נעשה?","yes":"כן, זה אני","no":"עוד לא בדיוק","on_yes":["טוב לשמוע. נמשיך לגלות יחד.","אז נמשיך משם. יש עוד בך."],"on_no":["גם זה בסדר גמור. אולי אנחנו רואים רק חלק — או שזה עוד בדרך.","תודה שאמרת. נלמד אותך יותר טוב מחר."]},"retrospective":{"note":"Periodic gentle look back — the reward is seeing your own change, never a metric.","lines":["לפני שבוע התחלת כאן. תראה כמה כבר זז.","הרגע הראשון שלך ואיפה אתה עכשיו — זה לא אותו אדם בדיוק.","שום דבר לא הלך לאיבוד. כל רגע קטן עוד כאן, ומרכיב אותך."]},"tone":"tentative always ('נראה', 'מתחיל', 'אולי'); never 'you are X'; never a level or number; the user watches themselves become, they are never graded."},"system":{"note":"All app-chrome Hebrew copy, so the entire interface speaks from data. No streaks, no scores, no guilt, no diagnosis. Warm, short, human. Engineering reads these directly.","onboarding":{"welcome":"פעם ביום. רגע אחד. שלך.","sub":"בלי שאלות, בלי מבחנים. רק רגע קטן שמסתכל עליך בעדינות.","begin":"להתחיל","no_account_note":"לא צריך חשבון. הכול נשאר אצלך."},"daily":{"greeting_morning":"יש לך רגע היום.","greeting_returning":"טוב שחזרת.","open_moment":"פתח את הרגע של היום"},"evening_checkin":{"prompt":"איך היה?","did_you_try":{"yes":"ניסיתי","no":"לא הפעם"},"how_felt":"איך הרגשת?","save":"שמור את הרגע","one_line":"משהו אחד שקרה? (לא חובה)"},"not_this_time":["גם זה בסדר גמור. הרגע נשאר שלך.","לא הפעם — ומחר יש רגע חדש. בלי חשבון."],"reminder":{"note":"At most one gentle local reminder per day, easily off. Never guilt, never a streak warning.","text":"הרגע שלך מחכה בערב.","settings_label":"תזכורת יומית עדינה","off_note":"אפשר לכבות בכל רגע. MOOD לא ינדנד."},"empty_states":{"library_empty":"עוד אין כאן רגעים. הראשון יגיע היום.","patterns_early":"עוד לא אספנו מספיק כדי לשקף — וזה בסדר גמור.","no_connection":"אין חיבור כרגע — וזה בסדר. הכול עובד גם ככה, אצלך."},"celebration":{"note":"Arrival, never confetti or points. A quiet acknowledgment.","first_moment":"זה הרגע הראשון בספרייה שלך. מחר יצטרף עוד אחד.","returned_after_gap":"חזרת. הרגעים שלך חיכו לך, בדיוק איפה שהשארת אותם."},"settings":{"title":"MOOD שלך","footer":"אתה מחליט הכול.","appearance":"מראה","language":"שפה","privacy":"פרטיות","accessibility":"נגישות"},"privacy":{"headline":"מה שקורה כאן נשאר אצלך.","body":"הרגעים, המילים והקול שלך נשמרים אצלך קודם כול. אתה בעל הבית. אפשר למחוק הכול, מתי שתרצה.","delete_all":"מחק הכול"},"errors":{"generic":"משהו קטן השתבש. ננסה שוב בעדינות.","retry":"לנסות שוב"}}};
const KEY="mood_becoming_artifact_v1", TOTAL=6;
const app=document.getElementById("app");
let save=load(), phase=null, step=0, chosen=emptyMap(), tried=null, answer=null;

function load(){ try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return {day:1,map:null,attempts:[]}; }
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){} }
function emptyMap(){ return {belonging:{value:0},initiation:{value:0},energy:{value:0},risk:{value:0}}; }
function applyChoice(map,sig){ const n=JSON.parse(JSON.stringify(map)); for(const k in sig){ n[k].value=Math.max(-1,Math.min(1,n[k].value+sig[k])); } return n; }
function evalWhen(when,map){ for(const ax in when){ const m=/^(<=|>=|<|>)\s*(-?\d*\.?\d+)$/.exec(String(when[ax]).trim()); if(!m) return false; const op=m[1], n=parseFloat(m[2]), v=(map[ax]||{}).value; if(v===undefined) return false; if(op==="<"&&!(v<n))return false; if(op===">"&&!(v>n))return false; if(op==="<="&&!(v<=n))return false; if(op===">="&&!(v>=n))return false; } return true; }
function pickRec(recs,map){ for(const r of recs){ if(Object.keys(r.when||{}).length&&evalWhen(r.when,map)) return r; } return recs.find(r=>!Object.keys(r.when||{}).length)||recs[recs.length-1]; }
function assemble(rules,engaged){ for(const r of rules){ if(r.when_dimensions.length&&r.when_dimensions.every(d=>engaged.has(d))) return r.line; } const f=rules.find(r=>!r.when_dimensions.length); return f?f.line:""; }
function framing(portrait,dist){ const rules=(portrait.growth_framing||{}).rules||[]; const e=rules.find(r=>r.when_distinct_dimensions===dist); if(e) return e.line; const p=rules.find(r=>String(r.when_distinct_dimensions).endsWith("+")); return p?p.line:""; }

function dim(){ return BUNDLE.order[(save.day-1)%BUNDLE.order.length]; }
function moment(){ return BUNDLE.moments[dim()]; }
function map(){ return save.map||chosen; }
function engaged(){ return new Set(save.attempts.map(a=>a.dimension)); }

function el(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.innerHTML=txt; return e; }
function render(inner){ app.innerHTML=""; const w=el("div","inner"); inner.forEach(n=>w.appendChild(n)); app.appendChild(w); }
function btn(txt,cls,fn){ const b=el("button",("opt "+(cls||"")).trim(),txt); b.onclick=fn; return b; }
function stack(nodes){ const s=el("div","stack"); nodes.forEach(n=>s.appendChild(n)); return s; }
function resetBtn(){ const b=el("button","reset","התחל מחדש (התנסות)"); b.onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} save={day:1,map:null,attempts:[]}; chosen=emptyMap(); step=0; tried=null; answer=null; go(save.map?"open":"discovery"); }; return b; }

function go(p){ phase=p; draw(); }
function draw(){
  const M=moment(), S=BUNDLE.system;
  if(phase==="discovery"){
    const s=BUNDLE.discovery.steps[step];
    const opts=[s.left,s.right].map(o=>btn(o.label,"",()=>{ chosen=applyChoice(map(),o.signals||{}); if(step<BUNDLE.discovery.steps.length-1){step++;draw();} else { save.map=chosen; persist(); go("open"); } }));
    const dots=el("div","dots"); BUNDLE.discovery.steps.forEach((_,i)=>{const d=el("span","dot"+(i<=step?" on":"")); dots.appendChild(d);});
    render([ el("div","eyebrow",S.onboarding.welcome), el("p","lead",step===0?BUNDLE.discovery.opening:s.prompt), stack(opts), dots ]);
  }
  else if(phase==="open"){
    render([ el("div","eyebrow","יום "+save.day+" · "+TOTAL), el("p","lead",save.day===1?S.daily.greeting_morning:S.daily.greeting_returning), stack([ btn(S.daily.open_moment,"primary",()=>go("recognition")) ]) ]);
  }
  else if(phase==="recognition"){
    const r=pickRec(M.recognitions,map());
    const lines=r.lines.map(l=>el("p","line",l));
    render([ el("div","eyebrow",M.title), ...lines, stack([ btn("יש לזה גם הזמנה קטנה","primary",()=>go("challenge")) ]) ]);
  }
  else if(phase==="challenge"){
    const opts=M.challenges.map(c=>btn("<b>"+c.label+":</b> "+c.text+"<div class='sub'>"+c.sub+"</div>","",()=>{ tried=null; go("capture"); }));
    render([ el("p","lead",M.challengeHeader), stack(opts) ]);
  }
  else if(phase==="capture"){
    if(tried===null){
      render([ el("p","lead","עכשיו החלק האמיתי — צא לחיות את זה. בערב, ספר לי: ניסית?"), stack([ btn("ניסיתי","",()=>{tried=true;draw();}), btn("לא הפעם","",()=>{tried=false;draw();}) ]) ]);
    } else {
      const line=tried?M.onTry[0]:M.onNot[0];
      render([ el("p","line",line), stack([ btn("שמור את הרגע","primary",()=>{ save.attempts.push({dimension:dim(),tried:!!tried}); persist(); go("becoming"); }) ]) ]);
    }
  }
  else if(phase==="becoming"){
    const eng=engaged(), dist=eng.size;
    const nodes=[ el("div","eyebrow","מי שאתה נעשה") ];
    if(dist<1){ nodes.push(el("p","line",BUNDLE.becomingStatements.early_state)); }
    else { nodes.push(el("p","line",framing(BUNDLE.becomingPortrait,dist))); nodes.push(el("p","strong",assemble(BUNDLE.becomingStatements.rules,eng))); }
    nodes.push(stack([ btn(save.day>=TOTAL?"רגע אחרון":"סיימנו להיום","primary",()=>go(save.day>=TOTAL?"question":"tomorrow")) ]));
    render(nodes);
  }
  else if(phase==="tomorrow"){
    render([ el("p","line",M.tomorrow[0]), stack([ btn("למחר →","primary",()=>{ save.day++; persist(); go("open"); }) ]), resetBtn() ]);
  }
  else if(phase==="question"){
    const q=BUNDLE.becomingPortrait.the_question, eng=engaged();
    if(!answer){
      render([ el("p","strong",assemble(BUNDLE.becomingStatements.rules,eng)), el("p","lead",q.prompt), stack([ btn(q.yes,"primary",()=>{answer="yes";draw();}), btn(q.no,"",()=>{answer="no";draw();}) ]) ]);
    } else {
      render([ el("p","line",answer==="yes"?q.on_yes[0]:q.on_no[0]), resetBtn() ]);
    }
  }
}
go(save.day===1&&!save.map?"discovery":"open");
</script></body></html>
