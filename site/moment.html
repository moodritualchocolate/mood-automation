<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="theme-color" content="#efe7d6"/>
<title>MOOD · רגע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe6d4; --ink:#39322a; --ink-soft:#665c4b; --faint:#9a8f78;
  --olive:#6d7a4c; --olive-d:#586440; --dusk:#8a7f93; --dusk-d:#6f6580; --line:#d9ccb2;
  --serif:'Frank Ruhl Libre',serif; --sans:'Heebo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0e0c08;color:var(--ink);font-family:var(--sans);font-weight:300;
  overflow:hidden;position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*9/16);
  background:var(--paper);overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.6)}

.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease}
.screen.on{opacity:1;visibility:visible}
.scene{position:absolute;inset:0;background-size:cover;background-position:center top;background-color:var(--paper)}
.scene.kb{animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.veil{position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(180deg,rgba(239,230,212,0),rgba(239,230,212,.86) 40%,var(--paper) 64%)}
.tap-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;text-align:center;
  font-size:12px;color:var(--faint);letter-spacing:.1em;z-index:4;animation:blink 2.6s ease-in-out infinite;pointer-events:none}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.7}}

.top{position:absolute;top:0;left:0;right:0;height:8%;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:5}
.bk{background:none;border:none;color:var(--ink-soft);width:30px;height:30px;cursor:pointer;opacity:.55}
.bk svg{width:22px;height:22px}
.pips{display:flex;gap:5px}
.pip{width:6px;height:6px;border-radius:50%;background:rgba(90,72,40,.22)}
.pip.on{background:var(--olive)}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--olive-d);font-weight:400}

.panel{position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:0 28px max(30px,calc(env(safe-area-inset-bottom) + 22px));
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px}
.kick{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive-d);font-weight:500}
.beat{font-family:var(--serif);font-weight:500;line-height:1.42;color:var(--ink);white-space:pre-line;text-wrap:balance;opacity:0}
.beat.b-sm{font-size:17px;color:var(--ink-soft);font-weight:400;font-family:var(--sans);line-height:1.6}
.beat.b-md{font-size:20px}
.beat.b-lg{font-size:24px}
.beat.show{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.acts{display:flex;flex-direction:column;gap:11px;width:100%;max-width:360px;margin-top:6px;opacity:0}
.acts.show{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.btn{min-height:56px;border:none;border-radius:30px;cursor:pointer;font-family:var(--sans);font-weight:500;font-size:16.5px;
  color:#fbf7ee;padding:8px 18px;line-height:1.3;box-shadow:0 8px 22px -10px rgba(70,55,30,.55);transition:transform .1s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.olive{background:var(--olive)} .btn.dusk{background:var(--dusk)}
.btn.line{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);box-shadow:none;font-weight:400}
.chips{display:flex;gap:10px;justify-content:center;width:100%;max-width:360px}
.chip{flex:1;min-height:52px;border:1.5px solid var(--line);border-radius:26px;background:rgba(255,255,255,.4);cursor:pointer;
  font-family:var(--sans);font-size:15.5px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.chip:active{transform:scale(.98)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.dot.g{background:var(--olive)} .dot.w{background:#cfc4ab;border:1px solid var(--faint)}

/* mission accent */
.mission-tag{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:22px;
  background:rgba(109,122,76,.14);border:1px solid rgba(109,122,76,.4);color:var(--olive-d);
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

/* exit-to-life breath */
.breathe{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:6;
  background:radial-gradient(circle at 50% 45%,rgba(239,230,212,.35),rgba(239,230,212,.92) 68%);opacity:0;visibility:hidden;transition:opacity 1.1s}
.breathe.on{opacity:1;visibility:visible}
.breathe .ring{width:130px;height:130px;border-radius:50%;border:1.5px solid var(--olive);
  animation:pulse 4s ease-in-out infinite;display:flex;align-items:center;justify-content:center;color:var(--olive-d);font-family:var(--serif);font-size:17px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.14);opacity:1}}
.breathe .sub{font-size:13.5px;color:var(--ink-soft);letter-spacing:.06em}

/* reward bloom */
.bloom{position:absolute;inset:0;pointer-events:none;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.12s!important}.beat,.acts{opacity:1!important}}
</style>
</head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="i-back"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M14 6l-6 6 6 6"/></g>
</defs></svg>

<script>
//===================== MOMENT DATA (voice + mission live here, not in engine) =====================
const MOMENT = {
  moment_id:"presence_phone_conversation_003",
  title:"אני עדיין מקשיב",
  dir:"assets/moments/presence_phone_conversation_003/screens",
  img:{recognition:"01_recognition.jpg",identification:"02_identification.jpg",opportunity:"03_opportunity.jpg",
    exit:"04_exit_to_life.jpg",return:"05_return.jpg",connected:"06a_chose_differently.jpg",not_yet:"06b_not_yet.jpg",
    witness_c:"08a_witness_chose_differently.jpg",witness_n:"08b_witness_not_yet.jpg",continuation:"10_continuation.jpg"},
  // each screen = a few beats revealed in rhythm (that is where the emotion lives)
  recognition:["ערב. קפה.","מישהו שאתה אוהב יושב מולך, באמצע משפט.","הטלפון על השולחן נדלק —","״אני עדיין מקשיב,״ אתה אומר לעצמך.\nוהיד כבר זזה אליו."],
  identify_prompt:"רגע. זה אתה?",
  identify:["זה אני","לא ממש"],
  opportunity:["יש חלון קטן.","שנייה אחת, בין הרטט לבין היד שלך.","בשנייה הזו — הכול נמצא."],
  mission:{tag:"המשימה שלך",lines:["בשיחה הקרובה שלך היום,","תן לה להיגמר —","לפני שאתה נוגע בטלפון."],
    take:"אני לוקח את זה",skip:"לא היום"},
  exit:{lines:["עכשיו צא.","השיחה הבאה לא תקרה כאן, במסך."],hint:"היא תקרה שם, בחוץ.\nחזור כשזה יקרה — עוד שעה, מחר, לא משנה.",breath:"קח את הרגע",back:"זה קרה — חזרתי"},
  return_prompt:"כשהרגע חזר… מה עשית?",
  branch_c:"נשארתי בשיחה", branch_n:"עוד לא",
  witness_c:["השיחה קיבלה עוד כמה רגעים","להיות באמת שיחה.","והוא הרגיש את זה."],
  witness_n:["היד עלתה לפני ששמת לב.","וזה בסדר.","עכשיו אתה יודע איפה הרגע מסתתר —","ומחר תזהה אותו שנייה אחת מוקדם יותר."],
  reward_c:"עוד רגע שבו היית שם באמת.",
  reward_n:"עוד רגע שלמדת לזהות.",
  continuation:["מחר מחכה לך עוד רגע.","המסע ממשיך."]
};

//===================== ENGINE (generic; rhythm + mission + accrual) =====================
const stage=document.getElementById("stage");
const svg=id=>`<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
const buzz=(ms=12)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const src=k=>`${MOMENT.dir}/${MOMENT.img[k]}`;
const M=MOMENT;
let branch=null, hist=[];
const KEY="mood_moments_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{steps:0}}catch(e){return{steps:0}}};
const save=s=>localStorage.setItem(KEY,JSON.stringify(s));
const TOTAL=8;

function frame(imgKey,pip,{kb=true,tap=false}={}){
  const el=document.createElement("div");el.className="screen";
  el.innerHTML=`
    <div class="scene ${kb?'kb':''}" style="background-image:url('${src(imgKey)}')"></div>
    <div class="veil"></div>
    <div class="top">
      <button class="bk" onclick="back()">${svg("i-back")}</button>
      <div class="pips">${Array.from({length:TOTAL}).map((_,i)=>`<div class="pip ${i<=pip?'on':''}"></div>`).join("")}</div>
      <div class="eyebrow">נוכחות</div>
    </div>
    <div class="panel"></div>
    ${tap?`<div class="tap-hint">הקש להמשך</div>`:""}`;
  const old=stage.querySelector(".screen.on");
  stage.appendChild(el);
  requestAnimationFrame(()=>{el.classList.add("on");if(old){old.classList.remove("on");setTimeout(()=>old.remove(),560);}});
  return el;
}
// reveal beats one by one; resolve when done
function beats(panel, lines, cls="b-md", start=350, gap=1100){
  return new Promise(res=>{
    lines.forEach((t,i)=>{
      const d=document.createElement("div");d.className=`beat ${cls}`;d.textContent=t;panel.appendChild(d);
      setTimeout(()=>d.classList.add("show"), start+i*gap);
    });
    setTimeout(res, start+lines.length*gap);
  });
}
function actions(panel, html){
  const w=document.createElement("div");w.className="acts";w.innerHTML=html;panel.appendChild(w);
  requestAnimationFrame(()=>w.classList.add("show"));return w;
}
function go(fn){hist.push(fn);fn();}
function back(){buzz();if(hist.length>1){hist.pop();hist[hist.length-1]();}else location.href="index.html";}
function tapNext(el,fn){const h=()=>{el.removeEventListener("click",h);fn();};setTimeout(()=>el.addEventListener("click",h),300);}

// ---- steps ----
async function Recognition(){
  const el=frame("recognition",0,{tap:true});
  await beats(el.querySelector(".panel"), M.recognition, "b-lg", 500, 1300);
  tapNext(el, ()=>{buzz();go(Identification)});
}
function Identification(){
  const el=frame("identification",1);
  const p=el.querySelector(".panel");
  beats(p,[M.identify_prompt],"b-lg",300,700).then(()=>{
    actions(p,`<div class="chips">
      <button class="chip" data-b="me"><span class="dot g"></span>${M.identify[0]}</button>
      <button class="chip" data-b="no"><span class="dot w"></span>${M.identify[1]}</button></div>`);
    p.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{buzz();go(Opportunity)});
  });
}
async function Opportunity(){
  const el=frame("opportunity",2);const p=el.querySelector(".panel");
  await beats(p, M.opportunity, "b-md", 350, 1150);
  actions(p,`<button class="btn olive" id="n">יש לי את זה</button>`);
  p.querySelector("#n").onclick=()=>{buzz();go(Mission)};
}
async function Mission(){
  const el=frame("opportunity",3,{kb:false});const p=el.querySelector(".panel");
  const tag=document.createElement("div");tag.className="beat b-sm show";
  tag.innerHTML=`<span class="mission-tag">${M.mission.tag}</span>`;p.appendChild(tag);
  await beats(p, M.mission.lines, "b-lg", 500, 1050);
  actions(p,`<button class="btn olive" id="take">${M.mission.take}</button>
    <button class="btn line" id="skip">${M.mission.skip}</button>`);
  p.querySelector("#take").onclick=()=>{buzz(18);go(ExitToLife)};
  p.querySelector("#skip").onclick=()=>{buzz();location.href="index.html"};
}
async function ExitToLife(){
  const el=frame("exit",4);const p=el.querySelector(".panel");
  await beats(p, M.exit.lines, "b-md", 350, 1050);
  const h=document.createElement("div");h.className="beat b-sm";h.textContent=M.exit.hint;p.appendChild(h);
  requestAnimationFrame(()=>h.classList.add("show"));
  actions(p,`<button class="btn olive" id="did">${M.exit.back}</button>`);
  const br=document.createElement("div");br.className="breathe";
  br.innerHTML=`<div class="ring">${M.exit.breath}</div><div class="sub">קח את הזמן. אנחנו כאן כשתחזור.</div>`;el.appendChild(br);
  p.querySelector("#did").onclick=()=>{buzz(18);br.classList.add("on");setTimeout(()=>go(Return),1600)};
}
function Return(){
  const el=frame("return",5);const p=el.querySelector(".panel");
  beats(p,[M.return_prompt],"b-lg",300,700).then(()=>{
    actions(p,`<button class="btn olive" id="c"><span class="dot g" style="margin-inline-end:8px"></span>${M.branch_c}</button>
      <button class="btn dusk" id="ny"><span class="dot w" style="margin-inline-end:8px"></span>${M.branch_n}</button>`);
    p.querySelector("#c").onclick=()=>{buzz(16);branch="c";go(Witness)};
    p.querySelector("#ny").onclick=()=>{buzz(16);branch="n";go(Witness)};
  });
}
async function Witness(){
  const isC=branch==="c";
  const el=frame(isC?"witness_c":"witness_n",6);const p=el.querySelector(".panel");
  // accrue a real step
  const s=load();s.steps=(s.steps||0)+1;save(s);
  await beats(p, isC?M.witness_c:M.witness_n, "b-md", 400, 1150);
  if(isC) bloom(el);
  const rew=document.createElement("div");rew.className="beat b-sm";
  rew.innerHTML=`${isC?M.reward_c:M.reward_n}<br><span style="color:var(--olive-d);font-weight:500">${s.steps} רגעים נאספו</span>`;
  p.appendChild(rew);requestAnimationFrame(()=>rew.classList.add("show"));
  actions(p,`<button class="btn ${isC?'olive':'dusk'}" id="n">המשך</button>`);
  p.querySelector("#n").onclick=()=>{buzz();go(Continuation)};
}
async function Continuation(){
  const el=frame("continuation",7);const p=el.querySelector(".panel");
  await beats(p, M.continuation, "b-md", 400, 1050);
  actions(p,`<button class="btn olive" id="again">רגע חדש</button>
    <button class="btn line" id="home">חזרה למשחק</button>`);
  p.querySelector("#again").onclick=()=>{buzz();branch=null;hist=[];go(Recognition)};
  p.querySelector("#home").onclick=()=>{buzz();location.href="index.html"};
}
function bloom(el){
  const c=document.createElement("canvas");c.className="bloom";el.appendChild(c);
  const ctx=c.getContext("2d"),w=c.width=el.clientWidth,h=c.height=el.clientHeight;
  let ps=Array.from({length:46},()=>({x:w/2+(Math.random()-.5)*w*.5,y:h*.4+(Math.random()-.5)*90,
    vx:(Math.random()-.5)*1.4,vy:-Math.random()*1.6-.3,a:1,r:Math.random()*2.4+1}));
  let t=0;(function loop(){ctx.clearRect(0,0,w,h);t++;
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.a-=.009;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`rgba(150,160,90,${Math.max(0,p.a)})`;ctx.fill()});
    if(t<150)requestAnimationFrame(loop);else c.remove();})();
}

Object.values(MOMENT.img).forEach(f=>{const i=new Image();i.src=`${MOMENT.dir}/${f}`;});
go(Recognition);
</script>
</body>
</html>
