<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>mood ENERGY — הסקייל</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Heebo"; src:url("assets/fonts/heebo-latin.woff2") format("woff2"); font-weight:100 900; font-display:block; }
      @font-face { font-family:"Heebo"; src:url("assets/fonts/heebo-hebrew.woff2") format("woff2"); font-weight:100 900; font-display:block; unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; }
      body { font-family:"Heebo", sans-serif; }

      #root { position:relative; width:1080px; height:1920px; overflow:hidden; perspective:1400px; background:#EFE6D8; }

      #field { position:absolute; inset:0; width:1080px; height:1920px; display:block; }
      #vignette { position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(120% 90% at 50% 44%, rgba(0,0,0,0) 48%, rgba(60,30,10,0.15) 100%); }

      .clip { position:absolute; inset:0; direction:rtl; transform-style:preserve-3d; }
      .center { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 90px; }

      .line { font-weight:900; line-height:1.05; color:#1A1512; }
      .lg { font-size:120px; } .md { font-size:96px; }
      .accent { color:#E4551F; }
      .sub { font-weight:700; font-size:44px; color:#6B5E54; letter-spacing:2px; }

      /* ---------- balance scale ---------- */
      #scaleWrap { position:absolute; left:0; right:0; top:480px; height:560px; }
      .fulcrum { position:absolute; left:50%; top:134px; width:0; height:0; margin-left:-64px;
        border-left:64px solid transparent; border-right:64px solid transparent; border-bottom:210px solid #C9A24B; }
      .fulcrum-base { position:absolute; left:50%; top:336px; width:300px; height:24px; margin-left:-150px; border-radius:14px;
        background:linear-gradient(180deg,#D8B35C,#B98C34); box-shadow:0 20px 40px rgba(120,80,10,0.25); }
      .beam { position:absolute; left:50%; top:120px; width:660px; height:20px; margin-left:-330px; border-radius:12px;
        background:linear-gradient(180deg,#E7C46B,#C79A3B); box-shadow:0 8px 20px rgba(120,80,10,0.25); transform-style:preserve-3d; }
      .beam-cap { position:absolute; top:50%; width:26px; height:26px; margin-top:-13px; border-radius:50%; background:#B98C34; }
      .beam-cap.l { left:-13px; } .beam-cap.r { right:-13px; }
      .arm { position:absolute; top:14px; width:0; }
      .arm.l { left:0; } .arm.r { right:0; }
      .string { position:absolute; left:-2.5px; top:0; width:5px; height:150px; background:#C9A24B; }
      .pan { position:absolute; top:150px; left:-120px; width:240px; height:60px; border-radius:0 0 120px 120px;
        background:linear-gradient(180deg,#E7C46B,#BE9235); box-shadow:0 16px 30px rgba(120,80,10,0.28), inset 0 6px 10px rgba(255,240,200,0.5);
        transform-origin:50% 0; transform-style:preserve-3d; }

      /* espresso cup */
      .cup { position:absolute; left:50%; bottom:44px; margin-left:-52px; width:104px; height:78px; }
      .cup-body { position:absolute; inset:0; background:linear-gradient(180deg,#FBF7EF,#E9DFcc); border-radius:12px 12px 40px 40px; box-shadow:inset 0 -8px 14px rgba(0,0,0,0.12); }
      .cup-coffee { position:absolute; top:8px; left:10px; right:10px; height:26px; border-radius:50%; background:radial-gradient(circle at 40% 35%,#5A3A22,#2A1810); }
      .cup-handle { position:absolute; right:-26px; top:20px; width:34px; height:40px; border:9px solid #E9DFcc; border-radius:0 40px 40px 0; }

      /* chocolate square (small, on pan) */
      .choco { position:relative; width:150px; height:150px; border-radius:22px; overflow:hidden;
        background:linear-gradient(150deg,#6B4326,#4A2C18 48%,#3A2213);
        box-shadow:0 30px 50px rgba(40,20,8,0.4), inset 0 4px 8px rgba(255,220,180,0.28), inset 0 -10px 18px rgba(0,0,0,0.5); }
      .choco::before { content:""; position:absolute; inset:0; background:linear-gradient(115deg,rgba(255,235,200,0) 34%,rgba(255,235,200,0.32) 50%,rgba(255,235,200,0) 64%); }
      .gv,.gh { position:absolute; background:rgba(0,0,0,0.36); }
      .gv { top:8%; bottom:8%; width:3px; left:50%; margin-left:-1.5px; }
      .gh { left:8%; right:8%; height:3px; top:50%; margin-top:-1.5px; }
      .dot { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%;
        background:radial-gradient(circle at 38% 34%,#FF8A5C,#FF6B35 55%,#E4551F); box-shadow:inset 0 3px 5px rgba(255,200,160,0.6),inset 0 -4px 8px rgba(120,40,10,0.6); }
      .dot::after { content:""; position:absolute; left:50%; top:50%; width:15px; height:15px; margin:-7.5px 0 0 -7.5px; border-radius:50%; background:#EFE6D8; }
      .pan-choco { position:absolute; left:50%; bottom:40px; margin-left:-75px; }

      /* ---------- macro square (scene B) ---------- */
      #macro { position:absolute; left:50%; top:640px; margin-left:-260px; width:520px; height:520px; transform-style:preserve-3d; }
      .half { position:absolute; top:0; width:260px; height:520px; overflow:hidden;
        background:linear-gradient(150deg,#6B4326,#4A2C18 48%,#3A2213); box-shadow:0 50px 90px rgba(40,20,8,0.45), inset 0 6px 10px rgba(255,220,180,0.28); }
      .half.l { left:0; border-radius:44px 0 0 44px; }
      .half.r { right:0; border-radius:0 44px 44px 0; }
      #macro .dot { width:150px; height:150px; margin:-75px 0 0 -75px; z-index:3; }
      #macro .dot::after { width:40px; height:40px; margin:-20px 0 0 -20px; }
      #crack { position:absolute; left:50%; top:0; width:6px; height:520px; margin-left:-3px; z-index:2;
        background:linear-gradient(180deg,rgba(255,138,92,0),#FF8A5C,rgba(255,138,92,0)); }
      #glow { position:absolute; left:50%; top:50%; width:760px; height:760px; margin:-380px 0 0 -380px; border-radius:50%; z-index:0;
        background:radial-gradient(circle,rgba(255,140,70,0.5) 0%,rgba(255,120,50,0) 60%); }

      /* wordmark */
      .wordmark { display:inline-flex; align-items:center; font-weight:900; color:#1A1512; line-height:1; direction:ltr; }
      .oo { display:inline-block; border-radius:50%; background:#FF6B35; position:relative; }
      .oo::after { content:""; position:absolute; left:50%; top:50%; width:26%; height:26%; background:#EFE6D8; border-radius:50%; transform:translate(-50%,-50%); }
      .wm { font-size:104px; } .wm .oo { width:84px; height:84px; margin:0 5px; }
      .energy { font-weight:900; font-size:150px; letter-spacing:16px; color:#E4551F; direction:ltr; text-shadow:0 10px 30px rgba(228,85,31,0.28); }
      .ings { font-weight:800; font-size:46px; color:#3B322C; }
      .ing { display:inline-block; } .sep { color:#E4551F; margin:0 16px; display:inline-block; }
      .kick { font-weight:800; font-size:42px; letter-spacing:4px; color:#B24A20; }
      .cta { font-weight:800; font-size:48px; color:#FFF; letter-spacing:3px; background:#E4551F; padding:16px 44px; border-radius:100px; box-shadow:0 18px 44px rgba(228,85,31,0.4); }
      .stack { display:flex; flex-direction:column; align-items:center; }
      .stack > * + * { margin-top:22px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="18">

      <section id="bg" class="clip" data-start="0" data-duration="18" data-track-index="0">
        <canvas id="field" width="1080" height="1920"></canvas>
        <div id="vignette"></div>
      </section>

      <!-- Scene A: the balance scale (0–7) -->
      <section id="sA" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <div id="scaleWrap">
          <div class="fulcrum-base"></div>
          <div class="fulcrum"></div>
          <div class="beam" id="beam">
            <div class="beam-cap l"></div><div class="beam-cap r"></div>
            <div class="arm l">
              <div class="string"></div>
              <div class="pan" id="panL">
                <div class="cup"><div class="cup-handle"></div><div class="cup-body"></div><div class="cup-coffee"></div></div>
              </div>
            </div>
            <div class="arm r">
              <div class="string"></div>
              <div class="pan" id="panR">
                <div class="pan-choco" id="panChoco"><div class="choco"><span class="gv"></span><span class="gh"></span><span class="dot"></span></div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="center" id="sA-txt" style="justify-content:flex-end; padding-bottom:360px; position:absolute; inset:0">
          <div class="line md" id="sA-line1">25 מ״ג.</div>
          <div class="line lg" id="sA-line2" style="margin-top:6px">וזה כל <span class="accent">מה שצריך</span>.</div>
        </div>
      </section>

      <!-- Scene B: macro snap + ingredients (7–11) -->
      <section id="sB" class="clip" data-start="7" data-duration="4" data-track-index="2">
        <div id="macro">
          <div id="glow"></div>
          <div class="half l" id="halfL"></div>
          <div class="half r" id="halfR"></div>
          <div id="crack"></div>
          <span class="dot"></span>
        </div>
        <div class="center" style="justify-content:flex-end; padding-bottom:340px; position:absolute; inset:0">
          <div class="ings" id="sB-ings"><span class="ing">מאקה</span><span class="sep">·</span><span class="ing">גוארנה</span><span class="sep">·</span><span class="ing">גואיוסה</span></div>
        </div>
      </section>

      <!-- Scene C: steady float (11–15) -->
      <section id="sC" class="clip center" data-start="11" data-duration="4" data-track-index="3">
        <div class="stack">
          <div class="line lg" id="sC-1">בלי הרעד.</div>
          <div class="line lg accent" id="sC-2">בלי הנפילה.</div>
        </div>
      </section>

      <!-- Scene D: logo lockup (15–18) -->
      <section id="sD" class="clip center" data-start="15" data-duration="3" data-track-index="4">
        <div class="stack">
          <div class="kick" id="sD-k">בקרוב</div>
          <div class="wordmark wm" id="sD-logo"><span>m</span><span>o</span><span class="oo"></span><span>d</span></div>
          <div class="energy" id="sD-e" style="font-size:96px; letter-spacing:12px">ENERGY</div>
          <div class="cta" id="sD-cta" style="margin-top:10px">בלינק בביו</div>
        </div>
      </section>
    </div>

    <script>
      /* generative light field */
      const cv=document.getElementById("field"), ctx=cv.getContext("2d"), W=1080, H=1920;
      function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd=mb(20260812), N=110, P=[];
      for(let i=0;i<N;i++)P.push({x:rnd()*W,y:rnd()*H,r:4+rnd()*20,spd:8+rnd()*38,sway:20+rnd()*80,freq:0.15+rnd()*0.5,phase:rnd()*6.283,depth:0.35+rnd()*0.65,tw:0.5+rnd()*0.5});
      function field(t,e){
        const g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,`rgb(${245-8*e|0},${232-5*e|0},${216-7*e|0})`); g.addColorStop(0.5,"#EFE6D8");
        g.addColorStop(1,`rgb(${236-6*e|0},${216-12*e|0},${196-18*e|0})`);
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        const cx=W*0.5+Math.sin(t*0.12)*50, cy=H*0.44+Math.cos(t*0.1)*60, R=460+e*340+Math.sin(t*0.5)*24;
        const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
        rg.addColorStop(0,`rgba(255,140,70,${0.08+e*0.26})`); rg.addColorStop(0.55,`rgba(255,120,50,${0.02+e*0.08})`); rg.addColorStop(1,"rgba(255,120,50,0)");
        ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
        ctx.globalCompositeOperation="lighter";
        for(let i=0;i<N;i++){const p=P[i];let y=p.y-p.spd*(1+e*1.2)*t; y=((y%(H+240))+(H+240))%(H+240)-120;
          const x=p.x+Math.sin(t*p.freq+p.phase)*p.sway*p.depth;
          const tw=0.35+0.65*(0.5+0.5*Math.sin(t*1.6*p.tw+p.phase)), a=(0.05+0.2*p.depth)*tw*(0.6+e*0.8), rad=p.r*p.depth*(1+e*0.4);
          const bg=ctx.createRadialGradient(x,y,0,x,y,rad); bg.addColorStop(0,`rgba(255,${170-40*p.depth|0},90,${a})`); bg.addColorStop(1,"rgba(255,150,80,0)");
          ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,rad,0,6.2832); ctx.fill();}
        ctx.globalCompositeOperation="source-over";
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true });
      const OUT="power3.out";

      const fs={t:0};
      tl.to(fs,{t:18,duration:18,ease:"none",onUpdate:()=>{const t=fs.t;const e=Math.min(1,Math.max(0,(t-6.5)/4));field(t,e);}},0);
      field(0,0);
      tl.fromTo("#field",{scale:1.0,transformOrigin:"50% 44%"},{scale:1.1,duration:18,ease:"none"},0);

      /* ---- Scene A: scale ---- */
      // enter: whole scale drops in
      tl.fromTo("#scaleWrap",{y:-40,autoAlpha:0},{y:0,autoAlpha:1,duration:0.7,ease:OUT},0.1);
      // coffee is heavy first: LEFT (coffee) pan sinks → beam CCW (−rot); pans counter-rotate to stay level
      tl.fromTo("#beam",{rotation:0},{rotation:-8,duration:0.7,ease:"power2.inOut"},0.8);
      tl.fromTo(["#panL","#panR"],{rotation:0},{rotation:8,duration:0.7,ease:"power2.inOut"},0.8);
      // the square drops into right pan
      tl.fromTo("#panChoco",{y:-260,autoAlpha:0},{y:0,autoAlpha:1,duration:0.55,ease:"power4.in"},2.1);
      // INVERSION: the square outweighs the coffee → RIGHT (square) pan sinks → beam CW (+rot), with a settle
      tl.to("#beam",{rotation:12,duration:0.9,ease:"back.out(1.4)"},2.65);
      tl.to(["#panL","#panR"],{rotation:-12,duration:0.9,ease:"back.out(1.4)"},2.65);
      // text
      tl.fromTo("#sA-line1",{y:40,autoAlpha:0},{y:0,autoAlpha:1,duration:0.45,ease:OUT},4.2);
      tl.fromTo("#sA-line2",{y:50,autoAlpha:0},{y:0,autoAlpha:1,duration:0.5,ease:OUT},4.55);
      tl.to("#sA",{autoAlpha:0,duration:0.45,ease:"power2.in"},6.55);
      tl.set("#sA",{autoAlpha:0},7.0);

      /* ---- Scene B: macro snap ---- */
      tl.fromTo("#macro",{scale:0.7,autoAlpha:0},{scale:1,autoAlpha:1,duration:0.5,ease:"power4.out"},7.15);
      // snap: halves jolt apart, glow flashes, dot pops
      tl.fromTo("#halfL",{x:0},{x:-26,duration:0.18,ease:"power4.out"},7.7);
      tl.fromTo("#halfR",{x:0},{x:26,duration:0.18,ease:"power4.out"},7.7);
      tl.to("#halfL",{x:-14,duration:0.5,ease:"power2.out"},7.9);
      tl.to("#halfR",{x:14,duration:0.5,ease:"power2.out"},7.9);
      tl.fromTo("#crack",{autoAlpha:0,scaleY:0.6},{autoAlpha:1,scaleY:1,duration:0.25,ease:"power2.out"},7.7);
      tl.fromTo("#glow",{autoAlpha:0,scale:0.6},{autoAlpha:1,scale:1,duration:0.5,ease:"power2.out"},7.7);
      tl.fromTo("#macro .dot",{scale:0.2},{scale:1,duration:0.5,ease:"back.out(2.2)"},7.75);
      tl.fromTo("#sB-ings .ing",{y:28,autoAlpha:0},{y:0,autoAlpha:1,duration:0.4,ease:OUT,stagger:0.14},8.6);
      tl.fromTo("#sB-ings .sep",{autoAlpha:0},{autoAlpha:1,duration:0.3,stagger:0.14},8.75);
      tl.to("#sB",{autoAlpha:0,duration:0.45,ease:"power2.in"},10.55);
      tl.set("#sB",{autoAlpha:0},11.0);

      /* ---- Scene C: steady ---- */
      tl.fromTo("#sC-1",{y:50,autoAlpha:0},{y:0,autoAlpha:1,duration:0.5,ease:OUT},11.3);
      tl.fromTo("#sC-2",{y:50,autoAlpha:0},{y:0,autoAlpha:1,duration:0.5,ease:OUT},11.75);
      tl.to("#sC",{autoAlpha:0,duration:0.45,ease:"power2.in"},14.5);
      tl.set("#sC",{autoAlpha:0},15.0);

      /* ---- Scene D: logo ---- */
      tl.fromTo("#sD-k",{y:30,autoAlpha:0},{y:0,autoAlpha:1,duration:0.45,ease:OUT},15.25);
      tl.fromTo("#sD-logo",{scale:0.7,autoAlpha:0},{scale:1,autoAlpha:1,duration:0.6,ease:"power4.out"},15.55);
      tl.fromTo("#sD-logo .oo",{scale:0.2},{scale:1,duration:0.5,ease:"back.out(2.2)"},15.85);
      tl.fromTo("#sD-e",{y:26,autoAlpha:0},{y:0,autoAlpha:1,duration:0.45,ease:OUT},16.1);
      tl.fromTo("#sD-cta",{scale:0.7,autoAlpha:0},{scale:1,autoAlpha:1,duration:0.5,ease:"back.out(2)"},16.5);

      window.__timelines["main"]=tl;
    </script>
  </body>
</html>
