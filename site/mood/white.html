<section class="after">
  <h2>הרגע שלך — <em style="font-style:normal;color:var(--accent)">אחד-אחד</em>.</h2>
  <p>ריטואל שוקולד. שבעה גרם, טעם אמיתי, ונשימה אחת שהיא רק שלך.</p>
</section>

<script>
const RAY=`
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse; uniform float uCast;
uniform vec3 uAccent; uniform vec3 uBg1; uniform vec3 uBg2; uniform sampler2D uTex; uniform float uSnap; uniform vec2 uLight; uniform float uStand; uniform float uWhite; uniform float uPortrait; uniform float uMatch; uniform float uPush; uniform float uTransparent; uniform float uDissolve;
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float h21(vec2 p){return fract(sin(dot(p,vec2(41.31,289.13)))*43758.545);}
float vnz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float sdRoundBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
// liquid metaballs
float mapLiquid(vec3 p){
  float d=1e5; float amp=mix(1.0,0.15,uCast);
  for(int i=0;i<6;i++){ float f=float(i);
    vec3 c=vec3(sin(uTime*0.4+f*1.7)*0.62,cos(uTime*0.33+f*2.3)*0.46,sin(uTime*0.28+f*1.1)*0.52)*amp;
    d=smin(d,length(p-c)-0.55,0.45);
  }
  vec3 mc=vec3(uMouse*vec2(1.7,1.05),0.35)*mix(1.0,0.0,uCast);
  d=smin(d,length(p-mc)-0.42*mix(1.0,0.3,uCast),0.40);
  d+=0.03*(1.0-uCast)*sin(p.x*6.+uTime)*sin(p.y*5.5+uTime*1.2)*sin(p.z*6.);
  if(uCast>0.06 && uCast<0.8){
    for(int j=0;j<2;j++){ float fj=float(j);
      float ph=fract(uTime*0.45+fj*0.5);
      vec3 dc=vec3((fj-0.5)*0.55, 0.15-ph*1.35, 0.12);
      float dr=0.085*(1.0-ph*0.6)*smoothstep(0.06,0.22,uCast)*smoothstep(0.8,0.55,uCast);
      d=smin(d,length(p-dc)-max(dr,0.0),0.12);
    }
  }
  return d;
}
// embossed square
vec3 bDim=vec3(1.13,0.16,0.62);
float emboss(vec3 q){
  vec2 tuv; float inband=1.0;
  if(uPortrait>0.5){
    tuv=vec2(q.z/bDim.z, -q.x/bDim.x)*0.5+0.5;          // dedicated portrait relief fills the tall face
  } else {
    tuv=vec2(q.x/bDim.x,q.z/bDim.z)*0.5+0.5;
  }
  float h=texture2D(uTex,tuv).r - 0.5;                  // 0.5 = flat, signed relief
  return h*0.12*inband*mix(1.0,2.1,max(uPortrait,uMatch)); // deeper relief so the logo reads like the photo
}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float mapSquare(vec3 p){
  if(uMatch>0.5){ float yw=-0.62; float cy=cos(yw),sy=sin(yw); p.xz=mat2(cy,-sy,sy,cy)*p.xz; } // yaw so the lying bar runs diagonally like the photo
  vec3 q;
  if(uPortrait>0.5){
    q=vec3(p.y, p.z, p.x);                           // stand tall: long axis vertical, relief to camera
  } else {
    float ang=mix(0.13,-1.30,uStand);               // lying (top up) → standing (relief face to camera)
    float ca=cos(ang),sa=sin(ang);
    q=vec3(p.x, ca*p.y-sa*p.z, sa*p.y+ca*p.z);
  }
  float d=sdRoundBox(q,bDim,0.045);
  float top=smoothstep(bDim.y-0.07,bDim.y+0.01,q.y);
  d=d-emboss(q)*top;
  // ---- the BITE: two overlapping bowls scooped from a corner of the face ----
  float bite;
  if(uPortrait>0.5){                                 // one clean bite from the top-right corner
    bite=smin(length(q-vec3(1.06,0.12,0.44))-0.42,
              length(q-vec3(0.86,0.14,0.60))-0.24, 0.14);
  } else {
    float bz=mix(0.66,-0.62,uStand);                 // lying: front edge · standing: top edge
    bite=smin(length(q-vec3(-0.86, 0.14, bz))-0.44,
              length(q-vec3(-0.55, 0.16, bz-0.06))-0.30, 0.18);
  }
  d=smax(d, -bite, 0.06);                            // carve it out, softly
