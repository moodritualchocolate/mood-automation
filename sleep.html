:root{
  --ink:#171512; --paper:#fff; --paper-soft:#f7f5ef; --line:#e3dbd0; --muted:#5f5b55;
  --cta:#b8b0e6; --cta-dark:#5c4fa5;
  --mint:#d9f0d1; --forest:#254821;
  --yellow:#ffec5c; --blue:#c8e5f0;
  --c:#58719a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Assistant,Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.ann{background:#111;color:#fff;padding:9px 4vw;font-size:12.5px;font-weight:600;text-align:center}
.ann span{margin:0 8px}
.ann span+span:before{content:"|";margin-inline-end:12px;opacity:.6}
header{padding:14px 4vw;display:flex;align-items:center;justify-content:space-between;background:var(--paper);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;padding:8px 22px;border:1.5px solid var(--ink);border-radius:999px}
.brand img{height:24px}
nav{display:flex;gap:26px;font-size:14px;font-weight:600}
nav a:hover{opacity:.6}
.hactions{display:flex;gap:14px;align-items:center}
.hactions .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.hactions .ic:hover{background:var(--paper-soft)}
.hactions .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.hactions .bag{position:relative}
.hactions .bag b{position:absolute;top:-2px;left:-2px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:50%;display:grid;place-items:center;padding:0 5px}
@media(max-width:900px){nav{display:none}}
.pill{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;border-radius:999px;font-weight:700;font-size:14px;line-height:1;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s,color .18s;cursor:pointer;border:0;font-family:inherit;text-decoration:none}
.pill-mint{background:var(--mint);color:var(--forest)}
.pill-cta{background:var(--cta);color:#fff;font-weight:800;box-shadow:0 6px 18px -6px rgba(92,79,165,.45)}
.pill-cta:hover{transform:translateY(-2px);background:var(--cta-dark)}
.pill-out{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.pill-out:hover{background:var(--ink);color:#fff}
.pill-dark{background:var(--ink);color:#fff}

/* ================ PDP HERO — mayven signature ================ */
.pdp{max-width:1240px;margin:0 auto;padding:0}
@media(min-width:901px){.pdp{padding:26px 4vw 0;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,3vw,44px);align-items:start}}

/* image carousel: mobile = full-bleed */
.gal{position:relative;background:var(--paper-soft);overflow:hidden}
@media(max-width:900px){.gal{aspect-ratio:1;width:100vw;margin-inline:calc(50% - 50vw)}}
@media(min-width:901px){.gal{aspect-ratio:1;border-radius:24px;position:sticky;top:96px}}
.gal .slides{position:absolute;inset:0}
.gal .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.gal .slide.on{opacity:1}
.gal .tag{position:absolute;top:16px;inset-inline-start:16px;background:var(--mint);color:var(--forest);padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:800;z-index:5}
.gal .dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:5}
.gal .dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer;transition:background .2s,transform .2s}
.gal .dot.on{background:#fff;transform:scale(1.15)}
.gal .dot:hover{background:rgba(255,255,255,.8)}
.gal .arrows{position:absolute;top:50%;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;transform:translateY(-50%);z-index:4;pointer-events:none}
.gal .arrow{pointer-events:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);border:0;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s;opacity:0;transition:opacity .3s ease,background .2s}
.gal:hover .arrow{opacity:1}
.gal .arrow:hover{background:#fff}
.gal .arrow svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

/* BUY OVERLAY CARD (mobile) / BUY PANEL (desktop) */
.buy{background:var(--paper);position:relative;z-index:2;direction:rtl;text-align:right}
@media(max-width:900px){
  .buy{margin-top:-24px;border-radius:24px 24px 0 0;padding:22px 5vw 30px;position:relative;box-shadow:0 -6px 22px rgba(0,0,0,.06)}
  .buy::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:4px;background:var(--line);border-radius:2px}
}
@media(min-width:901px){.buy{padding:8px 0 40px}}

.buy-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 8px}
.buy-name{font-family:'DM Sans','Assistant',sans-serif;font-size:clamp(32px,4.6vw,52px);font-weight:700;color:var(--forest);letter-spacing:-2px;margin:0;line-height:1}
.buy-he{font-family:'DM Sans','Assistant',sans-serif;font-size:clamp(17px,1.8vw,22px);font-weight:500;color:var(--ink);margin:6px 0 0;letter-spacing:-.5px}
.buy-rate{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:13px;color:var(--muted)}
.buy-rate .stars{color:var(--forest);letter-spacing:2px;font-size:14px}
.buy-rate a{text-decoration:underline;text-underline-offset:3px;color:var(--muted)}

.pull{background:var(--mint);border-radius:14px;padding:16px 20px;margin:18px 0}
.pull q{font-size:15px;line-height:1.5;font-weight:600;color:var(--forest);display:block;quotes:"\201F" "\201E"}
.pull q:before{content:open-quote;margin-inline-end:2px}
.pull q:after{content:close-quote;margin-inline-start:2px}
.pull .who{margin-top:8px;font-size:12.5px;font-weight:800;color:var(--forest)}
.pull .who span{font-weight:500;opacity:.75}

.story{color:#4a4239;font-size:14.5px;line-height:1.72;margin:0 0 16px}
.sold{display:inline-block;background:var(--mint);color:var(--forest);padding:8px 15px;border-radius:999px;font-size:13px;font-weight:800;margin:0 0 20px}

.tiers{display:grid;gap:10px;margin:0 0 18px}
.tier{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.tier input{position:absolute;opacity:0;pointer-events:none}
.tier.active{border-color:var(--cta-dark);background:#fbfaff}
.tier-copy{display:flex;flex-direction:column;gap:2px}
.tier-h{display:flex;align-items:center;gap:8px}
.tier-h strong{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:800;color:var(--ink)}
.tier-tag{padding:3px 8px;border-radius:999px;font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:800;color:var(--ink);letter-spacing:.6px;text-transform:uppercase}
.tier-sub{font-size:12.5px;color:var(--muted)}
.tier-per{font-size:11px;color:var(--muted);opacity:.8;margin-top:2px}
.tier-price{text-align:end}
.tier-price b{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.tier-cta{display:none;grid-column:1/-1;margin-top:10px;width:100%}
.tier.active .tier-cta{display:inline-flex}

.bundle{background:#f7f5ef;border:1px dashed var(--forest);border-radius:14px;padding:12px;margin:0 0 18px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.bundle-media{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--paper)}
.bundle-media img{width:100%;height:100%;object-fit:cover}
.bundle-disc{display:inline-block;background:var(--mint);color:var(--forest);font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;margin-bottom:6px}
.bundle-body h4{font-family:'DM Sans','Assistant',sans-serif;font-size:15px;font-weight:800;margin:0 0 4px;color:var(--ink)}
.bundle-body p{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0 0 8px}
.bundle-body .pill{padding:7px 12px;font-size:12px;background:var(--paper);color:var(--cta-dark);border:1px solid var(--cta-dark);box-shadow:none}

.trust-chips{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.trust-chips .tchip{display:inline-flex;align-items:center;padding:5px 11px;border:1px solid var(--forest);color:var(--forest);border-radius:999px;font-size:11px;font-weight:600;background:transparent}

/* ================ SECTIONS ================ */
.section{padding:60px 4vw}
.section-head{max-width:820px;margin:0 auto 32px;text-align:center;direction:rtl}
.section-head .k{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:2.5px;color:var(--forest);text-transform:uppercase;margin:0 0 10px}
.section-head h2{font-family:'DM Sans','Assistant',sans-serif;font-size:clamp(30px,3.8vw,44px);line-height:1.02;letter-spacing:-1.5px;font-weight:500;margin:0 0 12px}
.section-head h2 b{font-weight:700}
.section-head p{color:var(--muted);font-size:16px;margin:0 auto;max-width:520px;line-height:1.6}

.formula{max-width:820px;margin:0 auto;direction:rtl}
.ing-list>div{display:grid;grid-template-columns:34px 1.1fr 1.5fr 60px;align-items:center;border-bottom:1px solid var(--line);padding:14px 6px;text-align:right}
.ing-list b{color:var(--forest);font-family:'DM Sans',sans-serif;font-size:12px;font-style:normal;font-weight:700}
.ing-list strong{font-size:15px;font-weight:800;color:var(--ink)}
.ing-list span{color:var(--muted);font-size:13.5px}
.ing-list em{color:var(--forest);font-family:'DM Sans',sans-serif;font-style:normal;font-size:14px;font-weight:800;text-align:end}

.rvs{padding:60px 4vw;background:var(--paper-soft)}
.rvs-in{max-width:640px;margin:0 auto;text-align:center;direction:rtl}
.rvs h2{font-family:'DM Sans','Assistant',sans-serif;font-size:30px;font-weight:600;letter-spacing:-1px;margin:0 0 24px}
.rvs-num{display:inline-flex;align-items:baseline;gap:14px;justify-content:center;margin:0 0 8px;direction:ltr}
.rvs-num b{font-family:'DM Sans',sans-serif;font-size:60px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:-2px}
.rvs-num .stars{color:var(--forest);font-size:20px;letter-spacing:3px}
.rvs-count{color:var(--muted);font-size:13px;margin:0 0 26px}
.rvs-bars{max-width:400px;margin:0 auto 28px;display:flex;flex-direction:column;gap:10px}
.rvs-row{display:grid;grid-template-columns:32px 1fr 44px;align-items:center;gap:12px;font-family:'DM Sans',sans-serif;font-size:12.5px;direction:rtl}
.rvs-row .b{color:var(--forest)}
.rvs-row .bar{height:7px;background:#e6e2db;border-radius:999px;overflow:hidden}
.rvs-row .bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.rvs-row .n{color:var(--muted);text-align:end}
.rvq-row{max-width:1000px;margin:30px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:rtl}
.rvq{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;text-align:right}
.rvq-stars{color:var(--forest);letter-spacing:2px;font-size:13px}
.rvq p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink);flex:1}
.rvq small{color:var(--muted);font-size:11.5px}
.rvq small b{font-weight:800;color:var(--ink)}

.xsell{padding:60px 4vw}
.xsell-in{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;direction:rtl}
.xs{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px;transition:transform .28s,box-shadow .28s;direction:rtl}
.xs:hover{transform:translateY(-3px);box-shadow:0 18px 40px -18px rgba(0,0,0,.15)}
.xs-media{aspect-ratio:1;background:#f7f5ef;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.xs-media img{width:100%;height:100%;object-fit:cover}
.xs-body{display:flex;flex-direction:column;justify-content:center;text-align:right}
.xs-moment{font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.xs-h{font-family:'DM Sans','Assistant',sans-serif;font-size:20px;font-weight:700;color:var(--forest);margin:0 0 4px;letter-spacing:-.5px;line-height:1}
.xs-h span{display:block;margin-top:2px;font-family:'Assistant',sans-serif;font-size:14px;font-weight:600;color:var(--ink)}
.xs .pill{align-self:flex-start;margin-top:8px;padding:7px 14px;font-size:12px}
@media(max-width:700px){.xsell-in{grid-template-columns:1fr}}

.faq{max-width:780px;margin:0 auto;padding:50px 4vw;direction:rtl}
.faq h2{text-align:center;font-family:'DM Sans','Assistant',sans-serif;font-size:28px;font-weight:600;letter-spacing:-1px;margin:0 0 26px}
.fq{border-bottom:1px solid var(--line)}
.fq summary{list-style:none;padding:18px 0;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:14px}
.fq summary::-webkit-details-marker{display:none}
.fq summary span{color:var(--forest);font-size:20px;font-weight:400;transition:transform .3s;line-height:1}
.fq[open] summary span{transform:rotate(45deg)}
.fq p{color:var(--muted);font-size:14px;line-height:1.7;padding:0 0 18px;margin:0}

footer{background:#111;color:#a09a90;padding:50px 4vw 26px}
.ft-in{max-width:1200px;margin:0 auto;direction:rtl}
.ft-in .brand{border-color:#fff;background:#111}
.ft-in .brand img{filter:brightness(0) invert(1)}
footer .ftl{margin:20px 0 0;font-size:13.5px;color:#a09a90}
footer .fsocial{display:flex;gap:12px;margin:18px 0 0}
footer .fsocial a{width:34px;height:34px;border:1px solid #333;border-radius:50%;display:grid;place-items:center;color:#a09a90}
footer .fsocial a:hover{color:var(--cta);border-color:var(--cta)}
footer .flinks{margin:24px 0;padding:18px 0;border-top:1px solid #222;border-bottom:1px solid #222;display:flex;flex-wrap:wrap;gap:20px;font-size:13px}
footer .flinks a:hover{color:#fff}
footer .fbase{font-size:12px}

.smb{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:none;gap:12px;align-items:center;box-shadow:0 -8px 22px rgba(0,0,0,.06)}
.smb-info{flex:1;text-align:right;direction:rtl}
.smb-info b{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink)}
.smb-info small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.smb a{padding:12px 22px}
@media(max-width:900px){.smb{display:flex}body{padding-bottom:70px}}
.fwapp{position:fixed;bottom:22px;left:22px;z-index:90;width:52px;height:52px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(37,211,102,.4);transition:transform .22s}
.fwapp:hover{transform:translateY(-3px) scale(1.05)}
.fwapp svg{width:26px;height:26px}
@media(max-width:900px){.fwapp{bottom:84px;left:16px;width:48px;height:48px}.fwapp svg{width:22px;height:22px}}
@media(max-width:900px){.rvq-row{grid-template-columns:1fr;max-width:520px;margin:30px auto 0}}


/* ============================================================
   v38 differentiation overrides — added after the Mayven-tokens
   so they win by cascade order. Rectangular shape system + warm
   chocolate/gold palette.
   ============================================================ */
:root {
  --cta: #2c1d16;       /* chocolate primary — was #b8b0e6 lilac */
  --cta-dark: #1a1109;  /* deeper chocolate hover                */
  --gold: #c69130;      /* warm brass accent                     */
  --gold-soft: #e8c880; /* softer gold for hover / medals        */
  --paper: #fdfaf3;     /* warmer than pure white                */
  --paper-soft: #f5eee4;/* cream instead of #f7f5ef              */
}
body { background: var(--paper); }

/* SHAPE — rectangles with soft corners (chocolate-square echo) */
.brand { border-radius: 8px !important; padding: 8px 18px !important; }
.pill  { border-radius: 10px !important; }
.pill-cta { box-shadow: 0 8px 20px -8px rgba(44,29,22,.4) !important; }
.tag,
.pc .tag,
.tier-tag,
.bundle-disc,
.sold,
.sold-pill,
.gal-tag,
.pull { border-radius: 6px !important; }
.pc, .rvq, .xs, .club { border-radius: 12px !important; }
.tier { border-radius: 10px !important; }
.trust-chips .tchip,
.tchip { border-radius: 4px !important; }

/* COLOR — pill CTAs use chocolate not lilac; stars & rating in gold */
.pill-cta {
  background: var(--cta) !important; color: #fdfaf3 !important;
}
.pill-cta:hover { background: var(--cta-dark) !important; }
.pill-out { border-color: var(--cta) !important; color: var(--cta) !important; }
.pill-out:hover { background: var(--cta) !important; color: #fdfaf3 !important; }
.pill-dark { background: var(--cta) !important; }
/* Active tier border chocolate */
.tier.active { border-color: var(--cta) !important; background: #f9f4ea !important; }
/* Stars → gold */
.rvs-num .stars, .buy-rate .stars, .rvq-stars, .pc-stars,
.stars, [class*="stars"] { color: var(--gold) !important; }
/* review bars in chocolate */
.rvs-row .bar i { background: var(--cta) !important; }
.rvs-row .b { color: var(--cta) !important; }
/* highlighted pull-quote — keep mint but border-radius reduced (above) */

/* announce bar keeps dark */
.ann { background: #171009 !important; }

/* hero — video overrides */
.hero {
  position: relative !important;
  min-height: min(88vh, 780px) !important;
  overflow: hidden !important;
  background: #1a1109 !important;
}
.hero-video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0; pointer-events: none;
}
.hero > img { display: none !important; }  /* replace the static hero img */
.hero .shade,
.hero::before {
  background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55)) !important;
  z-index: 1 !important;
}
.hero-copy, .heroText, .heroStats, .hero-in {
  position: relative !important; z-index: 2 !important;
}

/* v43 — Full Mayven-style footer with subtle 'mood' watermark */
.mfoot {
  position: relative;
  background: #0f0a05;
  color: #d9c9b3;
  padding: 80px 4vw 0;
  overflow: hidden;
  font-family: 'Assistant', sans-serif;
  direction: rtl;
}
.mfoot-mark {
  position: absolute;
  bottom: -60px; left: 50%;
  transform: translateX(-50%);
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: clamp(280px, 42vw, 640px);
  letter-spacing: -22px;
  color: rgba(247,236,216,.05);
  line-height: 1;
  pointer-events: none;
  user-select: none;
  z-index: 0;
  white-space: nowrap;
}
.mfoot-in {
  position: relative; z-index: 1;
  max-width: 1240px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 60px 40px;
  padding-bottom: 60px;
}
.mfoot-brand .brand { border-radius: 8px; padding: 8px 18px; }
.mfoot-tag {
  color: #a09a90;
  font-size: 14px;
  line-height: 1.6;
  margin: 20px 0 26px;
  max-width: 300px;
}
.mfoot-news-l {
  display: block;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 800; letter-spacing: 2.5px;
  color: #e8c880;
  text-transform: uppercase;
  margin: 0 0 12px;
}
.mfoot-news-row {
  display: flex; gap: 8px;
  background: rgba(247,236,216,.06);
  border: 1px solid rgba(247,236,216,.15);
  border-radius: 10px;
  padding: 4px;
  max-width: 320px;
  margin: 0 0 10px;
}
.mfoot-news-row input {
  flex: 1;
  background: transparent;
  border: 0;
  padding: 10px 12px;
  color: #fdfaf3;
  font: inherit; font-size: 14px;
  outline: none;
  direction: rtl;
}
.mfoot-news-row input::placeholder { color: #6b625a; }
.mfoot-news-row button {
  background: #f7ecd8;
  color: #1a1109;
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  font: inherit; font-weight: 800; font-size: 13.5px;
  cursor: pointer;
  transition: background .18s;
}
.mfoot-news-row button:hover { background: #fff; }
.mfoot-brand small { font-size: 12px; color: #6b625a; }

.mfoot-col h4 {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 2.4px;
  color: #e8c880;
  text-transform: uppercase;
  margin: 0 0 20px;
}
.mfoot-col ul { list-style: none; margin: 0 0 20px; padding: 0; }
.mfoot-col li { margin: 0 0 10px; }
.mfoot-col a {
  color: #d9c9b3;
  text-decoration: none;
  font-size: 14.5px;
  transition: color .18s;
}
.mfoot-col a:hover { color: #fdfaf3; text-decoration: underline; text-underline-offset: 4px; }

.mfoot-social {
  display: flex; gap: 10px; margin: 4px 0 0;
}
.mfoot-social a {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(247,236,216,.2);
  color: #d9c9b3;
  display: grid; place-items: center;
  transition: all .2s;
}
.mfoot-social a:hover {
  background: #f7ecd8;
  border-color: #f7ecd8;
  color: #1a1109;
  transform: translateY(-2px);
}

.mfoot-strip {
  position: relative; z-index: 1;
  border-top: 1px solid rgba(247,236,216,.1);
  padding: 24px 0;
}
.mfoot-strip-in {
  max-width: 1240px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 20px;
}
.mfoot-pay { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mfoot-pay .pay {
  width: 44px; height: 28px;
  border-radius: 4px;
  display: grid; place-items: center;
  font-family: Arial, sans-serif; font-weight: 900; font-size: 11px; letter-spacing: .5px;
  color: #fff; background: #1a1f71;
}
.mfoot-pay .pay-mc { background: #fff; position: relative; border: 1px solid #ddd; }
.mfoot-pay .pay-mc span:nth-child(1) { position: absolute; left: 8px; top: 5px; width: 18px; height: 18px; background: #eb001b; border-radius: 50%; }
.mfoot-pay .pay-mc span:nth-child(2) { position: absolute; right: 8px; top: 5px; width: 18px; height: 18px; background: #f79e1b; border-radius: 50%; mix-blend-mode: multiply; }
.mfoot-pay .pay-amex { background: #016fd0; font-size: 10px; }
.mfoot-pay .pay-apple { background: #000; font-weight: 600; font-size: 10px; }
.mfoot-pay .pay-bit { background: #00b4c5; font-weight: 900; }
.mfoot-pay .pay-gpay { background: #fff; border: 1px solid #ddd; color: #5f6368; font-weight: 600; font-size: 9px; }

.mfoot-legal {
  color: #6b625a;
  font-size: 12.5px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  letter-spacing: .02em;
}
.mfoot-legal a { color: #a09a90; text-decoration: none; transition: color .18s; }
.mfoot-legal a:hover { color: #fdfaf3; }

@media (max-width: 900px) {
  .mfoot-in { grid-template-columns: 1fr 1fr; gap: 40px 30px; }
  .mfoot-brand { grid-column: 1 / -1; }
  .mfoot-mark { font-size: clamp(160px, 60vw, 380px); letter-spacing: -12px; bottom: -30px; }
  .mfoot-strip-in { justify-content: center; text-align: center; }
}
@media (max-width: 520px) {
  .mfoot-in { grid-template-columns: 1fr; }
  .mfoot { padding: 60px 5vw 0; }
}

<script>
(function(){
  // gallery carousel — auto-rotate + manual dots/arrows
  var gal = document.getElementById('gal'); if (!gal) return;
  var slides = gal.querySelectorAll('.slide');
  var dots   = gal.querySelectorAll('.dot');
  var arrows = gal.querySelectorAll('.arrow');
  var idx = 0, timer = null;
  function go(n){
    idx = (n + slides.length) % slides.length;
    slides.forEach(function(s,i){ s.classList.toggle('on', i===idx); });
    dots.forEach(function(d,i){ d.classList.toggle('on', i===idx); });
  }
  function auto(){
    clearInterval(timer);
    timer = setInterval(function(){ go(idx+1); }, 4500);
  }
  dots.forEach(function(d){ d.addEventListener('click', function(){ go(+d.dataset.i); auto(); }); });
  arrows.forEach(function(a){ a.addEventListener('click', function(){ go(idx + parseInt(a.dataset.d,10)); auto(); }); });
  // pause auto on hover (desktop)
  gal.addEventListener('mouseenter', function(){ clearInterval(timer); });
  gal.addEventListener('mouseleave', auto);
  // swipe (mobile)
  var sx=0, ex=0;
  gal.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  gal.addEventListener('touchend', function(e){
    ex = e.changedTouches[0].clientX;
    var d = ex - sx;
    if (Math.abs(d) > 40) { go(idx + (d>0 ? 1 : -1)); auto(); }  // RTL: swipe right = prev
  }, {passive:true});
  auto();

  // tier picker
  var tiers = document.querySelectorAll('.tier');
  tiers.forEach(function(t){
    t.addEventListener('click', function(){
      tiers.forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
      var input = t.querySelector('input'); if (input) input.checked = true;
    });
  });
})();
</script>
