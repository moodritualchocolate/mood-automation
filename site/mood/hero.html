<script>
const FRAG=`
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse; uniform float uCast;
uniform vec3 uAccent; uniform vec3 uBg1; uniform vec3 uBg2; uniform sampler2D uTex; uniform float uSnap; uniform vec2 uLight; uniform float uStand; uniform float uWhite;
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float sdRoundBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
// liquid metaballs
float mapLiquid(vec3 p){
  float d=1e5; float amp=mix(1.0,0.15,uCast);
  for(int i=0;i<6;i++){ float f=float(i);
    vec3 c=vec3(sin(uTime*0.4+f*1.7)*0.62,cos(uTime*0.33+f*2.3)*0.46,sin(uTime*0.28+f*1.1)*0.52)*amp;
    d=smin(d,length(p-c)-0.55,0.45);
  }
  vec3 mc=vec3(uMouse*vec2(1.7,1.05),0.35)*mix(1.0,0.0,uCast);
  d=smin(d,length(p-mc)-0.42*mix(1.0,0.3,uCast),0.40);
  d+=0.03*(1.0-uCast)*sin(p.x*6.+uTime)*sin(p.y*5.5+uTime*1.2)*sin(p.z*6.);
  if(uCast>0.06 && uCast<0.8){
    for(int j=0;j<2;j++){ float fj=float(j);
      float ph=fract(uTime*0.45+fj*0.5);
      vec3 dc=vec3((fj-0.5)*0.55, 0.15-ph*1.35, 0.12);
      float dr=0.085*(1.0-ph*0.6)*smoothstep(0.06,0.22,uCast)*smoothstep(0.8,0.55,uCast);
      d=smin(d,length(p-dc)-max(dr,0.0),0.12);
    }
  }
  return d;
}
// embossed square
vec3 bDim=vec3(1.13,0.16,0.62);
float emboss(vec3 q){
  vec2 tuv=vec2(q.x/bDim.x,q.z/bDim.z)*0.5+0.5;
  float h=texture2D(uTex,vec2(tuv.x,tuv.y)).r - 0.5;   // 0.5 = flat, signed relief
  return h*0.12;
}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float mapSquare(vec3 p){
  float ang=mix(0.13,-1.30,uStand);                // lying (top up) → standing (relief face to camera)
  float ca=cos(ang),sa=sin(ang);
  vec3 q=vec3(p.x, ca*p.y-sa*p.z, sa*p.y+ca*p.z);
  float d=sdRoundBox(q,bDim,0.045);
  float top=smoothstep(bDim.y-0.07,bDim.y+0.01,q.y);
  d=d-emboss(q)*top;
  // ---- the BITE: two overlapping bowls scooped from a corner of the face ----
  float bz=mix(0.66,-0.62,uStand);                  // lying: front edge · standing: top edge
  float bite=smin(length(q-vec3(-0.86, 0.14, bz))-0.44,
                  length(q-vec3(-0.55, 0.16, bz-0.06))-0.30, 0.18);
  d=smax(d, -bite, 0.06);                            // carve it out, softly
  // ---- crumbs (only when lying — they rest on the surface in front of the bite) ----
  if(uStand<0.5){
    d=smin(d, length(q-vec3(-1.02, -0.10, 0.96))-0.085, 0.02);
    d=smin(d, length(q-vec3(-0.66, -0.12, 1.02))-0.060, 0.02);
    d=smin(d, length(q-vec3(-1.24, -0.11, 0.72))-0.052, 0.02);
  }
  return d;
}
mat2 r2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float map(vec3 p){
  p.xz=r2(sin(uTime*0.28)*mix(0.10,0.035,uCast))*p.xz;
  float cc=smoothstep(0.0,1.0,uCast);
  p.y -= (0.52+0.34*uStand)*(1.0-cc) + 0.05*(1.0-cc)*sin(uTime*0.7);   // molten floats high, then drips/descends into the mold
  p.y-=sin(uTime*0.5)*0.035*(0.4+0.6*cc);                // gentle bob, calmer once cast
  if(uCast<0.02) return mapLiquid(p); if(uCast>0.985) return mapSquare(p);
  return mix(mapLiquid(p),mapSquare(p),cc);
}
vec3 nrm(vec3 p){vec2 e=vec2(0.002,0.);return normalize(vec3(
  map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
vec3 sky(vec2 uv){
  vec2 sun=vec2(0.50+0.06*sin(uTime*0.06),0.60);
  float glow=smoothstep(0.85,0.0,length((uv-sun)*vec2(1.20,1.0)));
