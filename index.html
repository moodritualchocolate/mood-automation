<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a07">
<meta name="robots" content="noindex">
<title>MOOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0c0a07; --bg2:#14100b; --panel:#171209; --panel2:#1d160d;
 --gold:#c9a25e; --gold-2:#e6c489; --gold-dim:rgba(201,162,94,.35);
 --ink:#efe4d2; --muted:#a89a83; --faint:#6f6553;
 --line:rgba(201,162,94,.16);
 --serif:'Frank Ruhl Libre','Times New Roman',serif;
 --disp:'Cormorant Garamond',var(--serif);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--serif);color:var(--ink)}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;
 background:radial-gradient(130% 80% at 50% 0%,#1a140c 0%,var(--bg) 55%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 22px calc(96px + env(safe-area-inset-bottom));animation:fade .6s ease both}
.screen.center{justify-content:center;align-items:center;text-align:center}
.pt{padding-top:calc(22px + env(safe-area-inset-top))}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{font-family:var(--disp);letter-spacing:.28em;font-size:19px;color:var(--gold-2);font-weight:500;padding-inline-start:.28em}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px}
h1{font-weight:400;font-size:30px;line-height:1.3;margin:0;letter-spacing:.005em}
h2{font-weight:400;font-size:23px;line-height:1.35;margin:0}
.eyebrow{font-family:var(--disp);letter-spacing:.34em;font-size:12px;color:var(--gold);text-transform:uppercase;opacity:.85}
.lead{font-size:19px;line-height:1.6;color:var(--muted);font-weight:300}
.dim{color:var(--muted)} .sm{font-size:14px} .cap{font-size:12.5px;letter-spacing:.03em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--serif);font-size:17px;font-weight:400;
 padding:15px 30px;border-radius:40px;border:1px solid transparent;cursor:pointer;transition:.35s;color:#20160a;
 background:linear-gradient(180deg,var(--gold-2),var(--gold));box-shadow:0 6px 24px -8px rgba(201,162,94,.5)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--gold-dim);box-shadow:none}
.btn.block{width:100%}
.pill{display:block;width:100%;text-align:center;font-family:var(--serif);font-size:16.5px;color:var(--ink);
 background:var(--panel);border:1px solid var(--line);border-radius:36px;padding:15px;margin:9px 0;cursor:pointer;transition:.3s}
.pill.on{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#20160a;border-color:transparent}
.pill:active{transform:scale(.99)}
.card{position:relative;border-radius:20px;overflow:hidden;background:#0a0806;border:1px solid var(--line);
 box-shadow:0 20px 50px -20px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.02)}
.card canvas{display:block;width:100%;height:100%}
.card .sheen{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 30%,rgba(255,220,160,.10),transparent 60%);pointer-events:none}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe6b0;box-shadow:0 0 6px 2px rgba(255,210,140,.6);pointer-events:none;animation:twinkle 3.5s ease-in-out infinite}
.cardname{font-size:20px;text-align:center;margin-top:14px;letter-spacing:.02em}
.cardglyph{display:block;text-align:center;color:var(--gold);font-size:15px;margin-top:5px;opacity:.9}
.three{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin-top:8px}
.three .slot{flex:1;max-width:150px;transition:.4s;cursor:pointer}
.three .slot .card{aspect-ratio:.62}
.three .slot:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
.grid .card{aspect-ratio:.64}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:8px 16px;background:rgba(255,255,255,.02)}
.chip.on{color:#20160a;background:var(--gold);border-color:transparent}
.choice{display:flex;align-items:center;gap:16px;width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:10px 0;cursor:pointer;transition:.3s}
.choice:active{transform:scale(.99)}
.choice .thumb{width:58px;height:74px;border-radius:12px;overflow:hidden;flex:none;border:1px solid var(--line)}
.choice .big{font-size:18px} .choice .g{color:var(--gold);font-size:20px;margin-inline-start:auto}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;justify-content:space-around;
 padding:12px 8px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 60%,transparent);z-index:50}
.nav button{background:none;border:none;color:var(--faint);font-family:var(--serif);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:.3s}
.nav button .ic{font-size:19px}
.nav button.on{color:var(--gold-2)}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center}
.divider{height:1px;background:var(--line);margin:22px 0}
.menu-row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);font-size:16px}
.menu-row .g{margin-inline-start:auto;color:var(--faint)}
.tiny-input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;font-family:var(--serif);font-size:17px;text-align:center;outline:none}
</style></head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const KEY='mood_game_v1';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const CARDS=[
 {id:'courage',name:'אומץ',glyph:'✦',motif:'figure',reflect:'אתה לא צריך להיות אמיץ. רק לעשות את הצעד הבא.',invite:'תגיד שלום לאדם אחד שאתה לא מכיר.',think:'מהו צעד קטן אחד שאתה יכול לעשות היום?'},
 {id:'connection',name:'חיבור',glyph:'♡',motif:'two',reflect:'החום שאתה מרגיש שווה יותר כשהוא נאמר בקול.',invite:'שלח למישהו הודעה קטנה: חשבתי עליך.',think:'למי לא אמרת מזמן שהוא חשוב לך?'},
 {id:'rest',name:'מנוחה',glyph:'☾',motif:'moon',reflect:'לעצור זה לא לוותר. זו בחירה.',invite:'שב שתי דקות בלי לעשות כלום, בכוונה.',think:'מתי בפעם האחרונה נתת לעצמך לנוח באמת?'},
 {id:'presence',name:'נוכחות',glyph:'○',motif:'candle',reflect:'רוב החיים קורים כשאנחנו במקום אחר. חזור לרגע.',invite:'שים לב לשלושה דברים סביבך עכשיו, לאט.',think:'איפה הראש שלך כשהגוף שלך כאן?'},
 {id:'boundaries',name:'גבולות',glyph:'‖',motif:'stairs',reflect:'כל "לא" שומר על "כן" שחשוב לך יותר.',invite:'אמור "תן לי לחשוב על זה" במקום כן אוטומטי.',think:'על מה אתה שומר כשאתה אומר לא?'},
 {id:'curiosity',name:'סקרנות',glyph:'✧',motif:'path',reflect:'סקרנות היא איך נשארים חיים.',invite:'שאל שאלה אחת אמיתית על משהו שחלפת לידו.',think:'מה עורר בך פליאה לאחרונה?'},
 {id:'growth',name:'צמיחה',glyph:'❧',motif:'plant',reflect:'אתה בדרך הנכונה. המשך כך.',invite:'עשה דבר קטן אחד שדחית שוב ושוב.',think:'מה גדל בך בשקט בזמן האחרון?'},
 {id:'serenity',name:'שלווה',glyph:'≈',motif:'sail',reflect:'יש שקט שאפשר לבחור בו.',invite:'קח חמש נשימות איטיות, בעיניים עצומות.',think:'מה יעזור לך להרפות רגע?'},
 {id:'hope',name:'תקווה',glyph:'☀',motif:'sunfig',reflect:'מחר עוד לא יודע מה יגלה עליך.',invite:'רשום דבר אחד שאתה מצפה לו.',think:'לאן אתה בדרך?'},
 {id:'clarity',name:'בהירות',glyph:'◐',motif:'moonstair',reflect:'יש לך את כל מה שאתה צריך ברור בפנים.',invite:'כתוב משפט אחד על מה שחשוב לך היום.',think:'מה אתה כבר יודע ולא מודה בו?'},
 {id:'creativity',name:'יצירה',glyph:'✺',motif:'spark',reflect:'לעשות דבר אחד קטן מנצח לצרוך דבר מושלם.',invite:'צור דבר קטן אחד — שרבוט, משפט, תמונה — ושמור.',think:'מה היית עושה אם זה לא היה חייב להיות טוב?'},
 {id:'release',name:'שחרור',glyph:'~',motif:'path',reflect:'מה שאתה משחרר מפנה מקום למשהו חדש.',invite:'ותר על דבר אחד קטן שאתה נאחז בו.',think:'מה כבד לך לשאת סתם?'},
];
const byId=id=>CARDS.find(c=>c.id===id);
const Q1={q:'מה הכי מעסיק אותך ברגעים האלה?',opts:['עבודה','זוגיות','לחץ ודאגות','חוסר ודאות']};
const Q2={q:'מה אתה צריך יותר מכל?',opts:['אנרגיה','בהירות','שקט','ביטחון']};
const READ={'אנרגיה':'תשישות שמחפשת ניצוץ','בהירות':'ערפל שמבקש קו אחד ברור','שקט':'עומס שמבקש רגע של שקט','ביטחון':'אי-שקט שמחפש קרקע'};

function drawPortal(cv,card,seed){
 const dpr=Math.min(2,window.devicePixelRatio||1);
 const W=cv.clientWidth||210, H=cv.clientHeight||300;
 cv.width=W*dpr; cv.height=H*dpr; const x=cv.getContext('2d'); x.scale(dpr,dpr);
 const R=mulberry32((seed*2654435761)>>>0);
 x.clearRect(0,0,W,H);
 let bg=x.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#0c0a07'); bg.addColorStop(1,'#050403'); x.fillStyle=bg; x.fillRect(0,0,W,H);
 for(let i=0;i<80;i++){x.fillStyle=`rgba(${40+R()*30|0},${32+R()*20|0},22,${.12+R()*.2})`;const s=R()*2+.4;x.fillRect(R()*W,R()*H,s,s);}
 const cx=W*0.5, cy=H*0.47, rx=W*0.36, ry=H*0.40, N=60, pts=[];
 for(let i=0;i<N;i++){const a=i/N*Math.PI*2;const top=(Math.sin(a)<0)?0.86:1.06;const jit=1+(R()-0.5)*0.09;
   pts.push([cx+Math.cos(a)*rx*jit, cy+Math.sin(a)*ry*top*jit]);}
 const trace=()=>{x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<=N;i++){const p=pts[i%N],q=pts[(i+1)%N];x.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}x.closePath();};
 x.save(); trace(); x.clip();
 let sky=x.createLinearGradient(0,cy-ry,0,cy+ry);
 sky.addColorStop(0,'#20233c'); sky.addColorStop(.4,'#4a3348'); sky.addColorStop(.62,'#8a4f33'); sky.addColorStop(.8,'#e7a457'); sky.addColorStop(1,'#f3c877');
 x.fillStyle=sky; x.fillRect(0,0,W,H);
 const hy=cy+ry*0.34; const gl=x.createRadialGradient(cx,hy,4,cx,hy,rx*1.3);
 gl.addColorStop(0,'rgba(255,236,190,.95)'); gl.addColorStop(.25,'rgba(255,200,120,.6)'); gl.addColorStop(1,'rgba(255,180,90,0)');
 x.fillStyle=gl; x.fillRect(0,0,W,H);
 for(let i=0;i<14;i++){const clx=R()*W, cly=cy-ry*0.3+R()*ry*1.1, cr=18+R()*46;
   const cg=x.createRadialGradient(clx,cly,2,clx,cly,cr);const warm=cly>hy-10;
   cg.addColorStop(0,warm?'rgba(255,214,150,.5)':'rgba(120,110,140,.4)'); cg.addColorStop(1,'rgba(0,0,0,0)');
   x.fillStyle=cg; x.beginPath(); x.arc(clx,cly,cr,0,7); x.fill();}
 drawMotif(x,card.motif,cx,cy,rx,ry,hy,R);
 for(let i=0;i<26;i++){const sx=cx+(R()-.5)*rx*1.7, sy=cy+(R()-.5)*ry*1.7; x.fillStyle=`rgba(255,224,170,${.3+R()*.6})`; x.beginPath(); x.arc(sx,sy,R()*1.3+.3,0,7); x.fill();}
 x.restore();
 x.save(); trace(); x.lineWidth=2.4; x.strokeStyle='rgba(255,214,150,.45)'; x.shadowColor='rgba(255,190,110,.6)'; x.shadowBlur=16; x.stroke(); x.restore();
 const vig=x.createRadialGradient(cx,cy,H*0.2,cx,cy,H*0.72); vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(6,4,2,.85)'); x.fillStyle=vig; x.fillRect(0,0,W,H);
}
function drawMotif(x,m,cx,cy,rx,ry,hy,R){
 x.save(); const sil='rgba(14,9,6,.92)';
 const figure=(fx,scale)=>{x.fillStyle=sil;const s=scale||1;const by=hy+ry*0.02;
   x.beginPath();x.ellipse(fx,by-40*s,7*s,8*s,0,0,7);x.fill();
   x.beginPath();x.moveTo(fx-9*s,by);x.quadraticCurveTo(fx-7*s,by-32*s,fx,by-33*s);x.quadraticCurveTo(fx+7*s,by-32*s,fx+9*s,by);x.closePath();x.fill();
   x.fillRect(fx-6*s,by,4*s,26*s);x.fillRect(fx+2*s,by,4*s,26*s);
   x.globalAlpha=.25;x.fillRect(fx-8*s,by+26*s,16*s,12*s);x.globalAlpha=1;};
 if(m==='figure'||m==='sunfig'){figure(cx,1.15);}
 else if(m==='two'){figure(cx-16,1.0);figure(cx+14,1.05);}
 else if(m==='moon'||m==='moonstair'){const my=cy-ry*0.35;const mg=x.createRadialGradient(cx,my,2,cx,my,26);mg.addColorStop(0,'rgba(255,244,214,1)');mg.addColorStop(.6,'rgba(255,224,170,.9)');mg.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=mg;x.beginPath();x.arc(cx,my,26,0,7);x.fill();x.fillStyle='rgba(255,248,224,.95)';x.beginPath();x.arc(cx,my,12,0,7);x.fill();
   if(m==='moonstair'){x.fillStyle=sil;for(let i=0;i<5;i++){x.fillRect(cx-24+i*10,hy+8+i*7,22,4);}}}
 else if(m==='candle'){const my=hy-6;const cg=x.createRadialGradient(cx,my,1,cx,my,30);cg.addColorStop(0,'rgba(255,240,200,1)');cg.addColorStop(1,'rgba(255,190,110,0)');x.fillStyle=cg;x.beginPath();x.arc(cx,my,30,0,7);x.fill();x.fillStyle='#fff3d6';x.beginPath();x.ellipse(cx,my,3,6,0,0,7);x.fill();}
 else if(m==='stairs'){x.fillStyle=sil;for(let i=0;i<6;i++){x.fillRect(cx-30+i*11,hy+16-i*9,26,5);}}
 else if(m==='path'){x.strokeStyle='rgba(255,220,160,.5)';x.lineWidth=8;x.beginPath();x.moveTo(cx,hy+ry*0.45);x.quadraticCurveTo(cx+18,hy,cx,hy-ry*0.2);x.stroke();x.lineWidth=3;x.strokeStyle='rgba(255,240,200,.6)';x.stroke();}
 else if(m==='plant'){x.strokeStyle=sil;x.lineWidth=2.4;const by=hy+ry*0.12;for(let s=-1;s<=1;s++){x.beginPath();x.moveTo(cx+s*10,by);x.quadraticCurveTo(cx+s*20,by-34,cx+s*8,by-58);x.stroke();for(let k=1;k<4;k++){const ly=by-14*k;x.beginPath();x.ellipse(cx+s*10-s*4,ly,7,3,s*0.6,0,7);x.fillStyle=sil;x.fill();}}}
 else if(m==='sail'){x.fillStyle=sil;x.beginPath();x.moveTo(cx,hy-30);x.lineTo(cx+16,hy+6);x.lineTo(cx,hy+6);x.closePath();x.fill();x.fillRect(cx-1,hy-30,2,36);x.globalAlpha=.3;x.fillRect(cx-30,hy+8,60,3);x.globalAlpha=1;}
 else if(m==='spark'){for(let i=0;i<7;i++){const a=i/7*7;const px=cx+Math.cos(a)*22,py=cy-ry*0.2+Math.sin(a)*22;const sg=x.createRadialGradient(px,py,0,px,py,9);sg.addColorStop(0,'rgba(255,240,200,1)');sg.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=sg;x.beginPath();x.arc(px,py,9,0,7);x.fill();}}
 x.restore();
}
function mountCard(node,card,seed,sparks){
 const cv=node.querySelector('canvas');
 requestAnimationFrame(()=>{try{drawPortal(cv,card,seed)}catch(e){}});
 if(sparks){for(let i=0;i<5;i++){const s=el('<span class="spark"></span>');s.style.left=(20+Math.random()*60)+'%';s.style.top=(20+Math.random()*55)+'%';s.style.animationDelay=(Math.random()*3)+'s';node.appendChild(s);}}
}
function cardEl(card,seed,opt){opt=opt||{};
 const n=el('<div class="card"><canvas></canvas><div class="sheen"></div></div>');
 setTimeout(()=>mountCard(n,card,seed||1,opt.sparks),0);
 return n;
}
let state=load()||{name:'',setup:false,day:1,q1:null,q2:null,kept:[],offer:null,chosen:null,tab:'home',phase:'greet'};
function todaySeed(){return state.day*97+7}
function screen(html,cls){app.querySelectorAll('.screen,.nav').forEach(n=>n.remove());const s=el(`<div class="screen ${cls||''}">${html}</div>`);app.appendChild(s);return s}
function nav(){
 const items=[['home','בית','⌂'],['cards','קלפים','▦'],['journey','מסע','◠'],['profile','פרופיל','◔']];
 const n=el(`<div class="nav">${items.map(([id,l,ic])=>`<button data-tab="${id}" class="${state.tab===id?'on':''}"><span class="ic">${ic}</span>${l}</button>`).join('')}</div>`);
 n.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();route()});
 app.appendChild(n);
}
function go(phase){state.phase=phase;save();route()}
function route(){
 if(!state.setup)return renderSetup();
 if(state.tab==='home')return renderHome();
 if(state.tab==='cards')return renderLibrary();
 if(state.tab==='journey')return renderJourney();
 if(state.tab==='profile')return renderProfile();
}
function renderSetup(){
 const p=state.phase;
 if(p==='greet'||!p){
  const s=screen(`<div class="center-col">
   <div class="eyebrow rise">MOOD</div>
   <div style="height:280px;width:210px;margin:26px 0" class="rise" id="hero"></div>
   <h1 class="rise" style="animation-delay:.1s">פעם ביום.<br>רגע אחד. שלך.</h1>
   <p class="lead rise" style="animation-delay:.2s;max-width:320px">משחק קטן של להיות אדם. קלף ביום, צעד אחד אמיתי בעולם.</p>
   <div class="rise" style="animation-delay:.35s;margin-top:26px;width:100%;max-width:320px">
     <input class="tiny-input" id="nm" placeholder="איך קוראים לך?" maxlength="14">
     <button class="btn block" id="start" style="margin-top:14px">התחל</button>
   </div></div>`,'center');
  const h=s.querySelector('#hero');const c=cardEl(byId('hope'),3,{sparks:true});c.style.height='280px';h.appendChild(c);
  s.querySelector('#start').onclick=()=>{state.name=(s.querySelector('#nm').value||'').trim();go('q1')};
  return;
 }
 if(p==='q1'||p==='q2'){
  const Q=p==='q1'?Q1:Q2; const cur=p==='q1'?state.q1:state.q2;
  const s=screen(`<div class="pt topbar"><span class="cap dim">שלב ${p==='q1'?1:2} מתוך 2</span><span class="brand">mood</span><span style="width:40px"></span></div>
   <div style="height:230px;width:170px;margin:6px auto 22px" id="qh"></div>
   <h2 class="rise" style="text-align:center;max-width:360px;margin:0 auto 20px">${Q.q}</h2>
   <div class="rise" style="max-width:380px;margin:0 auto;width:100%" id="opts"></div>`);
  const c=cardEl(byId(p==='q1'?'presence':'clarity'),p==='q1'?5:9);c.style.height='230px';s.querySelector('#qh').appendChild(c);
  const o=s.querySelector('#opts');
  Q.opts.forEach(op=>{const b=el(`<button class="pill ${cur===op?'on':''}">${op}</button>`);b.onclick=()=>{if(p==='q1'){state.q1=op;go('q2')}else{state.q2=op;go('reading')}};o.appendChild(b)});
  return;
 }
 if(p==='reading'){
  const line=READ[state.q2]||'רגע שמבקש קשב';
  const s=screen(`<div class="center-col">
   <div class="eyebrow rise">המצב הרגשי שלך היום</div>
   <div style="height:250px;width:186px;margin:22px 0" id="rh" class="rise"></div>
   <h1 class="rise" style="animation-delay:.1s">${line}</h1>
   <p class="lead rise" style="animation-delay:.2s;max-width:320px">אתה נושא הרבה על הכתפיים. המשחק כאן כדי לתת לזה רגע.</p>
   <button class="btn rise" style="animation-delay:.35s;margin-top:26px" id="c">בוא נראה מה היום ביקש</button></div>`,'center');
  const c=cardEl(byId('rest'),12,{sparks:true});c.style.height='250px';s.querySelector('#rh').appendChild(c);
  s.querySelector('#c').onclick=()=>{state.setup=true;state.phase='deal';state.tab='home';save();route()};
  return;
 }
}
function dealDay(){
 const R=mulberry32(todaySeed());const pick=[];const used=new Set();
 while(pick.length<3){const c=CARDS[Math.floor(R()*CARDS.length)];if(!used.has(c.id)){used.add(c.id);pick.push(c.id)}}
 state.offer=pick;save();
}
function renderHome(){
 const p=state.phase;
 if(p==='deal'||p==='greet'){
  if(!state.offer)dealDay();
  const hi=state.name?`בוקר טוב, ${state.name}`:'בוקר טוב';
  const s=screen(`<div class="pt topbar"><span class="icon-btn">◔</span><span class="brand">mood</span><span class="icon-btn">◇</span></div>
   <div class="center-col" style="min-height:74vh">
     <h1 class="rise">${hi}</h1>
     <p class="lead rise" style="animation-delay:.1s">יום ${state.day} במסע שלך</p>
     <div style="height:300px;width:216px;margin:26px 0" id="dh" class="rise"></div>
     <button class="btn rise" style="animation-delay:.3s" id="open">בחר את הקלפים של היום</button>
   </div>`);
  const c=cardEl(byId(state.offer[1]),todaySeed()+1,{sparks:true});c.style.height='300px';s.querySelector('#dh').appendChild(c);
  s.querySelector('#open').onclick=()=>go('choose');nav();return;
 }
 if(p==='choose'){
  const s=screen(`<div class="pt topbar"><span style="width:40px"></span><span class="brand">mood</span><span style="width:40px"></span></div>
   <h2 style="text-align:center;margin:6px auto 4px">הקלפים שלך להיום</h2>
   <p class="lead sm" style="text-align:center;margin-bottom:8px">בחר קלף כדי להעמיק</p>
   <div class="three" id="tr"></div>`);
  const tr=s.querySelector('#tr');
  state.offer.forEach((id,i)=>{const c=byId(id);const slot=el(`<div class="slot"><div class="ch"></div><div class="cardname">${c.name}</div><span class="cardglyph">${c.glyph}</span></div>`);
   slot.querySelector('.ch').appendChild(cardEl(c,todaySeed()+i,{sparks:i===1}));
   slot.onclick=()=>{state.chosen=id;go('reveal')};tr.appendChild(slot);});
  nav();return;
 }
 if(p==='reveal'){
  const c=byId(state.chosen);
  const s=screen(`<div class="pt topbar"><span class="icon-btn" id="bk">‹</span><h2 style="font-size:20px">${c.name}</h2><span class="icon-btn">⋯</span></div>
   <div style="height:340px;width:250px;margin:6px auto 18px" id="rv"></div>
   <div style="max-width:380px;margin:0 auto;text-align:center">
     <p class="rise" style="font-size:22px;line-height:1.5;font-weight:300">${c.reflect}</p>
     <div class="divider"></div>
     <div class="eyebrow" style="margin-bottom:8px">הזמנה קטנה</div>
     <p class="lead rise" style="animation-delay:.1s">${c.invite}</p>
     <div style="margin-top:12px" class="cap dim">שאלת מחשבה — ${c.think}</div>
     <button class="btn block" style="margin-top:26px" id="keep">מה לעשות עם הקלף?</button>
   </div>`);
  const cc=cardEl(c,todaySeed()+9,{sparks:true});cc.style.height='340px';s.querySelector('#rv').appendChild(cc);
  s.querySelector('#bk').onclick=()=>go('choose');s.querySelector('#keep').onclick=()=>go('decide');nav();return;
 }
 if(p==='decide'){
  const c=byId(state.chosen);
  const s=screen(`<div class="pt topbar"><span class="icon-btn" id="bk">‹</span><span class="brand">mood</span><span style="width:40px"></span></div>
   <h2 style="text-align:center;margin:10px auto 20px;max-width:320px">מה תרצה לעשות עם הקלף?</h2>
   <div style="max-width:400px;margin:0 auto;width:100%">
    <button class="choice" id="live"><div class="thumb" id="t1"></div><div><div class="big">לחיות איתו</div><div class="sm dim">אני רוצה לזכור את זה היום</div></div><span class="g">♡</span></button>
    <button class="choice" id="rel"><div class="thumb" id="t2"></div><div><div class="big">לשחרר אותו</div><div class="sm dim">אני מוכן להמשיך</div></div><span class="g">≈</span></button>
   </div>`);
  let a=cardEl(c,todaySeed()+9);a.style.height='74px';s.querySelector('#t1').appendChild(a);
  let b=cardEl(byId('release'),todaySeed()+22);b.style.height='74px';s.querySelector('#t2').appendChild(b);
  s.querySelector('#bk').onclick=()=>go('reveal');
  s.querySelector('#live').onclick=()=>{state.kept.push(c.id+'#'+state.day);go('kept')};
  s.querySelector('#rel').onclick=()=>go('released');nav();return;
 }
 if(p==='kept'||p==='released'){
  const kept=p==='kept';const c=byId(state.chosen);
  const s=screen(`<div class="center-col">
    <div class="eyebrow rise">${kept?'נשמר במסע שלך':'שוחרר'}</div>
    <div style="height:280px;width:206px;margin:24px 0" id="kh" class="rise"></div>
    <h1 class="rise" style="animation-delay:.1s">${kept?c.name:'רגע קל יותר'}</h1>
    <p class="lead rise" style="animation-delay:.2s;max-width:320px">${kept?c.invite:'מה ששחררת מפנה מקום. נתראה מחר.'}</p>
    <button class="btn rise" style="animation-delay:.35s;margin-top:26px" id="done">${state.day>=7?'ראה את המסע שלך':'סיים את היום'}</button></div>`,'center');
  const cc=cardEl(kept?c:byId('release'),todaySeed()+(kept?9:31),{sparks:kept});cc.style.height='280px';s.querySelector('#kh').appendChild(cc);
  s.querySelector('#done').onclick=()=>{if(state.day>=7){state.tab='journey';go('week')}else{state.day++;state.offer=null;state.chosen=null;go('deal')}};
  nav();return;
 }
 state.phase='deal';return renderHome();
}
function renderLibrary(){
 const s=screen(`<div class="pt topbar"><span style="width:40px"></span><span class="brand">mood</span><span class="icon-btn">⌕</span></div>
  <h2 style="text-align:center;margin-bottom:14px">ספריית הקלפים</h2>
  <div class="chips" id="ch"></div><div class="grid" id="g"></div>`);
 const ch=s.querySelector('#ch');['הכל','אומץ','חיבור','מנוחה','נוכחות','גבולות','סקרנות'].forEach((c,i)=>ch.appendChild(el(`<div class="chip ${i===0?'on':''}">${c}</div>`)));
 const g=s.querySelector('#g');
 CARDS.forEach((c,i)=>{const w=el(`<div><div class="cw"></div><div class="cap" style="text-align:center;margin-top:7px">${c.name}</div></div>`);
  w.querySelector('.cw').appendChild(cardEl(c,i*13+1));g.appendChild(w);});
 nav();
}
function renderJourney(){
 const s=screen(`<div class="pt topbar"><span style="width:40px"></span><span class="brand">mood</span><span style="width:40px"></span></div>
  <div class="center-col" style="min-height:70vh">
   <div class="eyebrow rise">המסע שלך</div>
   <h1 class="rise" style="animation-delay:.05s">${Math.min(state.day,7)} מתוך 7 ימים</h1>
   <canvas id="con" style="width:280px;height:280px;margin:18px 0"></canvas>
   <p class="lead rise" style="max-width:320px">כל קלף ששמרת הופך לאור. יחד הם מציירים מי שאתה נעשה.</p>
   ${state.day>=7?'<button class="btn" id="rs" style="margin-top:20px">התחל מסע חדש</button>':''}
  </div>`);
 drawConstellation(s.querySelector('#con'));
 const rs=s.querySelector('#rs');if(rs)rs.onclick=()=>{if(confirm('להתחיל מסע חדש?')){localStorage.removeItem(KEY);location.reload()}};
 nav();
}
function drawConstellation(cv){
 const dpr=2;cv.width=280*dpr;cv.height=280*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 x.clearRect(0,0,280,280);const kept=state.kept.length;const cx=140,cy=140,r=98;
 x.strokeStyle='rgba(201,162,94,.15)';x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();
 x.strokeStyle='rgba(255,214,150,.4)';x.lineWidth=1;x.beginPath();
 for(let i=0;i<kept&&i<7;i++){const a=-Math.PI/2+i/7*Math.PI*2;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
 for(let i=0;i<7;i++){const a=-Math.PI/2+i/7*Math.PI*2;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;const on=i<kept;
   if(on){const g=x.createRadialGradient(px,py,0,px,py,16);g.addColorStop(0,'rgba(255,238,196,1)');g.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,16,0,7);x.fill();x.fillStyle='#fff3d6';x.beginPath();x.arc(px,py,3.5,0,7);x.fill();}
   else{x.fillStyle='rgba(201,162,94,.25)';x.beginPath();x.arc(px,py,2,0,7);x.fill();}}
}
function renderProfile(){
 const rows=['המסע שלי','הקלפים שלי','יומן מסע','סטטיסטיקות','הגדרות'];
 const s=screen(`<div class="pt topbar"><span style="width:40px"></span><span class="brand">mood</span><span style="width:40px"></span></div>
  <div style="display:flex;align-items:center;gap:16px;margin:10px 0 6px">
    <div style="width:64px;height:64px;border-radius:50%;overflow:hidden;border:1px solid var(--line)" id="av"></div>
    <div><div style="font-size:22px">${state.name||'אורח/ת'}</div><div class="sm dim">מסע ${state.day} ימים</div></div></div>
  <div class="divider"></div>
  ${rows.map(r=>`<div class="menu-row">${r}<span class="g">›</span></div>`).join('')}
  <div class="menu-row" id="reset" style="color:var(--gold)">התחל מסע חדש<span class="g">↺</span></div>`);
 const a=cardEl(byId('hope'),3);a.style.height='64px';s.querySelector('#av').appendChild(a);
 s.querySelector('#reset').onclick=()=>{if(confirm('להתחיל מסע חדש?')){localStorage.removeItem(KEY);location.reload()}};
 nav();
}
route();
