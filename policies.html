<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mood — מידע ושירות</title>
<meta name="description" content="משלוחים, החזרות, מדיניות פרטיות, תנאי שימוש והצהרת נגישות של mood — ריטואל שוקולד פונקציונלי.">
<style>
:root{--ink:#171714;--cream:#faf5ec;--line:#e3dbd0;--muted:#615d56;--energy:#e8812c}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Assistant,Heebo,Arial,sans-serif;-webkit-text-size-adjust:100%}
html{scroll-behavior:smooth}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px clamp(18px,4vw,44px);display:flex;align-items:center;justify-content:space-between}
.top .logo img{height:32px;width:auto;display:block}
.back{color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:800}
.back:hover{color:var(--energy)}
main{max-width:840px;margin:0 auto;padding:clamp(40px,5vw,72px) clamp(18px,5vw,44px) clamp(72px,10vw,120px)}
h1{font-size:clamp(36px,5.6vw,58px);line-height:1.02;letter-spacing:-.04em;font-weight:900;margin:0 0 12px}
.lede{margin:0 0 30px;color:var(--muted);font-size:clamp(15px,1.5vw,17.5px);line-height:1.6;max-width:60ch}
.toc{list-style:none;padding:0;margin:0 0 34px;display:flex;flex-wrap:wrap;gap:8px 10px}
.toc a{display:inline-block;padding:9px 15px;border-radius:999px;background:var(--cream);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--ink);text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.toc a:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{background:#fff4e9;border:1px solid #efc9a6;border-radius:16px;padding:18px 22px;margin:0 0 26px;color:#7a4318;font-weight:700;font-size:14.5px;line-height:1.55}
section{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3vw,34px);margin:16px 0;scroll-margin-top:90px}
section h2{font-size:clamp(22px,2.6vw,28px);letter-spacing:-.02em;font-weight:900;margin:0 0 10px}
section p{margin:0 0 12px;color:#4a4239;font-size:15.5px;line-height:1.75}
section p:last-child{margin-bottom:0}
section a{color:var(--energy);font-weight:800}
.foot{background:#171714;color:#cbbfae;padding:32px 6vw;text-align:center;font-size:12.5px;letter-spacing:.02em}
.foot b{color:#fff;font-weight:900}
@media(max-width:600px){.top{padding:12px 18px}h1{font-size:34px}main{padding:32px 18px 60px}section{padding:22px}}

/* v43 — Full Mayven-style footer with subtle 'mood' watermark */
.mfoot {
  position: relative;
  background: #0f0a05;
  color: #d9c9b3;
  padding: 80px 4vw 0;
  overflow: hidden;
  font-family: 'Assistant', sans-serif;
  direction: rtl;
}
.mfoot-mark {
  position: absolute;
  bottom: -60px; left: 50%;
  transform: translateX(-50%);
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: clamp(280px, 42vw, 640px);
  letter-spacing: -22px;
  color: rgba(247,236,216,.05);
  line-height: 1;
  pointer-events: none;
  user-select: none;
  z-index: 0;
  white-space: nowrap;
}
.mfoot-in {
  position: relative; z-index: 1;
  max-width: 1240px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 60px 40px;
  padding-bottom: 60px;
}
.mfoot-brand .brand { border-radius: 8px; padding: 8px 18px; }
.mfoot-tag {
  color: #a09a90;
  font-size: 14px;
  line-height: 1.6;
  margin: 20px 0 26px;
  max-width: 300px;
}
.mfoot-news-l {
  display: block;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 800; letter-spacing: 2.5px;
  color: #e8c880;
  text-transform: uppercase;
  margin: 0 0 12px;
}
.mfoot-news-row {
  display: flex; gap: 8px;
  background: rgba(247,236,216,.06);
  border: 1px solid rgba(247,236,216,.15);
  border-radius: 10px;
  padding: 4px;
  max-width: 320px;
  margin: 0 0 10px;
}
.mfoot-news-row input {
  flex: 1;
  background: transparent;
  border: 0;
  padding: 10px 12px;
  color: #fdfaf3;
  font: inherit; font-size: 14px;
  outline: none;
  direction: rtl;
}
.mfoot-news-row input::placeholder { color: #6b625a; }
.mfoot-news-row button {
  background: #f7ecd8;
  color: #1a1109;
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  font: inherit; font-weight: 800; font-size: 13.5px;
  cursor: pointer;
  transition: background .18s;
}
.mfoot-news-row button:hover { background: #fff; }
.mfoot-brand small { font-size: 12px; color: #6b625a; }

.mfoot-col h4 {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 2.4px;
  color: #e8c880;
  text-transform: uppercase;
  margin: 0 0 20px;
}
.mfoot-col ul { list-style: none; margin: 0 0 20px; padding: 0; }
.mfoot-col li { margin: 0 0 10px; }
.mfoot-col a {
  color: #d9c9b3;
  text-decoration: none;
  font-size: 14.5px;
  transition: color .18s;
}
.mfoot-col a:hover { color: #fdfaf3; text-decoration: underline; text-underline-offset: 4px; }

.mfoot-social {
  display: flex; gap: 10px; margin: 4px 0 0;
}
.mfoot-social a {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(247,236,216,.2);
  color: #d9c9b3;
  display: grid; place-items: center;
  transition: all .2s;
}
.mfoot-social a:hover {
  background: #f7ecd8;
  border-color: #f7ecd8;
  color: #1a1109;
  transform: translateY(-2px);
}

.mfoot-strip {
  position: relative; z-index: 1;
  border-top: 1px solid rgba(247,236,216,.1);
  padding: 24px 0;
}
.mfoot-strip-in {
  max-width: 1240px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 20px;
}
.mfoot-pay { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mfoot-pay .pay {
  width: 44px; height: 28px;
  border-radius: 4px;
  display: grid; place-items: center;
  font-family: Arial, sans-serif; font-weight: 900; font-size: 11px; letter-spacing: .5px;
  color: #fff; background: #1a1f71;
}
.mfoot-pay .pay-mc { background: #fff; position: relative; border: 1px solid #ddd; }
.mfoot-pay .pay-mc span:nth-child(1) { position: absolute; left: 8px; top: 5px; width: 18px; height: 18px; background: #eb001b; border-radius: 50%; }
.mfoot-pay .pay-mc span:nth-child(2) { position: absolute; right: 8px; top: 5px; width: 18px; height: 18px; background: #f79e1b; border-radius: 50%; mix-blend-mode: multiply; }
.mfoot-pay .pay-amex { background: #016fd0; font-size: 10px; }
.mfoot-pay .pay-apple { background: #000; font-weight: 600; font-size: 10px; }
.mfoot-pay .pay-bit { background: #00b4c5; font-weight: 900; }
.mfoot-pay .pay-gpay { background: #fff; border: 1px solid #ddd; color: #5f6368; font-weight: 600; font-size: 9px; }

.mfoot-legal {
  color: #6b625a;
  font-size: 12.5px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  letter-spacing: .02em;
}
.mfoot-legal a { color: #a09a90; text-decoration: none; transition: color .18s; }
.mfoot-legal a:hover { color: #fdfaf3; }

@media (max-width: 900px) {
  .mfoot-in { grid-template-columns: 1fr 1fr; gap: 40px 30px; }
  .mfoot-brand { grid-column: 1 / -1; }
  .mfoot-mark { font-size: clamp(160px, 60vw, 380px); letter-spacing: -12px; bottom: -30px; }
  .mfoot-strip-in { justify-content: center; text-align: center; }
}
@media (max-width: 520px) {
  .mfoot-in { grid-template-columns: 1fr; }
  .mfoot { padding: 60px 5vw 0; }
}
