<script>
var FRAG=`
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse;
uniform vec3 uAccent; uniform vec3 uBg1; uniform vec3 uBg2;
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float map(vec3 p){
  float d=1e5;
  for(int i=0;i<6;i++){
    float fi=float(i);
    vec3 c=vec3(sin(uTime*0.40+fi*1.7)*0.62,
               cos(uTime*0.33+fi*2.3)*0.46,
               sin(uTime*0.28+fi*1.1)*0.52);
    d=smin(d,length(p-c)-0.55,0.45);
  }
  vec3 mc=vec3(uMouse*vec2(1.7,1.05),0.35);
  d=smin(d,length(p-mc)-0.42,0.40);
  d+=0.03*sin(p.x*6.0+uTime)*sin(p.y*5.5+uTime*1.2)*sin(p.z*6.0+uTime*0.6);
  return d;
}
vec3 nrm(vec3 p){vec2 e=vec2(0.002,0.);
  return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
vec3 sky(vec2 uv){
  vec3 g=mix(uBg2,uBg1,clamp(uv.y*1.05,0.,1.));
  float glow=smoothstep(0.9,0.0,length((uv-vec2(0.5,0.55))*vec2(1.3,1.0)));
  g=mix(g, mix(g,uAccent,0.5), glow*0.16);
  g*=1.0-0.10*pow(length(uv-0.5),2.0);
  return g;
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes.xy;
  vec2 p=(gl_FragCoord.xy-0.5*uRes.xy)/uRes.y;
  vec3 ro=vec3(0.0,0.0,3.4), rd=normalize(vec3(p,-1.6));
  float t=0.0,hit=0.0; vec3 pos;
  for(int i=0;i<96;i++){pos=ro+rd*t; float d=map(pos); if(d<0.001){hit=1.0;break;} t+=d; if(t>7.0)break;}
  vec3 col=sky(uv);
  if(hit>0.5){
    vec3 n=nrm(pos), V=-rd;
    vec3 L1=normalize(vec3(-0.6,0.75,0.6)), L2=normalize(vec3(0.6,0.2,0.5));
    float dif=max(dot(n,L1),0.0), dif2=max(dot(n,L2),0.0);
    vec3 choc=vec3(0.20,0.10,0.055);
    vec3 c=choc*(0.30+0.95*dif)+choc*0.4*dif2;
    vec3 H=normalize(L1+V);
    c+=vec3(1.0,0.88,0.66)*pow(max(dot(n,H),0.0),42.0)*1.15;      // molten glossy spec
    float fres=pow(1.0-max(dot(n,V),0.0),2.6);
    c+=uAccent*fres*0.55;                                          // moment color on the rim
    c=mix(c, sky(uv), smoothstep(3.6,5.4,t)*0.5);                  // melt into the light
    col=c;
  }
  col=pow(clamp(col,0.,1.),vec3(0.92));
  gl_FragColor=vec4(col,1.0);
}
`, VERT=`attribute vec2 a; void main(){gl_Position=vec4(a,0.,1.);}`;
(function(){
  // ---- time-of-day -> the moment ----
  function pad(n){return (n<10?'0':'')+n;}
  var q=new URLSearchParams(location.search); var hoverH=q.get('h');
  var now=new Date(); var H=hoverH!==null?parseInt(hoverH):now.getHours();
  var MM=hoverH!==null?0:now.getMinutes();
  function moment(h){
    if(h>=5&&h<11)  return {k:'ENERGY',he:'בוקר',   ac:[1.00,0.42,0.21], b1:[0.975,0.935,0.86], b2:[0.95,0.86,0.73], sub:'עוד לפני הקפה — ריבוע אחד, טעם אמיתי.'};
    if(h>=11&&h<17) return {k:'ENERGY',he:'אמצע היום',ac:[1.00,0.45,0.20], b1:[0.98,0.95,0.90], b2:[0.955,0.90,0.80], sub:'הנפילה של אמצע היום. הביס שסוגר את הפינה.'};
    if(h>=17&&h<22) return {k:'RELAX', he:'ערב',    ac:[0.46,0.63,0.42], b1:[0.965,0.905,0.83], b2:[0.925,0.83,0.74], sub:'מורידים הילוך. סוגרים את הטלפון, לוקחים ריבוע.'};
    return                {k:'SLEEP', he:'לילה',   ac:[0.62,0.44,0.74], b1:[0.905,0.875,0.885],b2:[0.82,0.79,0.85], sub:'הטעם האחרון של היום, לפני שמכבים את האור.'};
  }
  var m=moment(H);
  document.documentElement.style.setProperty('--accent','rgb('+m.ac.map(function(v){return Math.round(v*255);}).join(',')+')');
  document.getElementById('clock').textContent='NOW · '+pad(H)+':'+pad(MM)+' · '+m.he;
  document.getElementById('moment').textContent=m.k;
  document.getElementById('sub').textContent=m.sub;
  document.getElementById('eyebrow').textContent='mood № '+(m.k==='ENERGY'?'01':m.k==='RELAX'?'02':'03')+' · '+m.k;

  var cv=document.getElementById('gl');
  var gl=cv.getContext('webgl')||cv.getContext('experimental-webgl'); if(!gl)return;
  function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
    if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
  var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(pr);gl.useProgram(pr);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var la=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
  var U=function(n){return gl.getUniformLocation(pr,n);};
  var uRes=U('uRes'),uTime=U('uTime'),uMouse=U('uMouse'),uAcc=U('uAccent'),uB1=U('uBg1'),uB2=U('uBg2');
  var dpr=Math.min(devicePixelRatio||1,2);
  function rs(){cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;gl.viewport(0,0,cv.width,cv.height);}
  addEventListener('resize',rs);rs();
  var mx=0,my=0,tx=0,ty=0;
  addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-0.5)*2.0;ty=-(e.clientY/innerHeight-0.5)*2.0;});
  var t0=performance.now();
  function frame(now){
    var t=(now-t0)/1000; mx+=(tx-mx)*0.05; my+=(ty-my)*0.05;
    gl.uniform2f(uRes,cv.width,cv.height); gl.uniform1f(uTime,t); gl.uniform2f(uMouse,mx,my);
    gl.uniform3fv(uAcc,m.ac); gl.uniform3fv(uB1,m.b1); gl.uniform3fv(uB2,m.b2);
    gl.drawArrays(gl.TRIANGLES,0,3); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
