<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="theme-color" content="#efe7d6"/>
<title>MOOD · רגע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f0e8d8; --paper2:#e9dfca; --card:#f6efe0; --ink:#3b342a; --ink-soft:#6c6250;
  --faint:#9a8f78; --line:#d8cbb0;
  --olive:#6d7a4c; --olive-d:#586440;      /* present / connected */
  --terra:#c07d46; --terra-d:#a5673a;      /* middle */
  --dusk:#8a7f93; --dusk-d:#726781;        /* not yet */
  --serif:'Frank Ruhl Libre',serif; --sans:'Heebo',sans-serif;
  --shadow:0 18px 44px -22px rgba(70,55,30,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0e0c08;color:var(--ink);font-family:var(--sans);font-weight:300;
  overflow:hidden;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased}
/* the fixed 9:16 stage */
#stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh * 9 / 16);
  background:var(--paper);overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.6)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/></svg>");
  mix-blend-mode:multiply}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .34s ease,transform .5s cubic-bezier(.16,1,.3,1)}
.screen.on{opacity:1;visibility:visible;transform:none}
.screen.exit{opacity:0;transform:translateY(-12px);transition:opacity .24s ease,transform .3s ease}

/* zone 1 — safe top (8%) */
.z-top{flex:0 0 8%;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:3}
.step{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.bk{background:none;border:none;color:var(--ink-soft);width:30px;height:30px;cursor:pointer;opacity:.7}
.bk svg{width:22px;height:22px}
.pips{display:flex;gap:5px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--olive)}

/* zone 2 — scene (55%) */
.z-scene{flex:0 0 55%;position:relative;overflow:hidden}
.scene{position:absolute;inset:14px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
  background:var(--card)}
.scene img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:
    radial-gradient(120% 80% at 50% 30%, #f7e9cf 0%, #eadcc0 45%, #e0d0b0 100%);}
.ph canvas{position:absolute;inset:0}
.ph .frameline{position:absolute;inset:14px;border:1.5px dashed rgba(120,100,60,.35);border-radius:12px}
.ph .lbl{position:relative;z-index:2;font-family:var(--serif);font-size:15px;color:rgba(90,72,40,.6);
  letter-spacing:.02em;background:rgba(246,239,224,.7);padding:6px 16px;border-radius:20px;border:1px solid rgba(120,100,60,.2)}
.ph .motif{position:relative;z-index:2;margin-bottom:16px;opacity:.5}
.ph .motif svg{width:70px;height:70px;color:var(--olive-d)}
.scene .vign{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 -40px 60px -30px rgba(70,55,30,.35)}

/* zone 3 — message (18%) */
.z-msg{flex:0 0 19%;display:flex;flex-direction:column;justify-content:center;padding:14px 26px 6px;text-align:center;z-index:3}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive-d);margin-bottom:9px;font-weight:400}
.title{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.32;color:var(--ink);text-wrap:balance}
.body{font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.6;color:var(--ink-soft);margin-top:8px;text-wrap:balance}
.z-msg.lg .title{font-size:25px}

/* zone 4 — choices (25%) */
.z-choice{flex:0 0 25%;display:flex;flex-direction:column;justify-content:center;gap:11px;padding:6px 24px max(20px,env(safe-area-inset-bottom));z-index:3}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:56px;
  border:none;border-radius:30px;cursor:pointer;font-family:var(--sans);font-weight:500;font-size:16.5px;
  color:#fbf7ee;position:relative;overflow:hidden;padding:8px 18px;line-height:1.3;
  box-shadow:0 8px 20px -10px rgba(70,55,30,.5)}
.btn.present{background:var(--olive)} .btn.present:active{background:var(--olive-d)}
.btn.mid{background:var(--terra)} .btn.mid:active{background:var(--terra-d)}
.btn.notyet{background:var(--dusk)} .btn.notyet:active{background:var(--dusk-d)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn .h{opacity:.9}
.btn.line{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);box-shadow:none;font-weight:400}
.btn.line:active{background:rgba(120,100,60,.06)}
.btn svg{width:18px;height:18px}

/* feel check */
.feel{display:flex;gap:10px;justify-content:center}
.feel button{flex:1;max-width:110px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:12px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);transition:all .2s}
.feel button:active{transform:scale(.97)}
.feel button .em{width:32px;height:32px}
.feel button.sel{border-color:var(--olive);background:#eef0e2}

/* wisdom note */
.note{position:absolute;inset:14px;border-radius:14px;background:
  linear-gradient(180deg,#f7f0e0,#efe6d2);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 28px;text-align:center;
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,rgba(150,120,70,.12) 33px 34px);}
.note .quote{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.55;color:var(--ink)}
.note .src{font-family:var(--sans);font-size:12px;color:var(--faint);margin-top:16px;letter-spacing:.06em}
.note .leaf{width:26px;height:26px;color:var(--olive);opacity:.7;margin-bottom:14px}

.center{align-items:center;justify-content:center;text-align:center}
.lift{animation:lift .55s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.26s}
@keyframes lift{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* end world card */
.worldwrap{position:absolute;inset:14px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.12s!important}}
</style>
</head>
<body>
<div id="stage"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-back"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M14 6l-6 6 6 6"/></g>
<g id="i-leaf"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M20 4C10 4 5 10 5 18c8 0 15-4 15-14zM8 18c3-5 6-8 10-10"/></g>
<g id="i-heart"><path fill="currentColor" d="M12 20S4 14.5 4 8.8C4 6 6.2 4 8.8 4 10.5 4 12 5.2 12 5.2S13.5 4 15.2 4C17.8 4 20 6 20 8.8 20 14.5 12 20 12 20z"/></g>
<g id="i-phone"><rect x="7" y="3" width="10" height="18" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M11 18h2"/></g>
<g id="i-face-calm"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/><circle cx="15" cy="10.5" r="1" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M9 15h6"/></g>
<g id="i-face-unsure"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/><circle cx="15" cy="10.5" r="1" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M9 15h6"/></g>
<g id="i-face-tense"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/><circle cx="15" cy="10.5" r="1" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M9 16c1-1.4 5-1.4 6 0"/></g>
<g id="i-scene"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" d="M3 17l5-6 4 4 3-4 6 6M3 20h18"/></g>
</defs></svg>

<script>
//========= CONTENT (single source of truth; mirrors content/book/*.json) =========
const MOMENT={
  moment_id:"presence_phone_conversation_001",
  middah_he:"נוכחות",
  recognition:{title:"הטלפון רטט בזמן שמישהו דיבר אליך.",
    body:"הוא באמצע משפט. הטלפון מהבהב על השולחן, והמבט שלך כבר נמשך אליו."},
  feel_check:{prompt:"איך זה מרגיש לך?",options:[["רגוע","i-face-calm"],["לא בטוח","i-face-unsure"],["במתח","i-face-tense"]]},
  opportunity:"הפעם — תסתכל קודם עליו.",
  choice:{prompt:"מה אתה בוחר לעשות?",
    a:{label:"בודק את הטלפון",branch:"not_yet"},
    b:{label:"נשאר איתו ומקשיב",branch:"present"}},
  branches:{
    present:{
      immediate:"הוא מרגיש שאתה איתו באמת.",
      short_term:"יש תחושת קרבה, והשיחה מעמיקה.",
      long_term:"אתה בונה אמון, קשרים עמוקים יותר, ונוכחות טבעית.",
      witness:"הטלפון מונח הפוך. שתי הכוסות קרובות. הוא נשאר.",
      world:"עולם של חיבור אמיתי, הקשבה, והרגשה של משמעות."},
    not_yet:{
      immediate:"הוא ממשיך לדבר, ואתה כבר בטלפון.",
      short_term:"אתה מפספס חלקים חשובים מהשיחה, והחיבור נחלש.",
      long_term:"אתה נעשה פחות נוכח, ואנשים מרגישים פחות חשובים לך.",
      witness:"הרגע חלף בעדינות. הדרך עדיין כאן.",
      world:"עולם של הסחות דעת וקשרים רדודים — אבל אור קטן נשאר."}
  },
  wisdom:{text:"הנוכחות שלך היא המתנה הכי גדולה שאתה יכול לתת לאדם אחר.",source:"מתוך ספר הדרך · נוכחות"},
  continuation:"החיים זימנו עוד רגע. המסע ממשיך."
};

//========= ASSET RESOLUTION (real illustrations drop in here) =========
// getAsset resolves assets/moments/<id>/<file>.png ; falls back to an honest placeholder.
function assetPath(state,branch){
  const map={recognition:"01_recognition",choice_a:"02_choice_phone",choice_b:"02_choice_stay",
    wisdom:"06_wisdom",continuation:"13_continuation"};
  let file=map[state];
  if(!file){const b=branch||"present";
    const m={immediate:"03_immediate",short_term:"04_short",long_term:"05_long",witness:"08_witness",world:"world"};
    if(m[state]) file=(state==="world"?"world_"+b:m[state]+"_"+b);
  }
  return file?`assets/moments/${MOMENT.moment_id}/${file}.png`:null;
}
const _exists={}; // cache
function sceneHTML(state,branch,motif){
  const p=assetPath(state,branch);
  const id="sc"+Math.random().toString(36).slice(2,7);
  // We can't know if the file exists synchronously; try <img>, onerror -> placeholder.
  return `<div class="scene">
    <img src="${p||''}" alt="" onerror="this.style.display='none';document.getElementById('${id}').style.display='flex'"/>
    <div class="ph" id="${id}">
      <canvas></canvas>
      <div class="frameline"></div>
      <div class="motif">${svg(motif||'i-scene')}</div>
      <div class="lbl">איור · ${stateLabel(state)}</div>
    </div>
    <div class="vign"></div>
  </div>`;
}
function stateLabel(s){return {recognition:"הרגע",choice_a:"בחירה",choice_b:"בחירה",immediate:"מיד אחרי",
  short_term:"טווח קצר",long_term:"טווח ארוך",witness:"העדות",world:"העולם"}[s]||s}

//========= ENGINE =========
const stage=document.getElementById("stage");
function svg(id){return `<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`}
function buzz(ms=12){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
let history=[];

function paint(html){
  const el=document.createElement("div");el.className="screen";el.innerHTML=html;
  const old=stage.querySelector(".screen.on");
  stage.appendChild(el);
  requestAnimationFrame(()=>{el.classList.add("on");
    if(old){old.classList.remove("on");old.classList.add("exit");setTimeout(()=>old.remove(),340);}});
  el.querySelectorAll(".ph canvas").forEach(wash);
  return el;
}
// soft watercolor wash on placeholders
function wash(cv){
  const ctx=cv.getContext("2d"),w=cv.width=cv.offsetWidth,h=cv.height=cv.offsetHeight;
  const cols=["rgba(190,150,90,.16)","rgba(150,160,110,.14)","rgba(200,125,70,.10)"];
  for(let i=0;i<7;i++){const x=Math.random()*w,y=Math.random()*h,r=60+Math.random()*120;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,cols[i%3]);g.addColorStop(1,"transparent");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
}
function topZone(step,total,idx){
  return `<div class="z-top">
    <button class="bk" onclick="back()">${svg("i-back")}</button>
    <div class="pips">${Array.from({length:total}).map((_,i)=>`<div class="pip ${i<=idx?'on':''}"></div>`).join("")}</div>
    <div class="step">${step}</div></div>`;
}

// ---- flow ----
let branch="present";
const STEPS=["recognition","choice","immediate","short_term","long_term","wisdom","world"];

function start(){history=[];Recognition();}
function go(fn){history.push(fn);fn();}
function back(){ if(history.length>1){history.pop();const prev=history[history.length-1];prev();} else location.reload(); }

function Recognition(){
  const m=MOMENT;let chosen=null;
  const el=paint(`
    ${topZone("נוכחות",7,0)}
    <div class="z-scene">${sceneHTML("recognition",null,"i-phone")}</div>
    <div class="z-msg lg">
      <div class="title lift">${m.recognition.title}</div>
      <div class="body lift d1">${m.recognition.body}</div>
    </div>
    <div class="z-choice">
      <div class="body lift d1" style="margin:0 0 2px;font-size:13px;color:var(--faint)">${m.feel_check.prompt}</div>
      <div class="feel lift d2">
        ${m.feel_check.options.map((o,i)=>`<button data-i="${i}"><span class="em">${svg(o[1])}</span>${o[0]}</button>`).join("")}
      </div>
      <button class="btn present lift d3" id="cont" style="opacity:.5;pointer-events:none;margin-top:4px">המשך</button>
    </div>`);
  el.querySelectorAll(".feel button").forEach(b=>b.onclick=()=>{buzz();
    el.querySelectorAll(".feel button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");
    const c=el.querySelector("#cont");c.style.opacity="1";c.style.pointerEvents="auto";});
  el.querySelector("#cont").onclick=()=>{buzz();go(Choice)};
}

function Choice(){
  const m=MOMENT;
  const el=paint(`
    ${topZone("ההזדמנות",7,1)}
    <div class="z-scene">${sceneHTML("recognition",null,"i-phone")}</div>
    <div class="z-msg">
      <div class="eyebrow lift">ההזדמנות</div>
      <div class="title lift d1">${m.opportunity}</div>
    </div>
    <div class="z-choice">
      <div class="body lift d1" style="margin:0 0 2px;font-size:13px;color:var(--faint)">${m.choice.prompt}</div>
      <button class="btn present lift d2" id="b">${m.choice.b.label}</button>
      <button class="btn notyet lift d3" id="a">${m.choice.a.label}</button>
    </div>`);
  el.querySelector("#b").onclick=()=>{buzz(16);branch="present";go(()=>Result("immediate"))};
  el.querySelector("#a").onclick=()=>{buzz(16);branch="not_yet";go(()=>Result("immediate"))};
}

const RESULT_META={
  immediate:{eb:"מה קורה עכשיו",next:"short_term",step:"מיד אחרי",idx:2},
  short_term:{eb:"בהמשך היום",next:"long_term",step:"טווח קצר",idx:3},
  long_term:{eb:"עם הזמן",next:"wisdom",step:"טווח ארוך",idx:4},
};
function Result(state){
  const meta=RESULT_META[state];const txt=MOMENT.branches[branch][state];
  const el=paint(`
    ${topZone(meta.step,7,meta.idx)}
    <div class="z-scene">${sceneHTML(state,branch,branch==="present"?"i-heart":"i-phone")}</div>
    <div class="z-msg">
      <div class="eyebrow lift" style="color:${branch==='present'?'var(--olive-d)':'var(--dusk-d)'}">${meta.eb}</div>
      <div class="title lift d1">${txt}</div>
    </div>
    <div class="z-choice">
      <button class="btn ${branch==='present'?'present':'notyet'} lift d2" id="n">המשך</button>
    </div>`);
  el.querySelector("#n").onclick=()=>{buzz();
    if(meta.next==="wisdom")go(Wisdom); else go(()=>Result(meta.next));};
}

function Wisdom(){
  const w=MOMENT.wisdom;
  const el=paint(`
    ${topZone("חכמה",7,5)}
    <div class="z-scene"><div class="note lift">
      <div class="leaf">${svg("i-leaf")}</div>
      <div class="quote">״${w.text}״</div>
      <div class="src">${w.source}</div>
    </div></div>
    <div class="z-msg"><div class="body lift d1" style="font-size:14px">${MOMENT.branches[branch].witness}</div></div>
    <div class="z-choice">
      <button class="btn present lift d2" id="n">${branch==='present'?'ראה מה השתנה':'המשך'}</button>
    </div>`);
  el.querySelector("#n").onclick=()=>{buzz();go(World)};
}

function World(){
  const b=MOMENT.branches[branch];
  const el=paint(`
    ${topZone("העולם",7,6)}
    <div class="z-scene">${sceneHTML("world",branch,"i-leaf")}</div>
    <div class="z-msg lg">
      <div class="eyebrow lift" style="color:var(--olive-d)">${branch==='present'?'בחרת אחרת':'עוד לא — וזה בסדר'}</div>
      <div class="title lift d1">${b.world}</div>
    </div>
    <div class="z-choice">
      <div class="body lift d1" style="margin:0;font-size:13px;color:var(--faint)">${MOMENT.continuation}</div>
      <button class="btn present lift d2" id="again">רגע חדש</button>
      <a class="btn line lift d3" href="index.html" style="text-decoration:none">חזרה למשחק</a>
    </div>`);
  el.querySelector("#again").onclick=()=>{buzz();branch="present";start()};
}

start();
</script>
</body>
</html>
