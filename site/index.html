<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="theme-color" content="#0a0b0f"/>
<title>mood — משחק הרגש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0f; --bg2:#0d0f15; --panel:#12141c; --panel2:#171a24;
  --gold:#c9a25e; --gold-bright:#e8cd94; --gold-deep:#a9863f;
  --ink:#efe6d4; --muted:#ab9c82; --faint:#6f6754;
  --line:rgba(201,162,94,.30); --line-soft:rgba(201,162,94,.16);
  --shadow:0 24px 60px -20px rgba(0,0,0,.8);
  --serif:'Frank Ruhl Libre',serif; --sans:'Heebo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  overflow:hidden; position:fixed; inset:0;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
#app{position:absolute; inset:0; max-width:520px; margin:0 auto; overflow:hidden;
  background:var(--bg);}
/* ---------- screens ---------- */
.screen{position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; visibility:hidden; transform:translateY(16px) scale(.994);
  transition:opacity .3s ease, transform .44s cubic-bezier(.16,1,.3,1);
  padding:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; will-change:opacity,transform;}
.screen.on{opacity:1; visibility:visible; transform:none;}
.screen.exit{opacity:0; transform:translateY(-12px) scale(1.008);
  transition:opacity .24s ease, transform .32s cubic-bezier(.4,0,1,1);}
.screen.up .lift{animation:lift .5s cubic-bezier(.16,1,.3,1) both;}
@keyframes lift{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.pad{padding:0 22px;}
.grow{flex:1 1 auto;}
.safe-top{height:max(18px,env(safe-area-inset-top))}
.safe-bot{height:max(96px,calc(env(safe-area-inset-bottom) + 92px))}

/* ---------- backgrounds ---------- */
.bg{position:absolute; inset:0; background-size:cover; background-position:center;
  z-index:0; opacity:.9;}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(10,11,15,.55) 0%, rgba(10,11,15,.30) 30%, rgba(10,11,15,.72) 72%, rgba(10,11,15,.96) 100%);}
.grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
canvas.dust{position:absolute;inset:0;z-index:1;pointer-events:none}
.content{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100%;}

/* ---------- typography ---------- */
.kicker{font-family:var(--sans);font-weight:400;font-size:12.5px;letter-spacing:.28em;
  color:var(--gold);text-transform:uppercase;opacity:.8}
h1{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.2;letter-spacing:.01em}
h2{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.25}
.lead{font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.7;color:var(--muted)}
.tiny{font-size:12.5px;color:var(--faint);letter-spacing:.04em}
.serif{font-family:var(--serif)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;height:56px;border:none;border-radius:40px;cursor:pointer;
  font-family:var(--sans);font-weight:500;font-size:16.5px;letter-spacing:.02em;
  color:#20180c;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#e6c98d,#c9a25e 60%,#b1873f);
  box-shadow:0 10px 30px -8px rgba(201,162,94,.5), inset 0 1px 0 rgba(255,255,255,.4);}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);
  box-shadow:none;font-weight:400}
.btn.ghost:active{background:rgba(201,162,94,.06)}
.btn .shimmer{position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sh 4.5s ease-in-out infinite}
@keyframes sh{0%,60%{left:-60%}100%{left:130%}}

/* ---------- option pills ---------- */
.opts{display:flex;flex-direction:column;gap:13px}
.opt{height:58px;border-radius:34px;border:1px solid var(--line-soft);
  background:rgba(20,22,30,.55);backdrop-filter:blur(6px);
  color:var(--ink);font-family:var(--sans);font-size:16px;font-weight:400;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .3s ease;position:relative;overflow:hidden}
.opt:active{transform:scale(.985)}
.opt.sel{background:linear-gradient(180deg,#e6c98d,#c9a25e 60%,#b1873f);
  color:#20180c;font-weight:500;border-color:transparent;
  box-shadow:0 8px 26px -10px rgba(201,162,94,.6)}

/* ---------- cards ---------- */
.card{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;
  background:#0b0c11;box-shadow:var(--shadow);
  isolation:isolate;}
.card .art{position:absolute;inset:0;background-size:cover;background-position:center;
  transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.card .veil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,11,15,.15) 40%,rgba(10,11,15,.55) 72%,rgba(10,11,15,.92) 100%)}
.card .frame{position:absolute;inset:7px;border:1px solid var(--line);border-radius:14px;
  pointer-events:none;box-shadow:inset 0 0 22px rgba(201,162,94,.10)}
.card .frame::before{content:"";position:absolute;inset:3px;border:1px solid var(--line-soft);border-radius:11px}
.card .meta{position:absolute;left:0;right:0;bottom:0;padding:16px 14px 15px;text-align:center;z-index:2}
.card .nm{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:.02em}
.card .ico{width:26px;height:26px;margin:0 auto 7px;color:var(--gold-bright);opacity:.95}
.card:active .art{transform:scale(1.04)}
.card .glow{position:absolute;inset:0;opacity:0;background:radial-gradient(60% 44% at 50% 44%,rgba(232,205,148,.28),transparent 70%);transition:opacity .5s}
.card.lit .glow{opacity:1}

/* deal row */
.deal{display:flex;gap:12px;justify-content:center;align-items:stretch;perspective:1200px}
.deal .card{flex:1 1 0;min-width:0;aspect-ratio:29/40;max-width:150px}
.deal .card{animation:dealin .8s cubic-bezier(.16,1,.3,1) both}
.deal .card:nth-child(1){animation-delay:.05s;transform:rotate(-3deg)}
.deal .card:nth-child(2){animation-delay:.16s}
.deal .card:nth-child(3){animation-delay:.27s;transform:rotate(3deg)}
@keyframes dealin{from{opacity:0;transform:translateY(40px) rotate(0) scale(.9)}}

/* library grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .card{aspect-ratio:29/40}
.grid .card .nm{font-size:16px}
.grid .card .cnt{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.06em}
.grid .card.locked .art{filter:grayscale(.7) brightness(.4)}
.grid .card.locked .lk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:26px;height:26px;color:var(--gold);opacity:.6;z-index:2}

/* fly reveal overlay */
#fly{position:fixed;inset:0;z-index:60;pointer-events:none;display:none}
#fly.on{display:block}
#flyDim{position:absolute;inset:0;background:rgba(6,7,10,0);transition:background .5s}
#flyCard{position:absolute;border-radius:20px;overflow:hidden;box-shadow:0 40px 90px -20px rgba(0,0,0,.9);
  transition:all .85s cubic-bezier(.16,1,.3,1)}
#flyCard .art{position:absolute;inset:0;background-size:cover;background-position:center}
#flyCard .frame{position:absolute;inset:8px;border:1px solid var(--line);border-radius:14px}

/* reveal panel */
.reveal-wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.rcard{width:230px;aspect-ratio:29/40;border-radius:20px;overflow:hidden;position:relative;
  box-shadow:var(--shadow);margin-bottom:6px}
.rcard .art{position:absolute;inset:0;background-size:cover;background-position:center}
.rcard .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,11,15,.6))}
.rcard .frame{position:absolute;inset:8px;border:1px solid var(--line);border-radius:14px}
.divider{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto;position:relative}
.divider::after{content:"";position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 8px var(--gold)}
.think{background:rgba(20,22,30,.5);border:1px solid var(--line-soft);border-radius:18px;
  padding:18px 20px;backdrop-filter:blur(6px)}
.think .lbl{font-family:var(--sans);font-size:12px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.think .q{font-family:var(--serif);font-size:18px;line-height:1.5}

/* choice cards (keep/release) */
.choice{display:flex;flex-direction:column;gap:14px}
.choice .c{display:flex;align-items:center;gap:16px;padding:20px 20px;border-radius:20px;
  border:1px solid var(--line-soft);background:rgba(20,22,30,.5);cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.choice .c:active{transform:scale(.99)}
.choice .c .cico{width:30px;height:30px;color:var(--gold-bright);flex-shrink:0}
.choice .c .ct{font-family:var(--serif);font-size:19px;font-weight:500}
.choice .c .cs{font-size:13.5px;color:var(--muted);margin-top:3px;font-weight:300}
.choice .c .cbgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.16;z-index:-1}

/* journey ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center}
.ring{position:relative;width:190px;height:190px;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border-radius:20px;border:1px solid var(--line-soft);
  font-size:13px;color:var(--muted);white-space:nowrap;background:rgba(20,22,30,.5)}
.chip.on{background:var(--gold);color:#20180c;border-color:transparent;font-weight:500}

/* calendar */
.cal{display:flex;justify-content:space-between;gap:4px}
.cal .d{flex:1;text-align:center;padding:10px 0;border-radius:14px;font-size:14px;color:var(--muted)}
.cal .d.now{background:rgba(201,162,94,.14);color:var(--gold-bright);font-weight:600;border:1px solid var(--line)}
.cal .d .dn{font-size:11px;color:var(--faint);display:block;margin-bottom:3px}

/* profile rows */
.prow{display:flex;align-items:center;gap:14px;padding:17px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.prow .pico{width:22px;height:22px;color:var(--gold);opacity:.8}
.prow .pt{flex:1;font-size:15.5px}
.prow .pa{color:var(--faint);width:16px;height:16px}
.stat{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.stat .sv{color:var(--gold-bright);font-weight:600;font-family:var(--serif);font-size:18px}
.stat .sl{color:var(--muted);font-size:14px;align-self:center}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:linear-gradient(180deg,rgba(10,11,15,.4),rgba(10,11,15,.96));
  backdrop-filter:blur(14px);border-top:1px solid var(--line-soft);
  padding:10px 0 max(10px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.nav button{background:none;border:none;color:var(--faint);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--sans);font-size:10.5px;letter-spacing:.04em}
.nav button.on{color:var(--gold-bright)}
.nav button svg{width:22px;height:22px}
.nav.hide{display:none}

/* sound toggle */
#snd{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;z-index:70;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line-soft);
  background:rgba(12,14,20,.5);backdrop-filter:blur(8px);color:var(--gold);cursor:pointer;
  display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .3s}
#snd:active{opacity:1;transform:scale(.94)}
#snd svg{width:19px;height:19px}

/* avatar */
.ava{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:var(--gold-bright);
  background:radial-gradient(circle at 40% 35%,rgba(201,162,94,.2),rgba(20,22,30,.6))}

.center{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.fadeup{animation:lift .7s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.11s}.d3{animation-delay:.18s}.d4{animation-delay:.26s}

/* dissolve on release */
@keyframes dissolve{
  0%{opacity:1;filter:blur(0)}
  100%{opacity:0;filter:blur(8px);transform:translateY(-30px) scale(1.06)}
}
.dissolving{animation:dissolve 1.1s ease forwards}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}

/* open-mission banner on home */
.mbanner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;
  border:1px solid var(--line);background:rgba(20,22,30,.6);backdrop-filter:blur(8px);
  text-align:right;box-shadow:0 12px 30px -14px rgba(0,0,0,.7)}
.mbanner .mi{width:30px;height:30px;color:var(--gold-bright);flex-shrink:0}
.mbanner .mt{flex:1;font-size:14.5px;line-height:1.45}
.mbanner .mk{font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:3px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.12s!important}
  canvas.dust{display:none}
}
</style>
</head>

<script>
//=================== DATA ===================
const WORLDS=[

// Drop a looping track at assets/audio/ambient.mp3 (or .m4a) and it plays here.
const MUSIC_SRC="assets/audio/ambient.mp3";
const MUSIC_VOL=0.5;
let bgm;
function soundOn(){return localStorage.getItem("mood_sound")!=="off"}
function fadeMusic(to,ms=800){
  if(!bgm)return;clearInterval(bgm._f);
  const from=bgm.volume,steps=Math.max(1,Math.round(ms/40));let i=0;
  bgm._f=setInterval(()=>{i++;const v=from+(to-from)*(i/steps);
    bgm.volume=Math.max(0,Math.min(1,v));
    if(i>=steps){clearInterval(bgm._f);bgm.volume=Math.max(0,Math.min(1,to));if(to<=0)bgm.pause();}},40);
}
function initAudio(){
  if(bgm)return;
  bgm=new Audio(MUSIC_SRC);bgm.loop=true;bgm.preload="auto";bgm.volume=0;
  bgm.addEventListener("error",()=>{bgm._missing=true;});
  if(soundOn()){bgm.play().then(()=>fadeMusic(MUSIC_VOL)).catch(()=>{});}
}

  const on=!soundOn();localStorage.setItem("mood_sound",on?"on":"off");
  if(!bgm)initAudio();

//=================== DUST (canvas particles) ===================
let dustLoops=[];
function startDust(cv){
  const ctx=cv.getContext("2d");let raf,parts=[],w,h,dpr=Math.min(2,devicePixelRatio||1);
  function size(){w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    parts=Array.from({length:Math.round(w*h/16000)},()=>mk());}
  function mk(){return{x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.3,
    vx:(Math.random()-.5)*.12,vy:-Math.random()*.28-.05,a:Math.random()*.5+.1,tw:Math.random()*Math.PI*2}}
  function loop(){ctx.clearRect(0,0,w,h);
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.tw+=.03;
      if(p.y<-4){p.y=h+4;p.x=Math.random()*w}
      const fl=(Math.sin(p.tw)*.4+.6);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fillStyle=`rgba(232,205,148,${p.a*fl})`;ctx.fill();}
    raf=requestAnimationFrame(loop);}
  size();loop();
  const on=()=>{if(!cv.isConnected){cancelAnimationFrame(raf);window.removeEventListener("resize",on2);return true}};
  const on2=()=>size();window.addEventListener("resize",on2);
  const guard=setInterval(()=>{if(on())clearInterval(guard)},1000);
}

       <button class="ib" id="shr" style="width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:rgba(20,22,30,.5);color:var(--gold);cursor:pointer">${svg("i-share","")}</button>
     </div>
     <div class="lift d4" style="width:100%;max-width:340px;margin-top:30px">
       <button class="btn" id="next"><span class="shimmer"></span>הצעד שלי היום</button>
     </div>
   </div>
  `,{bg:"night"});
  app.querySelectorAll("#fav svg,#shr svg").forEach(s=>s.style.width=s.style.height="22px");
  $("#fav").onclick=e=>{buzz();e.currentTarget.style.color="var(--gold-bright)";e.currentTarget.style.background="rgba(201,162,94,.18)"};
  $("#shr").onclick=()=>{buzz();navigator.share?navigator.share({title:"mood",text:w.line}).catch(()=>{}):null};
  $("#next").onclick=()=>{buzz();Mission(id)};
}

// THE MISSION — the card gives a small real-world action
function Mission(id){
  const w=W[id];
  screen(`
   <div class="safe-top"></div>
   <div class="pad grow center" style="text-align:center;padding-bottom:100px">
     <div class="ico lift" style="width:34px;height:34px;color:var(--gold-bright);margin:0 auto 14px">${svg(w.ic)}</div>
     <div class="kicker lift">הצעד שלך היום</div>
     <h1 class="lift d1 serif" style="margin:18px auto 0;max-width:340px;font-size:29px;line-height:1.35">${w.m}</h1>
     <div class="divider lift d2"></div>
     <p class="lead lift d2" style="max-width:300px;margin:0 auto 38px;font-size:15px">קח את זה איתך אל היום האמיתי. אין צורך להצליח — רק לנסות.</p>
     <div class="lift d3" style="width:100%;max-width:340px;margin:0 auto">
       <button class="btn" id="accept"><span class="shimmer"></span>אני בפנים</button>
       <button class="btn ghost" id="skip" style="height:50px;margin-top:12px">אולי מחר</button>
     </div>
   </div>
  `,{bg:"cave"});
  $("#accept").onclick=()=>{buzz(16);bell(440,1.6,.12);S.kept=S.kept||[];if(!S.kept.includes(id))S.kept.push(id);addMission(id);Today(id)};
  $("#skip").onclick=()=>{buzz();S.released++;S.lastPlay=Date.now();save();Released(id)};
}

// TODAY — the open commitment; confirm you did it (now or later)
function Today(id){
  const w=W[id];
  screen(`
   <div class="safe-top"></div>
   <div class="pad grow center" style="text-align:center;padding-bottom:100px">
     <div class="rcard lift" style="margin:0 auto 22px">
       <div class="art" style="background-image:url('${asset(id)}')"></div><div class="veil"></div><div class="frame"></div>
     </div>
     <div class="kicker lift d1">המשימה שלך פתוחה</div>
     <h2 class="lift d1 serif" style="margin:14px auto 0;max-width:330px">${w.m}</h2>
     <p class="lead lift d2" style="max-width:300px;margin:16px auto 36px;font-size:15px">כשתעשה את זה — חזור וסמן. הצעד שלך יהפוך לחלק ממי שאתה נעשה.</p>
     <div class="lift d3" style="width:100%;max-width:340px;margin:0 auto">
       <button class="btn" id="did"><span class="shimmer"></span>עשיתי את זה</button>
       <button class="btn ghost" id="later" style="height:50px;margin-top:12px">אחזור לזה מאוחר יותר</button>
     </div>
   </div>
  `,{bg:"night"});
  $("#did").onclick=()=>{buzz(20);const m=openMission();if(m){completeMission(m)}Becoming(id)};
  $("#later").onclick=()=>{buzz();S.day++;save();go("home")};
}

// BECOMING — the reward: evidence of who you're becoming
function Becoming(id){
  const w=W[id];
  becomingBurst(); shimmer(); buzz(30);
  screen(`
   <div class="safe-top"></div>
   <div class="pad grow center" style="text-align:center;padding-bottom:100px">
     <div class="lift" style="width:80px;height:80px;margin:0 auto 8px;position:relative">
       <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(232,205,148,.35),transparent 70%);animation:pulse 2.4s ease-in-out infinite"></div>
       <div class="ico" style="width:46px;height:46px;color:var(--gold-bright);position:absolute;inset:0;margin:auto">${svg(w.ic)}</div>
     </div>
     <div class="kicker lift d1">היום היית ${w.trait}</div>
     <h1 class="lift d1 serif" style="margin:16px auto 0;max-width:330px;font-size:30px;line-height:1.35">${becomingLine()}</h1>
     <div class="divider lift d2"></div>
     <p class="lead lift d2" style="max-width:300px;margin:0 auto 8px;font-size:15px">אספת רגע אמיתי. ${stepsWord(doneCount())} עד עכשיו.</p>
     <div class="lift d3" style="display:flex;gap:8px;justify-content:center;margin:22px 0 34px;flex-wrap:wrap;max-width:280px">
       ${Array.from({length:Math.min(doneCount(),24)}).map((_,k)=>`<div style="width:9px;height:9px;border-radius:50%;background:var(--gold);opacity:${.4+.6*Math.random()};box-shadow:0 0 6px var(--gold);animation:lift .5s ${k*.03}s both"></div>`).join("")}
     </div>
     <div class="lift d3" style="width:100%;max-width:340px;margin:0 auto">
       <button class="btn" id="done"><span class="shimmer"></span>סיום היום</button>
     </div>
   </div>
  `,{bg:"river"});
  $("#done").onclick=()=>{buzz();S.day++;save();go("journey")};
}
function becomingBurst(){setTimeout(releaseBurst,200)}

function Released(id){
  const w=W[id];
  const el=screen(`
   <div class="safe-top"></div>
   <div class="pad grow center" style="text-align:center;padding-bottom:100px">
     <div class="rcard" id="disc" style="margin:0 auto 26px">
       <div class="art" style="background-image:url('${asset(id)}')"></div><div class="veil"></div><div class="frame"></div>
     </div>
     <h1 class="serif" id="rtitle" style="opacity:0">שחררת את ${w.he}</h1>
     <p class="lead" id="rsub" style="max-width:320px;margin:16px auto 34px;opacity:0">זה בסדר לשחרר. אתה מפנה מקום למה שבא.</p>
     <div id="rbtn" style="width:100%;max-width:340px;margin:0 auto;opacity:0">
       <button class="btn" id="done2"><span class="shimmer"></span>סיום היום</button>
     </div>
   </div>
  `,{bg:"river"});
  setTimeout(()=>{$("#disc").classList.add("dissolving")},400);
  releaseBurst();
  setTimeout(()=>{["#rtitle","#rsub","#rbtn"].forEach((s,k)=>{const e=$(s);e.style.transition="opacity .7s";setTimeout(()=>e.style.opacity=s==="#rsub"?"1":"1",k*140)})},1200);
  const b=setInterval(()=>{const d=$("#done2");if(d){d.onclick=()=>{buzz();S.day++;save();go("journey")};clearInterval(b)}},200);
}
function releaseBurst(){
  const screens=app.querySelectorAll(".screen");const host=screens[screens.length-1]?.querySelector(".content");
  if(!host)return;
  const c=document.createElement("canvas");c.className="dust";c.style.zIndex=5;
  host.appendChild(c);
  const ctx=c.getContext("2d"),w=c.width=innerWidth,h=c.height=innerHeight;
  let ps=Array.from({length:60},()=>({x:w/2+(Math.random()-.5)*80,y:h*.36+(Math.random()-.5)*100,
    vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,a:1,r:Math.random()*3+1}));
  let t=0;(function loop(){ctx.clearRect(0,0,w,h);t++;
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.a-=.012;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`rgba(232,205,148,${Math.max(0,p.a)})`;ctx.fill()});
    if(t<120)requestAnimationFrame(loop);else c.remove();})();
}

//=================== LIBRARY ===================
function Library(){
  showNav(true);curNav="cards";
  const kept=S.kept||[];
  screen(`
   <div class="safe-top"></div>
   <div class="pad" style="margin-top:14px">
     <div class="kicker">הספרייה שלך</div>
     <h1 style="margin:10px 0 18px">ספריית הקלפים</h1>
     <div class="chips" style="margin-bottom:20px">
       <div class="chip on">הכל</div>
       ${WORLDS.slice(0,5).map(w=>`<div class="chip">${w.he}</div>`).join("")}
     </div>
   </div>
   <div class="pad">
     <div class="grid">
       ${WORLDS.map((w,i)=>{const unlocked=kept.includes(w.id)||i<3;return `
        <div class="card ${unlocked?'':'locked'}" data-id="${w.id}">
          <div class="art" style="background-image:url('${asset(w.id)}')"></div>
          <div class="veil"></div><div class="frame"></div>
          ${unlocked?"":`<div class="lk">${svg("i-lock")}</div>`}
          <div class="meta"><div class="ico">${svg(w.ic)}</div><div class="nm">${w.he}</div><div class="cnt">${unlocked?'נאסף':'נעול'}</div></div>
        </div>`}).join("")}
     </div>
     <div class="safe-bot"></div>
   </div>
  `,{bg:"profile"});
  app.querySelectorAll(".grid .card:not(.locked)").forEach(c=>c.onclick=()=>{buzz();CardDetail(c.dataset.id)});
}
function CardDetail(id){
  const w=W[id];
  screen(`
   <div class="safe-top"></div>
   <div class="pad grow center reveal-wrap" style="padding:24px 22px 110px">
     <div class="rcard lift"><div class="art" style="background-image:url('${asset(id)}')"></div><div class="veil"></div><div class="frame"></div></div>
     <div class="ico lift d1" style="width:30px;height:30px;color:var(--gold-bright);margin:14px 0 6px">${svg(w.ic)}</div>
     <h1 class="lift d1 serif">${w.he}</h1>
     <p class="lead lift d2" style="max-width:320px;margin:16px auto 0;color:var(--ink);font-size:17px">${w.line}</p>
     <div class="divider lift d2"></div>
     <div class="think lift d3" style="max-width:360px;width:100%"><div class="lbl">שאלת מחשבה</div><div class="q">${w.q}</div></div>
   </div>
  `,{bg:"night",back:()=>Library()});
}

//=================== JOURNEY ===================
function Journey(){
  showNav(true);curNav="journey";
  const pct=Math.min(100,Math.round(S.day/90*100));
  const days=[];const base=new Date();
  for(let k=-3;k<=3;k++){const d=new Date();d.setDate(base.getDate()+k);days.push({n:["א","ב","ג","ד","ה","ו","ש"][d.getDay()],num:d.getDate(),now:k===0})}
  screen(`
   <div class="safe-top"></div>
   <div class="pad" style="margin-top:14px;text-align:center">
     <div class="kicker">מי שאתה נעשה</div>
     <h1 class="serif" style="margin:14px auto 4px;max-width:330px;font-size:28px;line-height:1.35">${becomingLine()}</h1>
     <p class="lead" style="font-size:14.5px">${doneCount()?'כל צעד שעשית בעולם האמיתי נאסף כאן.':'המסע שלך מתחיל בצעד הראשון.'}</p>
   </div>
   <div class="pad center" style="align-items:center;margin:22px 0">
     <div class="ring">
       <svg viewBox="0 0 200 200" style="width:100%;height:100%;transform:rotate(-90deg)">
         <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(201,162,94,.14)" stroke-width="6"/>
         <circle cx="100" cy="100" r="86" fill="none" stroke="url(#gg)" stroke-width="6" stroke-linecap="round"
           stroke-dasharray="${540}" stroke-dashoffset="${540-540*pct/100}" style="transition:stroke-dashoffset 1.4s ease"/>
         <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8cd94"/><stop offset="1" stop-color="#a9863f"/></linearGradient></defs>
       </svg>
       <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
         <div class="serif" style="font-size:44px;color:var(--gold-bright)">${doneCount()}</div>
         <div class="tiny">צעדים אמיתיים</div>
       </div>
     </div>
   </div>
   <div class="pad">
     ${traitBars()}
     <div class="cal" style="margin:6px 0 22px">
       ${days.map(d=>`<div class="d ${d.now?'now':''}"><span class="dn">${d.n}</span>${d.num}</div>`).join("")}
     </div>
     <div style="background:rgba(20,22,30,.5);border:1px solid var(--line-soft);border-radius:20px;padding:6px 20px">
       <div class="stat"><span class="sl">צעדים שהשלמת</span><span class="sv">${doneCount()}</span></div>
       <div class="stat"><span class="sl">קלפים שאספת</span><span class="sv">${S.collected}</span></div>
       <div class="stat" style="border:none"><span class="sl">רצף המסע</span><span class="sv">${S.day} ימים</span></div>
     </div>
     <div class="safe-bot"></div>
   </div>
  `,{bg:"river"});
}
function traitBars(){
  const t=S.traits||{};const keys=Object.keys(t).sort((a,b)=>t[b]-t[a]).slice(0,5);
  if(!keys.length)return "";
  const max=Math.max(...keys.map(k=>t[k]));
  return `<div style="margin-bottom:22px">`+keys.map(k=>{const w=W[k];const pc=Math.round(t[k]/max*100);
    return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <span style="width:20px;height:20px;color:var(--gold);flex-shrink:0">${svg(w.ic)}</span>
      <span style="width:64px;font-size:13.5px;color:var(--muted)">${w.he}</span>
      <div style="flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden">
        <div style="height:100%;width:${pc}%;background:linear-gradient(90deg,#a9863f,#e8cd94);border-radius:4px"></div></div>
      <span style="font-size:12px;color:var(--gold-bright);width:16px;text-align:center">${t[k]}</span>
    </div>`}).join("")+`</div>`;
}

mountNav();
updSoundBtn();

(function boot(){
