#mood-hero{--choc:#241610;--acc:#C0682F;--ink:#2c1f16;position:relative;overflow:hidden;width:100%;height:100svh;min-height:640px;
  direction:rtl;font-family:"MoodHeebo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;
  background:radial-gradient(120% 82% at 50% 26%,#FFFFFF 0%,#FBF8F2 58%,#F3ECE0 100%);}
#mood-hero *{box-sizing:border-box;}
/* whisper-soft edge shading only */
#mood-hero .grade{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(125% 100% at 50% 58%,rgba(70,48,26,0) 68%,rgba(70,48,26,.045) 100%);}
/* ---- product stage ---- */
#mood-hero .stage{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);z-index:2;
  width:min(80vw,392px);aspect-ratio:1/1.32;will-change:transform,opacity;opacity:0;}
#mood-hero .halo{position:absolute;left:50%;top:46%;width:150%;height:122%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,250,242,.7),rgba(255,250,242,0) 70%);}
/* gauzy contact shadow — wide, very soft, low opacity */
#mood-hero .floor{position:absolute;left:50%;bottom:-6%;width:74%;height:11%;transform:translateX(-50%);z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(64,44,26,.22),rgba(64,44,26,0) 76%);filter:blur(8px);}
#mood-hero .el{position:absolute;will-change:transform;filter:drop-shadow(0 26px 36px rgba(58,36,16,.30));}
#mood-hero .bar{left:50%;top:50%;width:46%;z-index:5;}
#mood-hero .d{width:26.5%;left:50%;top:50%;z-index:8;}
/* ---- cocoa crumbs (few, subtle) ---- */
#mood-hero .crumb{position:absolute;width:7px;height:7px;border-radius:46% 54% 50% 50%/54% 46% 54% 46%;
  background:radial-gradient(circle at 35% 30%,#5a3720,#2c1a0e);opacity:.55;z-index:1;
  box-shadow:0 3px 6px rgba(60,36,16,.2);will-change:transform;}
#mood-hero .c1{left:9%;top:20%;}
#mood-hero .c2{left:86%;top:26%;width:6px;height:6px;}
#mood-hero .c3{left:14%;top:80%;width:5px;height:5px;}
#mood-hero .c4{left:82%;top:78%;width:6px;height:6px;}
/* ---- copy ---- */
#mood-hero .copy{position:absolute;left:0;right:0;bottom:clamp(26px,5.5vh,60px);text-align:center;padding:0 24px;z-index:6;}
#mood-hero .eyebrow{font-weight:800;letter-spacing:.34em;font-size:clamp(10px,2.4vw,12px);color:var(--acc);text-transform:uppercase;}
#mood-hero h1{margin:.62em 0 .34em;font-weight:900;line-height:1.0;letter-spacing:-.025em;
  font-size:clamp(33px,8.8vw,56px);color:var(--ink);}
#mood-hero h1 em{font-style:normal;color:var(--acc);}
#mood-hero .sub{margin:0 auto .95em;max-width:22em;font-weight:600;font-size:clamp(13px,3.4vw,16px);color:#7a6a58;line-height:1.4;}
#mood-hero .cta{display:inline-flex;align-items:center;gap:9px;padding:14px 32px;border-radius:100px;
  background:var(--choc);color:#F7F1E8;font-weight:800;font-size:clamp(15px,4vw,17px);text-decoration:none;
  box-shadow:0 16px 34px -12px rgba(36,22,16,.7);transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .3s;}
#mood-hero .cta:hover{transform:translateY(-2px);box-shadow:0 24px 46px -12px rgba(36,22,16,.72);}
#mood-hero .cta:active{transform:translateY(1px) scale(.99);}
#mood-hero .cta .ar{font-weight:900;font-size:1.05em;}
/* ---- graceful entrance (staggered) ---- */
#mood-hero .eyebrow,#mood-hero h1,#mood-hero .sub,#mood-hero .cta{opacity:0;transform:translateY(16px);
  transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);}
#mood-hero.in .eyebrow{opacity:1;transform:none;transition-delay:.35s}
#mood-hero.in h1{opacity:1;transform:none;transition-delay:.46s}
#mood-hero.in .sub{opacity:1;transform:none;transition-delay:.58s}
#mood-hero.in .cta{opacity:1;transform:none;transition-delay:.70s}
/* ---- wide screens: compact hero band (leaves the next section peeking), product on one side, copy on the other ---- */
@media(min-width:860px){
  #mood-hero{height:min(78svh,560px);min-height:440px;}
  #mood-hero .stage{left:66%;top:50%;width:min(24vw,290px);}
  #mood-hero .copy{left:auto;right:48%;bottom:auto;top:50%;transform:translateY(-50%);text-align:right;max-width:40%;padding-inline:0 clamp(24px,3vw,48px);}
  #mood-hero h1{font-size:clamp(38px,3.7vw,54px);}
  #mood-hero .sub{margin-inline:0;font-size:clamp(14px,1.15vw,17px);}
  #mood-hero .floor{bottom:2%;}
}
</style>

<script>
(function(){
  const hero=document.getElementById("mood-hero");
  const q=s=>hero.querySelector(s), qa=s=>[].slice.call(hero.querySelectorAll(s));
  const TAU=6.28318, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), easeOut=x=>1-Math.pow(1-clamp(x,0,1),3);
  const stage=q(".stage"), bar=q(".bar");
  const discs=[q(".d-bolt"),q(".d-wave"),q(".d-moon")].filter(Boolean);
  const crumbs=qa(".crumb").map((el,i)=>[el, 6+(i%3)*3, 10+i*0.7, i*1.6]);
  let tx=0,ty=0,cx=0,cy=0,t0=null;
  function onMove(e){const r=hero.getBoundingClientRect();const p=e.touches?e.touches[0]:e;
    tx=(p.clientX-r.left)/r.width-0.5;ty=(p.clientY-r.top)/r.height-0.5;}
  hero.addEventListener("pointermove",onMove,{passive:true});
  hero.addEventListener("touchmove",onMove,{passive:true});
  requestAnimationFrame(()=>requestAnimationFrame(()=>hero.classList.add("in")));   // trigger copy entrance
  function tick(now){
    if(t0==null)t0=now; const t=(now-t0)/1000;
    const intro=easeOut(t/1.15), gi=easeOut((t-0.15)/1.2);
    cx+=(tx-cx)*0.05; cy+=(ty-cy)*0.05;
    // stage eases in (fade + settle scale)
    stage.style.opacity=intro.toFixed(3);
    stage.style.transform="translate(-50%,-50%) scale("+(0.955+0.045*intro).toFixed(4)+")";
    // big bar: slow, refined bob + parallax
    bar.style.transform="translate(calc(-50% + "+(-cx*4).toFixed(1)+"px),calc(-50% + "+(-cy*4+Math.sin(t/8*TAU)*9).toFixed(1)+"px)) rotate("+(Math.sin(t/11*TAU)*0.6).toFixed(2)+"deg)";
    // discs orbit slowly on a tilted ellipse — behind the bar at the top, in front at the bottom
    const W=stage.clientWidth||360, RX=W*0.40, RY=W*0.44, Phi=t*0.13;
    discs.forEach((el,i)=>{
      const ang=Phi+i*(TAU/3), dep=Math.sin(ang);
      const rr=0.7+0.3*gi;                                  // discs ease outward into orbit on load
      const ox=Math.cos(ang)*RX*rr - cx*12, oy=dep*RY*rr - cy*12, sc=(0.9+0.1*gi)*(1+dep*0.12), rot=Math.sin(t*0.4+i*2)*4;
      el.style.transform="translate(calc(-50% + "+ox.toFixed(1)+"px),calc(-50% + "+oy.toFixed(1)+"px)) scale("+sc.toFixed(3)+") rotate("+rot.toFixed(1)+"deg)";
      el.style.zIndex = dep<-0.04 ? 2 : 8;
      el.style.opacity = (intro*(0.84+0.16*(dep*0.5+0.5))).toFixed(2);
      el.style.filter = "drop-shadow(0 "+(12+dep*7).toFixed(0)+"px "+(18+dep*8).toFixed(0)+"px rgba(58,36,16,"+(0.28+dep*0.08).toFixed(2)+"))";
    });
    for(const a of crumbs){const el=a[0],dur=a[2],ph=a[3];
      el.style.transform="translate("+(Math.cos(t/dur*TAU+ph)*5).toFixed(1)+"px,"+(Math.sin(t/dur*TAU+ph)*a[1]).toFixed(1)+"px) rotate("+(t*8+ph*30).toFixed(0)+"deg)";}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
