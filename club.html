/* ============================================================
   mood × Mayven — visual signature system
   Purple-lilac primary CTA, mint-green trust pills, yellow/blue
   tier badges, mint-green pull-quotes, all-white photo bg, warm
   self-care tone. NO dark sections.
   ============================================================ */
:root{
  --ink:#171512; --paper:#fff; --paper-soft:#f7f5ef; --line:#e3dbd0; --muted:#5f5b55;
  --cta:#b8b0e6;         /* Mayven purple-lilac CTA */
  --cta-dark:#5c4fa5;    /* pressed / outlined stroke */
  --mint:#d9f0d1;        /* trust pill bg */
  --mint-dark:#2f5b25;   /* dark green for stars/product names */
  --yellow:#ffec5c;      /* "הכי משתלם" */
  --blue:#c8e5f0;        /* "הכי נמכר" */
  --forest:#254821;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-weight:400;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
/* ---------- announce ---------- */
.ann{background:#111;color:#fff;padding:9px 4vw;font-size:12.5px;font-weight:600;text-align:center;letter-spacing:.02em}
.ann span{margin:0 8px}
.ann span+span:before{content:"|";margin-inline-end:12px;opacity:.6}
/* ---------- header ---------- */
header{padding:14px 4vw;display:flex;align-items:center;justify-content:space-between;background:var(--paper);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;padding:8px 22px;border:1.5px solid var(--ink);border-radius:999px;transition:background .2s}
.brand:hover{background:var(--paper-soft)}
.brand img{height:24px;width:auto;display:block}
nav{display:flex;gap:26px;font-size:14px;font-weight:600}
nav a:hover{opacity:.6}
.hactions{display:flex;gap:14px;align-items:center}
.hactions .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.hactions .ic:hover{background:var(--paper-soft)}
.hactions .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.hactions .bag{position:relative}
.hactions .bag b{position:absolute;top:-2px;left:-2px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:50%;display:grid;place-items:center;padding:0 5px}
@media(max-width:900px){nav{display:none}}
/* ---------- signin bar ---------- */
.signin{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 4vw;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.signin-txt{font-size:14px;font-weight:700;color:var(--ink)}
.signin-txt span{color:var(--muted);font-weight:500}
.signin-txt em{font-style:normal;color:var(--cta-dark);text-decoration:underline;text-underline-offset:3px;font-weight:700}
.pill{display:inline-flex;align-items:center;justify-content:center;padding:11px 24px;border-radius:999px;font-weight:700;font-size:14px;line-height:1;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s,color .18s}
.pill-mint{background:var(--mint);color:var(--forest)}
.pill-mint:hover{transform:translateY(-2px)}
.pill-cta{background:var(--cta);color:#fff;font-weight:800;box-shadow:0 6px 18px -6px rgba(92,79,165,.45)}
.pill-cta:hover{transform:translateY(-2px);background:var(--cta-dark)}
.pill-out{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.pill-out:hover{background:var(--ink);color:#fff}
.pill-dark{background:var(--ink);color:#fff}
.pill-dark:hover{transform:translateY(-2px);background:#000}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--paper-soft)}
.hero>img{width:100%;height:min(78vh,720px);object-fit:cover;object-position:center 45%;display:block;filter:brightness(.85)}
.hero-copy{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px 4vw;color:#fff}
.hero-copy .k{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:22px;opacity:.9}
.hero-copy h1{font-family:'DM Sans','Assistant',sans-serif;font-weight:400;font-size:clamp(52px,9vw,120px);line-height:.98;letter-spacing:-3px;margin:0 0 24px;max-width:1000px}
.hero-copy h1 b{font-weight:700}
.hero-copy p{font-size:clamp(15px,1.6vw,18px);margin:0 auto 32px;max-width:520px;line-height:1.5;font-weight:500;opacity:.95}
.hero-cta{display:inline-flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hero-cta .pill{padding:15px 34px;font-size:15px}
.hero-cta .pill-cta{background:#eeff54;color:#1e3212}
.hero-cta .pill-cta:hover{background:#deee42}
.hero-cta .pill-out{border-color:#fff;color:#fff}
.hero-cta .pill-out:hover{background:#fff;color:var(--ink)}
/* trust chips just below hero */
.tchips{padding:24px 4vw;background:var(--paper);border-bottom:1px solid var(--line)}
.tchips ul{list-style:none;margin:0;padding:0;max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px}
.tchip{display:inline-flex;align-items:center;padding:8px 16px;border:1px solid var(--forest);color:var(--forest);border-radius:999px;font-size:12.5px;font-weight:600;background:transparent}
/* ---------- SECTION SHELL ---------- */
.section{padding:80px 4vw}
.section-head{max-width:820px;margin:0 auto 42px;text-align:center}
.section-head .k{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:2.5px;color:var(--forest);text-transform:uppercase;margin:0 0 12px}
.section-head h2{font-family:'DM Sans','Assistant',sans-serif;font-size:clamp(36px,4.6vw,58px);line-height:1.02;letter-spacing:-1.5px;font-weight:500;margin:0 0 14px}
.section-head h2 b{font-weight:700}
.section-head p{color:var(--muted);font-size:17px;margin:0 auto;max-width:520px}
/* ---------- product cards row ---------- */
.pgrid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pc{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .28s,box-shadow .28s}
.pc:hover{transform:translateY(-4px);box-shadow:0 26px 60px -22px rgba(41,25,10,.16)}
.pc .tag{position:absolute;top:16px;inset-inline-start:16px;z-index:5;padding:6px 12px;border-radius:999px;font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:800;color:var(--ink);letter-spacing:1px;text-transform:uppercase}
.pc-media{position:relative;aspect-ratio:1;background:linear-gradient(160deg,var(--pale),#fff);display:grid;place-items:center;overflow:hidden}
.pc-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12%;transition:opacity .7s ease,transform .7s ease}
.pc-life{object-fit:cover!important;padding:0!important;opacity:0;transform:scale(1.02)}
.pc.hover-life .pc-life,.pc:hover .pc-life{opacity:1;transform:scale(1)}
.pc.hover-life .pc-pack,.pc:hover .pc-pack{opacity:0;transform:scale(.96)}
.pc-body{padding:22px 22px 26px;display:flex;flex-direction:column;flex:1;text-align:right}
.pc-moment{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.pc-h{font-family:'DM Sans','Assistant',sans-serif;font-size:26px;font-weight:700;color:var(--forest);margin:0 0 6px;letter-spacing:-.5px;line-height:1}
.pc-h span{display:block;margin-top:4px;font-family:'Assistant',sans-serif;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:0}
.pc-stars{display:flex;align-items:center;gap:6px;color:var(--forest);font-size:13.5px;letter-spacing:2px;margin:0 0 10px}
.pc-stars small{color:var(--muted);font-size:12px;font-family:'DM Sans',sans-serif;letter-spacing:0}
.pc-line{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 16px;min-height:42px}
.pc-price{margin:0 0 16px;display:flex;flex-direction:column;gap:2px}
.pc-price-main{display:flex;align-items:baseline;gap:8px}
.pc-price-main b{font-family:'DM Sans',sans-serif;font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.pc-price-main span{font-size:12px;color:var(--muted)}
.pc-price-from{font-size:11.5px;color:var(--muted);opacity:.8}
.pc .pill{width:100%}
/* ---------- ritual full-bleed ---------- */
.ritual{position:relative;min-height:min(78vh,640px);display:grid;place-items:center;overflow:hidden;background:#191714}
.ritual>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;filter:brightness(.85)}
.ritual::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.08) 55%,rgba(0,0,0,.15))}
.ritual .in{position:relative;z-index:2;color:#fff;text-align:center;max-width:900px;padding:40px 4vw}
.ritual .in .k{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;color:#f8ffde}
.ritual .in h2{font-family:'DM Sans','Assistant',sans-serif;font-weight:400;font-size:clamp(44px,7vw,88px);line-height:.98;letter-spacing:-2.5px;margin:0 0 20px}
.ritual .in h2 b{font-weight:700}
.ritual .in p{font-size:clamp(16px,1.7vw,20px);max-width:600px;margin:0 auto 28px;line-height:1.55}
/* ---------- offer strip (mint) ---------- */
.offer{background:var(--mint);color:var(--forest);text-align:center;padding:20px 4vw}
.offer b{font-weight:800}
/* ---------- reviews summary (mayven signature) ---------- */
.rvs{padding:80px 4vw;background:var(--paper-soft)}
.rvs-in{max-width:640px;margin:0 auto;text-align:center}
.rvs h2{font-family:'DM Sans','Assistant',sans-serif;font-size:36px;font-weight:600;letter-spacing:-1px;margin:0 0 26px}
.rvs-num{display:inline-flex;align-items:baseline;gap:14px;justify-content:center;margin:0 0 8px}
.rvs-num b{font-family:'DM Sans',sans-serif;font-size:72px;font-weight:700;line-height:1;color:var(--ink);letter-spacing:-3px}
.rvs-num .stars{color:var(--forest);font-size:24px;letter-spacing:3px}
.rvs-count{color:var(--muted);font-size:14px;margin:0 0 32px}
.rvs-bars{max-width:400px;margin:0 auto 34px;display:flex;flex-direction:column;gap:12px}
.rvs-row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;font-family:'DM Sans',sans-serif;font-size:13px}
.rvs-row .b{color:var(--forest);font-size:13px}
.rvs-row .bar{height:8px;background:#e6e2db;border-radius:999px;overflow:hidden}
.rvs-row .bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.rvs-row .n{color:var(--muted);text-align:right;min-width:40px}
/* individual quotes row */
.rvq-row{max-width:1200px;margin:36px auto 0;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.rvq{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.rvq-stars{color:var(--forest);letter-spacing:2px;font-size:14px}
.rvq p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink);flex:1}
.rvq small{color:var(--muted);font-size:12px}
.rvq small b{font-weight:800;color:var(--ink)}
/* ---------- CLUB ---------- */
.club{background:linear-gradient(180deg,var(--mint) 0%,#a8dc9d 100%);padding:0}
.club-in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:.9fr 1.1fr;min-height:500px;align-items:stretch}
.club-media{position:relative;overflow:hidden}
.club-media img{width:100%;height:100%;object-fit:cover;display:block}
.club-copy{padding:60px 5vw;color:var(--forest);text-align:right;direction:rtl;align-self:center}
.club-copy .k{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--forest);margin:0 0 10px}
.club-copy h2{font-family:'DM Sans','Assistant',sans-serif;font-size:clamp(36px,4.5vw,50px);line-height:1.02;letter-spacing:-1.5px;font-weight:500;margin:0 0 14px;color:var(--forest)}
.club-copy h2 b{font-weight:700}
.club-copy p{color:var(--forest);opacity:.85;font-size:16.5px;line-height:1.6;margin:0}
.club-copy .benes{list-style:none;padding:0;margin:20px 0;display:grid;gap:8px;font-size:14.5px;color:var(--forest)}
.club-copy .benes li::before{content:"✓ ";font-weight:900}
@media(max-width:900px){.club-in{grid-template-columns:1fr}.club-media{min-height:260px;order:1}.club-copy{order:2;padding:44px 24px;text-align:center}}
/* ---------- FAQ ---------- */
.faq{max-width:800px;margin:0 auto;padding:80px 4vw}
.faq h2{text-align:center;font-family:'DM Sans','Assistant',sans-serif;font-size:36px;font-weight:600;letter-spacing:-1px;margin:0 0 34px}
.fq{border-bottom:1px solid var(--line);padding:0}
.fq summary{list-style:none;padding:22px 0;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.fq summary::-webkit-details-marker{display:none}
.fq summary span{color:var(--forest);font-size:22px;font-weight:400;transition:transform .3s;line-height:1}
.fq[open] summary span{transform:rotate(45deg)}
.fq p{color:var(--muted);font-size:15px;line-height:1.7;padding:0 0 22px;margin:0}
/* ---------- footer ---------- */
footer{background:#111;color:#a09a90;padding:60px 4vw 30px}
.ft-in{max-width:1200px;margin:0 auto}
.ft-in .brand{border-color:#fff;background:#111}
.ft-in .brand img{filter:brightness(0) invert(1)}
footer .ftl{margin:22px 0 0;font-size:14px;color:#a09a90}
footer .fsocial{display:flex;gap:12px;margin:20px 0 0}
footer .fsocial a{width:36px;height:36px;border:1px solid #333;border-radius:50%;display:grid;place-items:center;color:#a09a90;transition:.2s}
footer .fsocial a:hover{color:var(--cta);border-color:var(--cta)}
footer .flinks{margin:28px 0;padding:22px 0;border-top:1px solid #222;border-bottom:1px solid #222;display:flex;flex-wrap:wrap;gap:22px;font-size:13px}
footer .flinks a:hover{color:#fff}
footer .fbase{font-size:12px;letter-spacing:.02em}
/* ---------- sticky mobile CTA + WhatsApp ---------- */
.smb{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:none;gap:12px;align-items:center;box-shadow:0 -8px 22px rgba(0,0,0,.06)}
.smb-info{flex:1}
.smb-info b{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink)}
.smb-info small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.smb a{padding:12px 22px}
@media(max-width:900px){.smb{display:flex}body{padding-bottom:70px}}
.fwapp{position:fixed;bottom:22px;left:22px;z-index:90;width:52px;height:52px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(37,211,102,.4);transition:transform .22s}
.fwapp:hover{transform:translateY(-3px) scale(1.05)}
.fwapp svg{width:26px;height:26px}
@media(max-width:900px){.fwapp{bottom:84px;left:16px;width:48px;height:48px}.fwapp svg{width:22px;height:22px}}
/* ---------- responsive ---------- */
@media(max-width:900px){
  .pgrid{grid-template-columns:1fr;max-width:520px;margin:0 auto}
  .rvq-row{grid-template-columns:1fr;max-width:520px;margin:36px auto 0}
  .section{padding:60px 4vw}
  .signin{gap:12px}
  .signin-txt{font-size:13px;order:2;flex:1}
  header{padding:12px 16px}
  .hactions{gap:8px}
}


/* ============================================================
   v38 differentiation overrides — added after the Mayven-tokens
   so they win by cascade order. Rectangular shape system + warm
   chocolate/gold palette.
   ============================================================ */
:root {
  --cta: #2c1d16;       /* chocolate primary — was #b8b0e6 lilac */
  --cta-dark: #1a1109;  /* deeper chocolate hover                */
  --gold: #c69130;      /* warm brass accent                     */
  --gold-soft: #e8c880; /* softer gold for hover / medals        */
  --paper: #fdfaf3;     /* warmer than pure white                */
  --paper-soft: #f5eee4;/* cream instead of #f7f5ef              */
}
body { background: var(--paper); }

/* SHAPE — rectangles with soft corners (chocolate-square echo) */
.brand { border-radius: 8px !important; padding: 8px 18px !important; }
.pill  { border-radius: 10px !important; }
.pill-cta { box-shadow: 0 8px 20px -8px rgba(44,29,22,.4) !important; }
.tag,
.pc .tag,
.tier-tag,
.bundle-disc,
.sold,
.sold-pill,
.gal-tag,
.pull { border-radius: 6px !important; }
.pc, .rvq, .xs, .club { border-radius: 12px !important; }
.tier { border-radius: 10px !important; }
.trust-chips .tchip,
.tchip { border-radius: 4px !important; }

/* COLOR — pill CTAs use chocolate not lilac; stars & rating in gold */
.pill-cta {
  background: var(--cta) !important; color: #fdfaf3 !important;
}
.pill-cta:hover { background: var(--cta-dark) !important; }
.pill-out { border-color: var(--cta) !important; color: var(--cta) !important; }
.pill-out:hover { background: var(--cta) !important; color: #fdfaf3 !important; }
.pill-dark { background: var(--cta) !important; }
/* Active tier border chocolate */
.tier.active { border-color: var(--cta) !important; background: #f9f4ea !important; }
/* Stars → gold */
.rvs-num .stars, .buy-rate .stars, .rvq-stars, .pc-stars,
.stars, [class*="stars"] { color: var(--gold) !important; }
/* review bars in chocolate */
.rvs-row .bar i { background: var(--cta) !important; }
.rvs-row .b { color: var(--cta) !important; }
/* highlighted pull-quote — keep mint but border-radius reduced (above) */

/* announce bar keeps dark */
.ann { background: #171009 !important; }

/* hero — video overrides */
.hero {
  position: relative !important;
  min-height: min(88vh, 780px) !important;
  overflow: hidden !important;
  background: #1a1109 !important;
}
.hero-video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0; pointer-events: none;
}
.hero > img { display: none !important; }  /* replace the static hero img */
.hero .shade,
.hero::before {
  background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55)) !important;
  z-index: 1 !important;
}
.hero-copy, .heroText, .heroStats, .hero-in {
  position: relative !important; z-index: 2 !important;
}

/* PRODUCT CARDS — make the PACK big & the body tight (Mayven-style) */
.pc { min-height: 0 !important; }
.pc-media {
  aspect-ratio: 1 / 1.05 !important;   /* slightly taller than square */
  padding: 0 !important;
}
.pc-media img.pc-pack {
  padding: 5% 8% !important;            /* pack fills 90% instead of 66% */
  filter: drop-shadow(0 20px 30px rgba(41,25,10,.22));
}
.pc-body {
  padding: 18px 20px 20px !important;
}
.pc-moment { margin-bottom: 4px !important; font-size: 10.5px !important; }
.pc-h { font-size: 22px !important; margin-bottom: 2px !important; }
.pc-h span { font-size: 15px !important; margin-top: 2px !important; }
.pc-line { display: none !important; }  /* remove the descriptive line — Mayven doesn't have it on the card */
.pc-stars { margin-bottom: 8px !important; font-size: 12.5px !important; }
.pc-price { margin-bottom: 12px !important; }
.pc-price-main b { font-size: 22px !important; }
.pc-price-from { font-size: 11px !important; }

/* v38.3 — slim champion strip (same height family as trust chips row) */
.champstrip {
  background: linear-gradient(90deg, #1a1109 0%, #2c1d16 100%);
  color: #f7ecd8;
  padding: 14px 4vw;
  border-top: 1px solid #3a2416;
  border-bottom: 1px solid #3a2416;
  direction: rtl;
}
.champstrip-in {
  max-width: 1240px; margin: 0 auto;
  display: flex; align-items: center; gap: 18px; justify-content: center;
  flex-wrap: wrap;
}
.champstrip-avatar {
  width: 52px; height: 44px; border-radius: 6px;
  background: #111 center/cover no-repeat;
  border: 1.5px solid #c69130;
  flex: none;
}
.champstrip-text {
  font-family: 'DM Sans', 'Assistant', sans-serif;
  font-size: 15px; font-weight: 700; letter-spacing: -.2px;
  color: #fdfaf3;
}
.champstrip-text b { color: #ffec5c; font-weight: 800; }
.champstrip-text .sep { color: #8a7d6a; margin: 0 10px; font-weight: 400; }
.champstrip-medal {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 800; letter-spacing: 1.5px;
  padding: 5px 11px; background: rgba(198,145,48,.18);
  border: 1px solid rgba(198,145,48,.4); border-radius: 6px;
  color: #e8c880; text-transform: uppercase;
}
@media (max-width: 640px) {
  .champstrip-in { gap: 12px; }
  .champstrip-text { font-size: 13.5px; text-align: center; }
  .champstrip-medal { font-size: 10.5px; padding: 4px 8px; }
}

/* v38.2 — home polish: hide prices on cards, hide desktop hamburger */
.pc .pc-price, .pc .pc-price-main, .pc .pc-price-from { display: none !important; }
.pc .pc-body { padding-bottom: 22px !important; }
.pc-stars { margin-bottom: 14px !important; }
@media (min-width: 900px) {
  .hactions button.ic { display: none !important; }
}



/* v38.3 — product-card polish (Mayven-tight tiles) */
.pgrid { gap: 22px !important; }
.pc {
  border-radius: 18px !important;
  border: 1px solid #ece2ce !important;
  overflow: hidden !important;
  background: var(--paper) !important;
  transition: transform .28s cubic-bezier(.19,1,.22,1), box-shadow .28s !important;
}
.pc:hover {
  transform: translateY(-6px) !important;
  box-shadow: 0 30px 60px -28px rgba(41,25,10,.22) !important;
}
.pc-media {
  aspect-ratio: 1 / 1.08 !important;
  background: linear-gradient(160deg, var(--pale), #fff) !important;
  padding: 0 !important;
}
.pc-media img.pc-pack {
  padding: 4% 6% !important;
  filter: drop-shadow(0 22px 32px rgba(41,25,10,.24)) !important;
  opacity: 1 !important; transform: scale(1) !important;
}
/* CRITICAL — lifestyle overlay must be hidden by default, not visible */
.pc-media img.pc-life {
  opacity: 0 !important;
  transform: scale(1.04) !important;
  object-fit: cover !important;
  padding: 0 !important;
}
.pc:hover .pc-life { opacity: 1 !important; transform: scale(1) !important; }
.pc:hover .pc-pack { opacity: 0 !important; transform: scale(.94) !important; }

/* the corner tag pill — consistent size + position on all cards */
.pc > .tag {
  position: absolute !important;
  top: 14px !important; inset-inline-start: 14px !important;
  z-index: 5;
  padding: 6px 12px !important;
  border-radius: 6px !important;
  font-family: 'DM Sans','Assistant',sans-serif !important;
  font-size: 11px !important; font-weight: 800 !important; letter-spacing: 1.4px !important;
  text-transform: uppercase;
  box-shadow: 0 4px 12px -6px rgba(0,0,0,.15);
}

/* body — a touch more air, tighter kicker, consistent CTA */
.pc-body { padding: 24px 24px 26px !important; }
.pc-moment {
  font-family: 'DM Sans', sans-serif !important;
  font-size: 11px !important; letter-spacing: 2.4px !important;
  text-transform: uppercase; color: var(--muted) !important;
  margin-bottom: 6px !important;
}
.pc-h { font-size: 26px !important; letter-spacing: -.6px !important; margin-bottom: 4px !important; }
.pc-h span { display: block; font-size: 15px !important; font-weight: 500 !important; margin-top: 3px !important; color: var(--muted) !important; }
.pc-stars { color: var(--gold) !important; font-size: 13px !important; margin: 10px 0 16px !important; }
.pc-stars small { color: var(--muted); margin-inline-start: 6px; font-weight: 500; letter-spacing: 0; }
.pc-body .pill-cta {
  width: 100% !important; text-align: center !important;
  padding: 14px 20px !important; font-size: 14.5px !important;
  border-radius: 10px !important;
}

/* v38.1 — hero content bottom-anchored + chocolate/cream CTA buttons on video */
.hero { min-height: min(88vh, 780px) !important; }
.hero .hero-copy {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: flex-end !important;
  padding: 0 4vw 68px !important;
  text-align: center !important;
}
.hero .hero-copy h1 { font-size: clamp(46px, 7.5vw, 96px) !important; }
.hero .hero-copy p { max-width: 540px; }
.hero .hero-cta .pill-cta {
  background: #f7ecd8 !important; color: #2c1d16 !important;
  box-shadow: 0 10px 24px -8px rgba(0,0,0,.35) !important;
}
.hero .hero-cta .pill-cta:hover { background: #ffffff !important; color: #1a1109 !important; }
.hero .hero-cta .pill-out {
  border: 1.5px solid rgba(247,236,216,.65) !important; color: #f7ecd8 !important; background: transparent !important;
}
.hero .hero-cta .pill-out:hover { background: #f7ecd8 !important; color: #1a1109 !important; }
@media(max-width:640px) {
  .hero .hero-copy { padding-bottom: 42px !important; }
  .hero .hero-copy .k { margin-bottom: 14px !important; }
  .hero .hero-copy h1 { margin-bottom: 16px !important; letter-spacing: -1.6px !important; }
  .hero .hero-copy p { margin-bottom: 22px !important; }
}


/* v39 — polish pack */

/* Signin bar — Mayven-style: single line, tight, well-aligned in RTL */
.signin {
  padding: 12px 4vw !important;
  gap: 12px !important;
  justify-content: center !important;
  flex-wrap: wrap !important;
  min-height: 52px;
  align-items: center !important;
  border-bottom: 1px solid var(--line) !important;
}
.signin-txt {
  font-size: 14px !important; font-weight: 600 !important;
  color: var(--ink) !important; line-height: 1.35 !important;
  text-align: center !important; flex: none !important;
}
.signin-txt br { display: none; }  /* one line only */
.signin-txt span { color: var(--muted) !important; font-weight: 500; margin-inline-start: 6px; }
.signin-txt em { color: var(--cta-dark) !important; }
.signin .pill {
  padding: 9px 22px !important;
  font-size: 13.5px !important;
  border-radius: 8px !important;
  order: -1;   /* button first in RTL row = left of text */
  background: var(--mint) !important;
  color: var(--forest) !important;
  border: 1px solid rgba(37,72,33,.25) !important;
  transition: all .18s;
}
.signin .pill:hover {
  background: var(--forest) !important; color: #fff !important;
  transform: translateY(-1px);
}
@media(max-width: 720px) {
  .signin-txt { font-size: 13px !important; }
  .signin-txt br { display: block; }
}

/* Trust chips — Mayven-style: soft mint pills, subtle */
.tchips { padding: 20px 4vw !important; background: var(--paper) !important; border-bottom: 1px solid var(--line) !important; }
.tchips ul { gap: 8px 10px !important; }
.tchip {
  padding: 9px 18px !important;
  border-radius: 999px !important;
  background: var(--mint) !important;
  border: 1px solid rgba(37,72,33,.15) !important;
  color: var(--forest) !important;
  font-family: 'Assistant', sans-serif !important;
  font-size: 13px !important; font-weight: 700 !important;
  letter-spacing: -.1px !important;
  display: inline-flex !important; align-items: center !important; gap: 6px;
}
.tchip::before {
  content: "✓"; font-size: 11px; font-weight: 900;
  color: var(--gold);
}

/* Nuclear force-hide the hamburger on desktop */
@media (min-width: 900px) {
  header .hactions button.ic,
  header .hactions button[aria-label="תפריט"] {
    display: none !important;
    visibility: hidden !important;
  }
}

/* Product cards — remove the empty gap left by pc-moment removal */
.pc-body .pc-moment { display: none !important; }
.pc-body { padding-top: 20px !important; }

.pill-cta,
.pc-body .pill-cta,
.hero .pill-cta {

/* Product card text — Mayven style: centered under image, not right-flush */
.pc-body {
  text-align: center !important;

}
.pc-body .pc-h { text-align: center !important; }
.pc-stars { justify-content: center !important; display: flex !important; }
.pc-body .pc-line { text-align: center !important; }
.pc-body .pill-cta { display: inline-flex !important; width: auto !important; padding: 12px 34px !important; }

/* Slight card breathing room */
.pc { padding: 0 !important; }


/* v41 — LIVE CTA color: warm amber/copper (echoes ENERGY orange + gold accent) */
.pill-cta,
.pc-body .pill-cta,
.hero .pill-cta,
.blog-cta .pill-cta,
.jbottom .pill-cta,
.fcta .pill-cta {

  box-shadow:

    inset 0 -2px 0 rgba(0,0,0,.14),
    0 12px 26px -10px rgba(164,90,32,.55) !important;
  font-weight: 800 !important;
  letter-spacing: -.1px !important;
  transition: transform .18s cubic-bezier(.34,1.56,.64,1),
              box-shadow .22s ease,
              background .22s ease !important;
}
.pill-cta:hover,
.pc-body .pill-cta:hover,
.hero .pill-cta:hover,
.blog-cta .pill-cta:hover,
.jbottom .pill-cta:hover,
.fcta .pill-cta:hover {
  background: linear-gradient(180deg, #e29a5c 0%, #b16528 100%) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,240,210,.45),
    inset 0 -2px 0 rgba(0,0,0,.12),
    0 16px 34px -10px rgba(164,90,32,.6),
    0 0 0 1px rgba(255,236,92,.3) !important;
  transform: translateY(-2px) !important;
}
/* On the dark chocolate hero, keep the cream pill (readable on dark video) */
.hero .hero-cta .pill-cta {
  background: #f7ecd8 !important;
  color: #2c1d16 !important;
  border: 1px solid rgba(0,0,0,.15) !important;
  text-shadow: none !important;
  box-shadow: 0 10px 24px -8px rgba(0,0,0,.4) !important;
}
.hero .hero-cta .pill-cta:hover {
  background: #ffffff !important;
  transform: translateY(-2px) !important;
  box-shadow: 0 14px 30px -8px rgba(0,0,0,.5), 0 0 0 1px rgba(198,145,48,.35) !important;
}
/* Dark-CTA bottom sections keep cream fill for contrast */
.fcta .pill-cta, .jbottom .pill-cta, .blog-cta .pill-cta {
  background: #f7ecd8 !important;
  color: #2c1d16 !important;
  border: 1px solid rgba(0,0,0,.12) !important;
  text-shadow: none !important;
  box-shadow: 0 10px 22px -8px rgba(0,0,0,.4) !important;
}


/* v42 — soft & delicate CTA (per user: יותר עדין ורך) */
.pill-cta,
.pc-body .pill-cta,
.hero .pill-cta,
.blog-cta .pill-cta,
.jbottom .pill-cta,
.fcta .pill-cta {

:root {
  --ink:#171512; --paper:#fdfaf3; --paper-soft:#f5eee4; --line:#e3d8c6; --muted:#5f5b55;
  --cta:#2c1d16; --cta-dark:#1a1109;
  --gold:#c69130; --gold-soft:#e8c880;
  --mint:#d9f0d1; --forest:#254821;
  --yellow:#ffec5c; --blue:#c8e5f0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Assistant,Arial,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
.ann{background:#171009;color:#f4e9db;padding:9px 4vw;font-size:12.5px;font-weight:600;text-align:center;letter-spacing:.02em}
.ann span{margin:0 8px} .ann span+span:before{content:"|";margin-inline-end:12px;opacity:.6}
header{padding:14px 4vw;display:flex;align-items:center;justify-content:space-between;background:var(--paper);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;padding:8px 18px;border:1.5px solid var(--ink);border-radius:8px;transition:background .2s}
.brand:hover{background:var(--paper-soft)}
.brand img{height:24px}
nav{display:flex;gap:26px;font-size:14px;font-weight:600} nav a:hover{opacity:.6} nav a.on{color:var(--forest)}
.hactions{display:flex;gap:14px;align-items:center;color:var(--ink)}
.hactions .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.hactions .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
@media(max-width:900px){nav{display:none}}

.pill{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:10px;font-weight:700;font-size:15px;line-height:1;cursor:pointer;border:0;font-family:inherit;text-decoration:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s}
.pill-cta{background:var(--cta);color:#fdfaf3;font-weight:800;box-shadow:0 8px 20px -8px rgba(44,29,22,.4)}
.pill-cta:hover{background:var(--cta-dark);transform:translateY(-2px)}
.pill-out{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.pill-out:hover{background:var(--ink);color:#fdfaf3}
.pill-cream{background:#f7ecd8;color:var(--cta-dark)} .pill-cream:hover{background:#fff}

/* ==== HERO ==== */
.hero{position:relative;overflow:hidden;min-height:min(84vh,760px);display:flex;align-items:flex-end;padding:0 4vw 64px}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.85)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.65));z-index:1}
.hero-in{position:relative;z-index:2;max-width:820px;margin:0 auto;text-align:center;color:#fdfaf3}
.hero .k{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:3.4px;text-transform:uppercase;color:#e8c880;margin:0 0 18px}
.hero h1{font-family:'DM Sans','Assistant',sans-serif;font-weight:500;font-size:clamp(42px,7vw,88px);line-height:.98;letter-spacing:-2.2px;margin:0 0 22px;color:#fdfaf3}
.hero h1 b{font-weight:700;color:#ffec5c}
.hero-sub{font-size:clamp(15px,1.6vw,18px);color:#d9c9b3;max-width:520px;margin:0 auto 28px;line-height:1.55}
.hero-cta{display:inline-flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hero-badges{display:flex;justify-content:center;gap:12px 20px;margin:24px 0 0;flex-wrap:wrap;font-size:12.5px;color:#e8c880;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.hero-badges span::before{content:"✓";margin-inline-end:6px;color:#ffec5c}

/* ==== BENEFITS — image tile grid (2x2) ==== */
.benefits{padding:70px 4vw 30px;background:var(--paper)}
.stitle{max-width:820px;margin:0 auto 40px;text-align:center;direction:rtl}
.stitle .k{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
.stitle h2{font-family:'DM Sans','Assistant',sans-serif;font-size:clamp(32px,4.2vw,52px);line-height:1.02;letter-spacing:-1.5px;font-weight:500;margin:0 0 12px}
.stitle h2 b{font-weight:700} .stitle p{color:var(--muted);font-size:16px;max-width:520px;margin:0 auto}
.btiles{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.btile{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#111}
.btile img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.19,1,.22,1)}
.btile:hover img{transform:scale(1.04)}
.btile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 40%,rgba(0,0,0,.85));z-index:1;pointer-events:none}
.btile-b{position:absolute;bottom:0;left:0;right:0;padding:22px 22px 24px;z-index:2;color:#fdfaf3;text-align:right;direction:rtl}
.btile-b .ic{width:32px;height:32px;border-radius:8px;background:rgba(247,236,216,.15);border:1px solid rgba(247,236,216,.3);display:grid;place-items:center;margin-bottom:12px;color:#ffec5c}
.btile-b .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.btile-b b{display:block;font-family:'DM Sans','Assistant',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px;color:#fff}
.btile-b span{font-size:13px;color:#d9c9b3;line-height:1.4;display:block}
@media(max-width:900px){.btiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.btiles{grid-template-columns:1fr;max-width:340px;margin:0 auto}.btile{aspect-ratio:16/10}}

/* ==== HOW IT WORKS — photo cards ==== */
.how{padding:70px 4vw 40px;background:var(--paper-soft)}
.hgrid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hstep{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:right;direction:rtl}
.hstep-img{aspect-ratio:16/10;overflow:hidden}
.hstep-img img{width:100%;height:100%;object-fit:cover}
.hstep-b{padding:22px 24px 26px;position:relative}
.hstep-b b.step{position:absolute;top:20px;inset-inline-start:22px;font-family:'DM Sans',sans-serif;font-size:32px;font-weight:800;color:var(--gold);letter-spacing:-1.5px;line-height:1;opacity:.55}
.hstep-b h3{font-family:'DM Sans','Assistant',sans-serif;font-size:19px;font-weight:800;color:var(--ink);margin:36px 0 6px;letter-spacing:-.4px}
.hstep-b p{color:var(--muted);font-size:14px;line-height:1.55;margin:0}
@media(max-width:900px){.hgrid{grid-template-columns:1fr;max-width:460px;margin:0 auto}}

/* ==== PRICES + QUOTE (2-col) ==== */
.pq{padding:70px 4vw;background:var(--paper)}
.pq-in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:stretch;direction:rtl}
.ptable{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ptable table{width:100%;border-collapse:collapse}
.ptable th, .ptable td{padding:16px 20px;text-align:right;font-size:14.5px;border-bottom:1px solid var(--line)}
.ptable thead th{background:var(--paper-soft);font-family:'DM Sans','Assistant',sans-serif;font-size:13.5px;font-weight:800;color:var(--forest);letter-spacing:.02em}
.ptable tbody th{font-weight:700;color:var(--ink)}
.ptable .yes{color:var(--forest);font-weight:800} .ptable .no{color:#c9b6a6}
.ptable .highlight{background:#fdfaee}
.ptable tfoot td{padding:20px;background:var(--paper-soft);text-align:center;font-size:13px;color:var(--muted);border:0}
.qcard{background:linear-gradient(180deg,var(--cta),var(--cta-dark));border-radius:14px;overflow:hidden;color:#f7ecd8;display:flex;flex-direction:column}
.qcard-img{aspect-ratio:16/10;overflow:hidden;background:#111}
.qcard-img img{width:100%;height:100%;object-fit:cover;opacity:.85}
.qcard-b{padding:28px 30px 30px;flex:1;display:flex;flex-direction:column;justify-content:center;text-align:right}
.qcard-b .k{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.4px;color:var(--gold-soft);margin:0 0 12px}
.qcard-b q{font-family:'DM Sans','Assistant',sans-serif;font-size:20px;line-height:1.35;color:#fdfaf3;font-weight:500;letter-spacing:-.4px;quotes:"„" "" "'" "'"}
.qcard-b q::before{content:open-quote;color:var(--gold);margin-inline-end:4px}
.qcard-b q::after{content:close-quote;color:var(--gold);margin-inline-start:4px}
.qcard-b small{display:block;margin-top:16px;font-size:12.5px;color:#8a7d6a;font-weight:700;letter-spacing:.04em}
@media(max-width:900px){.pq-in{grid-template-columns:1fr}}

/* ==== WHAT YOU CHOOSE ==== */
.inc{padding:70px 4vw;background:var(--paper-soft)}
.igrid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.itile{background:var(--paper);border-radius:14px;overflow:hidden;text-align:right;direction:rtl;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s}
.itile:hover{transform:translateY(-4px);box-shadow:0 22px 44px -22px rgba(23,21,18,.2)}
.itile img{width:100%;aspect-ratio:1/1;object-fit:cover}
.itile-b{padding:20px 22px 24px}
.itile-b b{display:block;font-family:'DM Sans','Assistant',sans-serif;font-size:22px;font-weight:800;color:var(--forest);letter-spacing:-.5px;margin-bottom:4px}
.itile-b span{color:var(--muted);font-size:14px;display:block;margin-bottom:10px}
.itile-b .goto{font-family:'DM Sans','Assistant',sans-serif;font-size:13px;font-weight:800;color:var(--cta)}
@media(max-width:900px){.igrid{grid-template-columns:1fr;max-width:420px;margin:0 auto}}

/* ==== FAQ (compact 2-col) ==== */
.faq{max-width:1240px;margin:0 auto;padding:70px 4vw;direction:rtl}
.faq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px;margin-top:34px}
.fq{border-bottom:1px solid var(--line)}
.fq summary{list-style:none;padding:18px 0;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.fq summary::-webkit-details-marker{display:none}
.fq summary span{color:var(--gold);font-size:22px;font-weight:400;transition:transform .3s;line-height:1}
.fq[open] summary span{transform:rotate(45deg)}
.fq p{color:var(--muted);font-size:14.5px;line-height:1.65;padding:0 0 18px;margin:0}
@media(max-width:800px){.faq-grid{grid-template-columns:1fr}}

.fcta h2 b{font-weight:700}
.fcta p{font-size:17px;color:#d9c9b3;margin:0 0 30px;line-height:1.6}
.fcta small{display:block;margin-top:16px;font-size:12.5px;color:#8a7d6a}

/* v43 — Full Mayven-style footer with subtle 'mood' watermark */
.mfoot {
  position: relative;
  background: #0f0a05;
  color: #d9c9b3;
  padding: 80px 4vw 0;
  overflow: hidden;
  font-family: 'Assistant', sans-serif;
  direction: rtl;
}
.mfoot-mark {
  position: absolute;
  bottom: -60px; left: 50%;
  transform: translateX(-50%);
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: clamp(280px, 42vw, 640px);
  letter-spacing: -22px;
  color: rgba(247,236,216,.05);
  line-height: 1;
  pointer-events: none;
  user-select: none;
  z-index: 0;
  white-space: nowrap;
}
.mfoot-in {
  position: relative; z-index: 1;
  max-width: 1240px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 60px 40px;
  padding-bottom: 60px;
}
.mfoot-brand .brand { border-radius: 8px; padding: 8px 18px; }
.mfoot-tag {
  color: #a09a90;
  font-size: 14px;
  line-height: 1.6;
  margin: 20px 0 26px;
  max-width: 300px;
}
.mfoot-news-l {
  display: block;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 800; letter-spacing: 2.5px;
  color: #e8c880;
  text-transform: uppercase;
  margin: 0 0 12px;
}
.mfoot-news-row {
  display: flex; gap: 8px;
  background: rgba(247,236,216,.06);
  border: 1px solid rgba(247,236,216,.15);
  border-radius: 10px;
  padding: 4px;
  max-width: 320px;
  margin: 0 0 10px;
}
.mfoot-news-row input {
  flex: 1;
  background: transparent;
  border: 0;
  padding: 10px 12px;
  color: #fdfaf3;
  font: inherit; font-size: 14px;
  outline: none;
  direction: rtl;
}
.mfoot-news-row input::placeholder { color: #6b625a; }
.mfoot-news-row button {
  background: #f7ecd8;
  color: #1a1109;
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  font: inherit; font-weight: 800; font-size: 13.5px;
  cursor: pointer;
  transition: background .18s;
}
.mfoot-news-row button:hover { background: #fff; }
.mfoot-brand small { font-size: 12px; color: #6b625a; }

.mfoot-col h4 {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 2.4px;
  color: #e8c880;
  text-transform: uppercase;
  margin: 0 0 20px;
}
.mfoot-col ul { list-style: none; margin: 0 0 20px; padding: 0; }
.mfoot-col li { margin: 0 0 10px; }
.mfoot-col a {
  color: #d9c9b3;
  text-decoration: none;
  font-size: 14.5px;
  transition: color .18s;
}
.mfoot-col a:hover { color: #fdfaf3; text-decoration: underline; text-underline-offset: 4px; }

.mfoot-social {
  display: flex; gap: 10px; margin: 4px 0 0;
}
.mfoot-social a {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(247,236,216,.2);
  color: #d9c9b3;
  display: grid; place-items: center;
  transition: all .2s;
}
.mfoot-social a:hover {
  background: #f7ecd8;
  border-color: #f7ecd8;
  color: #1a1109;
  transform: translateY(-2px);
}

.mfoot-strip {
  position: relative; z-index: 1;
  border-top: 1px solid rgba(247,236,216,.1);
  padding: 24px 0;
}
.mfoot-strip-in {
  max-width: 1240px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 20px;
}
.mfoot-pay { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mfoot-pay .pay {
  width: 44px; height: 28px;
  border-radius: 4px;
  display: grid; place-items: center;
  font-family: Arial, sans-serif; font-weight: 900; font-size: 11px; letter-spacing: .5px;
  color: #fff; background: #1a1f71;
}
.mfoot-pay .pay-mc { background: #fff; position: relative; border: 1px solid #ddd; }
.mfoot-pay .pay-mc span:nth-child(1) { position: absolute; left: 8px; top: 5px; width: 18px; height: 18px; background: #eb001b; border-radius: 50%; }
.mfoot-pay .pay-mc span:nth-child(2) { position: absolute; right: 8px; top: 5px; width: 18px; height: 18px; background: #f79e1b; border-radius: 50%; mix-blend-mode: multiply; }
.mfoot-pay .pay-amex { background: #016fd0; font-size: 10px; }
.mfoot-pay .pay-apple { background: #000; font-weight: 600; font-size: 10px; }
.mfoot-pay .pay-bit { background: #00b4c5; font-weight: 900; }
.mfoot-pay .pay-gpay { background: #fff; border: 1px solid #ddd; color: #5f6368; font-weight: 600; font-size: 9px; }

.mfoot-legal {
  color: #6b625a;
  font-size: 12.5px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  letter-spacing: .02em;
}
.mfoot-legal a { color: #a09a90; text-decoration: none; transition: color .18s; }
.mfoot-legal a:hover { color: #fdfaf3; }

@media (max-width: 900px) {
  .mfoot-in { grid-template-columns: 1fr 1fr; gap: 40px 30px; }
  .mfoot-brand { grid-column: 1 / -1; }
  .mfoot-mark { font-size: clamp(160px, 60vw, 380px); letter-spacing: -12px; bottom: -30px; }
  .mfoot-strip-in { justify-content: center; text-align: center; }
}
@media (max-width: 520px) {
  .mfoot-in { grid-template-columns: 1fr; }
  .mfoot { padding: 60px 5vw 0; }
}
